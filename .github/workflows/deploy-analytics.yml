name: 📊 Deploy Analytics Multi-Environment

run-name: >-
  ${{ (github.event.inputs.environment || 'testing') == 'ambos'
    && format('🟡+🔴 TESTING+PRODUCCIÓN → {0} | {1} | by {2}', github.ref_name, github.sha, github.actor)
    || (github.event.inputs.environment || 'testing') == 'production'
    && format('🔴 PRODUCCIÓN → {0} | {1} | by {2}', github.ref_name, github.sha, github.actor)
    || format('🟡 TESTING → {0} | {1} | by {2}', github.ref_name, github.sha, github.actor) }}

concurrency:
  group: analytics-${{ github.ref }}-${{ github.event.inputs.environment || 'testing' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno (ambos = testing primero; production solo si testing tiene éxito)'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - production
          - ambos
      scope:
        description: 'Qué publicar (all = 004 + SQL + 021)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - 004
          - sql
          - 021
          - 004+sql
      confirm_production:
        description: 'Obligatorio si environment es production o ambos'
        required: false
        default: false
        type: boolean
      skip_copy:
        description: 'Prod: no clonar Analytics prod→testing (clon ya fresco)'
        required: false
        default: false
        type: boolean
      allow_figure_change:
        description: 'Prod: permitir que v_se P/R se muevan vs el clon'
        required: false
        default: false
        type: boolean

env:
  CI: 'true'
  YEAR: '2026'

jobs:
  validate:
    name: ✅ Pre-flight
    runs-on: self-hosted
    steps:
      # No uses: actions/checkout@v4 — Fortinet en 104 rompe TLS a github.com
      # (Timesheet solo pasa porque tiene el action en caché). Clone Gitea local.
      - name: 📥 Checkout Analytics
        env:
          APPS_CLONE_PASSWORD: ${{ secrets.APPS_CLONE_PASSWORD }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE:-.}"
          mkdir -p "$dest"
          cd "$dest"
          if [[ -f scripts/deploy-analytics.sh ]]; then
            echo "✅ Workspace con repo $(git rev-parse --short HEAD 2>/dev/null || echo '?')"
            exit 0
          fi
          echo "Clonando admin/superset-analytics desde Gitea local"
          python3 - <<'PY'
          import os, shutil, subprocess, tempfile, urllib.parse
          dest = os.getcwd()
          sha = os.environ.get("GITHUB_SHA") or ""
          token = os.environ.get("GITHUB_TOKEN") or ""
          pw = os.environ.get("APPS_CLONE_PASSWORD") or ""
          if token:
              auth = "oauth2:" + urllib.parse.quote(token, safe="")
          elif pw:
              auth = "admin:" + urllib.parse.quote(pw, safe="")
          else:
              raise SystemExit("Falta GITHUB_TOKEN y secret APPS_CLONE_PASSWORD")
          url = "http://%s@127.0.0.1:3000/admin/superset-analytics.git" % auth
          tmp = tempfile.mkdtemp(prefix="analytics-co-")
          repo = os.path.join(tmp, "repo")
          try:
              subprocess.check_call(["git", "clone", "--depth", "1", url, repo])
              if sha:
                  subprocess.call(["git", "-C", repo, "fetch", "--depth", "1", "origin", sha])
                  subprocess.call(["git", "-C", repo, "checkout", "--force", sha])
              for name in os.listdir(repo):
                  src = os.path.join(repo, name)
                  dst = os.path.join(dest, name)
                  if os.path.exists(dst):
                      shutil.rmtree(dst) if os.path.isdir(dst) else os.remove(dst)
                  shutil.move(src, dst)
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          print("Checkout OK", (sha[:12] if sha else "HEAD"))
          PY

      - name: 🛠️ Ensure deploy tools
        run: |
          set -e
          if command -v sshpass >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1; then
            echo "✅ sshpass y python3 disponibles"
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq sshpass curl jq openssh-client python3
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache openssh-client sshpass curl jq python3
          else
            echo "❌ No se pueden instalar herramientas" >&2
            exit 1
          fi

      - name: 🔒 Confirm production
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment || 'testing' }}"
          CONFIRM="${{ github.event.inputs.confirm_production }}"
          if [[ "$ENV" == "production" || "$ENV" == "ambos" ]]; then
            if [[ "$CONFIRM" != "true" && "$CONFIRM" != "True" ]]; then
              echo "❌ Production/ambos exige confirm_production = true" >&2
              exit 1
            fi
            echo "✅ confirm_production OK para $ENV"
          else
            echo "🟡 Solo testing — no hace falta confirm_production"
          fi

      - name: 🧾 Validate workflow JSON
        run: |
          set -euo pipefail
          python3 -m json.tool src/workflows/004_sync_bc_to_ps_analytics.json >/dev/null
          python3 -m json.tool src/workflows/021_health_check_analytics_bc.json >/dev/null
          echo "✅ JSON 004 y 021 válidos"
          chmod +x scripts/deploy-analytics.sh scripts/deploy-004-gated.sh scripts/deploy-n8n-workflow-021.sh scripts/apply-bi-views.sh

  deploy-testing:
    name: 🚀 Deploy to testing
    runs-on: self-hosted
    needs: [validate]
    timeout-minutes: 30
    if: ${{ (github.event.inputs.environment || 'testing') == 'testing' || github.event.inputs.environment == 'ambos' }}
    environment:
      name: testing
    steps:
      - name: 📥 Checkout Analytics
        env:
          APPS_CLONE_PASSWORD: ${{ secrets.APPS_CLONE_PASSWORD }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE:-.}"
          mkdir -p "$dest"
          cd "$dest"
          if [[ -f scripts/deploy-analytics.sh ]]; then
            echo "✅ Workspace con repo $(git rev-parse --short HEAD 2>/dev/null || echo '?')"
            exit 0
          fi
          echo "Clonando admin/superset-analytics desde Gitea local"
          python3 - <<'PY'
          import os, shutil, subprocess, tempfile, urllib.parse
          dest = os.getcwd()
          sha = os.environ.get("GITHUB_SHA") or ""
          token = os.environ.get("GITHUB_TOKEN") or ""
          pw = os.environ.get("APPS_CLONE_PASSWORD") or ""
          if token:
              auth = "oauth2:" + urllib.parse.quote(token, safe="")
          elif pw:
              auth = "admin:" + urllib.parse.quote(pw, safe="")
          else:
              raise SystemExit("Falta GITHUB_TOKEN y secret APPS_CLONE_PASSWORD")
          url = "http://%s@127.0.0.1:3000/admin/superset-analytics.git" % auth
          tmp = tempfile.mkdtemp(prefix="analytics-co-")
          repo = os.path.join(tmp, "repo")
          try:
              subprocess.check_call(["git", "clone", "--depth", "1", url, repo])
              if sha:
                  subprocess.call(["git", "-C", repo, "fetch", "--depth", "1", "origin", sha])
                  subprocess.call(["git", "-C", repo, "checkout", "--force", sha])
              for name in os.listdir(repo):
                  src = os.path.join(repo, name)
                  dst = os.path.join(dest, name)
                  if os.path.exists(dst):
                      shutil.rmtree(dst) if os.path.isdir(dst) else os.remove(dst)
                  shutil.move(src, dst)
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          print("Checkout OK", (sha[:12] if sha else "HEAD"))
          PY

      - name: 📥 Checkout power-solution-apps (scripts n8n + copy)
        env:
          APPS_CLONE_PASSWORD: ${{ secrets.APPS_CLONE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${APPS_CLONE_PASSWORD:-}"
          if [[ -z "$PASS" ]]; then
            echo "❌ Falta secret APPS_CLONE_PASSWORD en admin/superset-analytics" >&2
            exit 1
          fi
          python3 -c "
          import os, urllib.parse, subprocess
          pw = os.environ['APPS_CLONE_PASSWORD']
          url = 'http://admin:%s@192.168.36.104:3000/admin/power-solution-apps.git' % urllib.parse.quote(pw, safe='')
          subprocess.check_call(['git', 'clone', '--depth', '1', '--branch', 'main', url, '_apps'])
          "
          echo "APPS_ROOT=$GITHUB_WORKSPACE/_apps" >> "$GITHUB_ENV"

      - name: 🛠️ Ensure deploy tools
        run: |
          set -e
          command -v sshpass >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq sshpass openssh-client python3 curl
          }

      - name: 🟡 Apply Analytics → testing
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-analytics.sh scripts/deploy-004-gated.sh scripts/apply-bi-views.sh
          ./scripts/deploy-analytics.sh \
            --env testing \
            --yes \
            --scope "${{ github.event.inputs.scope || 'all' }}" \
            --year "${YEAR}"

  deploy-production:
    name: 🚀 Deploy to production
    runs-on: self-hosted
    needs: [validate, deploy-testing]
    timeout-minutes: 120
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (
          github.event.inputs.environment == 'production' ||
          (
            github.event.inputs.environment == 'ambos' &&
            needs.deploy-testing.result == 'success'
          )
        )
      }}
    environment:
      name: production
    steps:
      - name: 📥 Checkout Analytics
        env:
          APPS_CLONE_PASSWORD: ${{ secrets.APPS_CLONE_PASSWORD }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE:-.}"
          mkdir -p "$dest"
          cd "$dest"
          if [[ -f scripts/deploy-analytics.sh ]]; then
            echo "✅ Workspace con repo $(git rev-parse --short HEAD 2>/dev/null || echo '?')"
            exit 0
          fi
          echo "Clonando admin/superset-analytics desde Gitea local"
          python3 - <<'PY'
          import os, shutil, subprocess, tempfile, urllib.parse
          dest = os.getcwd()
          sha = os.environ.get("GITHUB_SHA") or ""
          token = os.environ.get("GITHUB_TOKEN") or ""
          pw = os.environ.get("APPS_CLONE_PASSWORD") or ""
          if token:
              auth = "oauth2:" + urllib.parse.quote(token, safe="")
          elif pw:
              auth = "admin:" + urllib.parse.quote(pw, safe="")
          else:
              raise SystemExit("Falta GITHUB_TOKEN y secret APPS_CLONE_PASSWORD")
          url = "http://%s@127.0.0.1:3000/admin/superset-analytics.git" % auth
          tmp = tempfile.mkdtemp(prefix="analytics-co-")
          repo = os.path.join(tmp, "repo")
          try:
              subprocess.check_call(["git", "clone", "--depth", "1", url, repo])
              if sha:
                  subprocess.call(["git", "-C", repo, "fetch", "--depth", "1", "origin", sha])
                  subprocess.call(["git", "-C", repo, "checkout", "--force", sha])
              for name in os.listdir(repo):
                  src = os.path.join(repo, name)
                  dst = os.path.join(dest, name)
                  if os.path.exists(dst):
                      shutil.rmtree(dst) if os.path.isdir(dst) else os.remove(dst)
                  shutil.move(src, dst)
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          print("Checkout OK", (sha[:12] if sha else "HEAD"))
          PY

      - name: 📥 Checkout power-solution-apps (scripts n8n + copy)
        env:
          APPS_CLONE_PASSWORD: ${{ secrets.APPS_CLONE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${APPS_CLONE_PASSWORD:-}"
          if [[ -z "$PASS" ]]; then
            echo "❌ Falta secret APPS_CLONE_PASSWORD en admin/superset-analytics" >&2
            exit 1
          fi
          python3 -c "
          import os, urllib.parse, subprocess
          pw = os.environ['APPS_CLONE_PASSWORD']
          url = 'http://admin:%s@192.168.36.104:3000/admin/power-solution-apps.git' % urllib.parse.quote(pw, safe='')
          subprocess.check_call(['git', 'clone', '--depth', '1', '--branch', 'main', url, '_apps'])
          "
          echo "APPS_ROOT=$GITHUB_WORKSPACE/_apps" >> "$GITHUB_ENV"

      - name: 🛠️ Ensure deploy tools
        run: |
          set -e
          command -v sshpass >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq sshpass openssh-client python3 curl
          }

      - name: 🔴 Apply Analytics → production (gate)
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-analytics.sh scripts/deploy-004-gated.sh \
            scripts/deploy-n8n-workflow-021.sh scripts/apply-bi-views.sh
          extra=()
          if [[ "${{ github.event.inputs.skip_copy }}" == "true" ]]; then
            extra+=(--skip-copy)
          fi
          if [[ "${{ github.event.inputs.allow_figure_change }}" == "true" ]]; then
            extra+=(--allow-figure-change)
          fi
          ./scripts/deploy-analytics.sh \
            --env production \
            --yes \
            --scope "${{ github.event.inputs.scope || 'all' }}" \
            --year "${YEAR}" \
            "${extra[@]+"${extra[@]}"}"
