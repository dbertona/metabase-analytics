  function findDashboardSimulatorHost() {
    if (!isDashboardPage()) return null;

    // Preferir la fila de metadatos (usuario + «hace …»)
    var nodes = Array.prototype.slice.call(
      document.querySelectorAll("span,div,a")
    );
    var agoNode = nodes.find(function (el) {
      var t = (el.textContent || "").trim().toLowerCase();
      if (!t || t.length > 40) return false;
      return /(\bago\b|\bhace\b)/.test(t);
    });
    if (agoNode) {
      var meta = agoNode.parentElement;
      while (
        meta &&
        meta.parentElement &&
        meta.parentElement !== document.body &&
        meta.childElementCount < 2
      ) {
        meta = meta.parentElement;
      }
      var row = meta && meta.parentElement ? meta.parentElement : meta;
      if (row) {
        var host = document.getElementById(PS_SIM_HOST_ID);
        if (!host) {
          host = document.createElement("div");
          host.id = PS_SIM_HOST_ID;
        }
        if (host.parentElement !== row) {
          // Insertar antes del pill de usuario / metadatos
          if (meta && meta.parentElement === row) {
            row.insertBefore(host, meta);
          } else {
            row.insertBefore(host, row.firstChild);
          }
        }
        return host;
      }
    }

    var header =
      document.querySelector('[data-test="dashboard-header"]') ||
      document.querySelector(".dashboard-header") ||
      document.querySelector(".header-with-actions");
    if (!header) return null;
    var host2 = document.getElementById(PS_SIM_HOST_ID);
    if (!host2) {
      host2 = document.createElement("div");
      host2.id = PS_SIM_HOST_ID;
    }
    if (host2.parentElement !== header) {
      header.appendChild(host2);
    }
    return host2;
  }

  function placeSimulatorInDashboard(root) {
    var host = findDashboardSimulatorHost();
    if (host) {
      if (root.parentElement !== host) host.appendChild(root);
      return true;
    }
    if (root.parentElement !== document.body) {
      document.body.appendChild(root);
    }
    return false;
  }

  function mountUserSimulator(me, resources) {
    ensureSimulatorStyles();
    applyDashboardChromeMode();

    var existing = document.getElementById(PS_SIM_MOUNT_ID);
    if (existing) {
      placeSimulatorInDashboard(existing);
      return;
    }

    var realEmail = (me.email || me.username || "").trim().toLowerCase();
    var realLocal = realEmail.split("@")[0] || "?";
    var selectedEmail = readSimulatedEmail();
    var selected = resources.find(function (r) {
      return (r.email || "").toLowerCase() === selectedEmail;
    });
    if (selected) {
      setSimulatedUserState(selected.email, selected.name);
    } else {
      setSimulatedUserState("", "");
      selectedEmail = "";
    }

    var root = document.createElement("div");
    root.id = PS_SIM_MOUNT_ID;
    root.title = "Simular usuario (Admin/Alpha/PS_Testing)";

    var label = document.createElement("span");
    label.textContent = "🧪";
    root.appendChild(label);

    var wrap = document.createElement("div");
    wrap.style.position = "relative";

    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = selected
      ? selected.name
      : "Real (" + realLocal + ")";
    input.autocomplete = "off";
    wrap.appendChild(input);

    var list = null;
    var searchTerm = "";

    function closeList() {
      if (list && list.parentNode) list.parentNode.removeChild(list);
      list = null;
    }

    function choose(email, name) {
      setSimulatedUserState(email, name);
      searchTerm = "";
      input.value = "";
      input.placeholder = email
        ? name || email
        : "Real (" + realLocal + ")";
      closeList();
      refreshDisplayedUserName();
      console.log(
        email
          ? "[PS] Simulando usuario: " + name + " <" + email + ">"
          : "[PS] Simulación desactivada → usuario real"
      );
      // Forzar reaplicación de ámbito departamento (tras sync session servidor)
      try {
        sessionStorage.removeItem(PS_DEPT_SCOPE_KEY);
      } catch (err) {
        /* ignore */
      }
      syncServerSimulation(email).then(function () {
        applyDepartmentScope();
      });
    }

    function renderList() {
      closeList();
      list = document.createElement("div");
      list.className = "ps-sim-list";

      var realItem = document.createElement("div");
      realItem.className =
        "ps-sim-item" + (!selectedEmail ? " active" : "");
      realItem.textContent = "🔄 Real (" + realLocal + ")";
      realItem.addEventListener("mousedown", function (ev) {
        ev.preventDefault();
        selectedEmail = "";
        choose("", "");
      });
      list.appendChild(realItem);

      var term = searchTerm.toLowerCase().trim();
      var filtered = resources.filter(function (r) {
        if (!term) return true;
        return (
          (r.name || "").toLowerCase().indexOf(term) !== -1 ||
          (r.email || "").toLowerCase().indexOf(term) !== -1
        );
      });

      if (!filtered.length) {
        var empty = document.createElement("div");
        empty.className = "ps-sim-item";
        empty.style.cursor = "default";
        empty.style.color = "#666";
        empty.textContent = "No encontrado";
        list.appendChild(empty);
      } else {
        filtered.slice(0, 80).forEach(function (r) {
          var item = document.createElement("div");
          var email = (r.email || "").toLowerCase();
          item.className =
            "ps-sim-item" + (email === selectedEmail ? " active" : "");
          item.textContent = r.name || email;
          item.title = email;
          item.addEventListener("mousedown", function (ev) {
            ev.preventDefault();
            selectedEmail = email;
            choose(email, r.name || email);
          });
          list.appendChild(item);
        });
      }
      wrap.appendChild(list);
    }

    input.addEventListener("focus", function () {
      renderList();
    });
    input.addEventListener("input", function () {
      searchTerm = input.value || "";
      renderList();
    });
    document.addEventListener("mousedown", function (ev) {
      if (!root.contains(ev.target)) closeList();
    });

    root.appendChild(wrap);
    placeSimulatorInDashboard(root);
    console.log(
      "[PS] Combo simulación listo (" + resources.length + " recursos, Admin/Alpha/PS_Testing)"
    );

    // SPA: reubicar si la cabecera se re-renderiza
    var tries = 0;
    var relocate = setInterval(function () {
      tries += 1;
      placeSimulatorInDashboard(root);
      if (tries > 40) clearInterval(relocate);
    }, 500);
  }

  async function initUserSimulator() {
    // /api/v1/me/ no incluye roles → la autorización la decide /ps/resources
    // (Admin/Alpha/PS_Testing → 200; Viewer → 403; anónimo → 401).
    var me = await fetchMe();
    if (!me) return;
    try {
      var res = await fetch(appRoot() + "/api/v1/ps/resources", {
        credentials: "include",
      });
      if (res.status === 401 || res.status === 403) {
        // Sin simulación: igual aplicar ámbito del usuario real
        return;
      }
      if (!res.ok) {
        console.warn("[PS] /api/v1/ps/resources →", res.status);
        return;
      }
      var payload = await res.json();
      if (!payload || !payload.can_simulate) {
        return;
      }
      var resources = payload.result || [];
      mountUserSimulator(me, resources);
      refreshDisplayedUserName();
    } catch (err) {
      console.warn("[PS] No se pudo cargar recursos de simulación", err);
    }
  }

  // ─── Ámbito departamento (paridad PBI: vacío/999 = ver todo) ────────────
  var PS_DEPT_FILTER_ID = "NATIVE_FILTER-DEPT";
  var PS_DEPT_SCOPE_KEY = "psDeptScopeApplied";

  function risonQuote(value) {
    return "'" + String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
  }

  function buildDeptNativeFiltersRison(dept) {
    var v = risonQuote(dept);
    return (
      "(" +
      PS_DEPT_FILTER_ID +
      ":(__cache:(label:" +
      v +
      ",validateStatus:!f,value:!(" +
      v +
      ")),extraFormData:(filters:!((col:department_code,op:IN,val:!(" +
      v +
      ")))),filterState:(label:" +
      v +
      ",validateStatus:!f,value:!(" +
      v +
      ")),id:" +
      PS_DEPT_FILTER_ID +
      ",ownState:()))"
    );
  }

  // ── Ocultar filtro Departamentos cuando el ámbito está forzado (RLS) ──
  // Evita confusión: el chip con la X sugiere que se puede “ver todo”, pero
  // el servidor ya restringe. Ocultamos el control entero del panel.

  var PS_DEPT_LOCK_STYLE_ID = "ps-dept-lock-style";
  var _deptLockObserver = null;
  var _deptLockActive = false;
  var _deptHideRunning = false;

  function _findDeptFilterContainers() {
    var found = [];
    var seen = new Set();

    function add(el) {
      if (!el || seen.has(el)) return;
      seen.add(el);
      found.push(el);
    }

    // Combobox / control con id del filtro nativo
    document
      .querySelectorAll(
        '[name="' +
          PS_DEPT_FILTER_ID +
          '"], [aria-label="' +
          PS_DEPT_FILTER_ID +
          '"], [data-test*="' +
          PS_DEPT_FILTER_ID +
          '"], #' +
          PS_DEPT_FILTER_ID
      )
      .forEach(function (ctrl) {
        // Subir hasta el bloque del filtro (título + control)
        var block =
          ctrl.closest(".filter-item") ||
          ctrl.closest("[data-test='filter-control-container']") ||
          ctrl.closest(".ant-collapse-item") ||
          ctrl.closest("[class*='FilterControl']") ||
          ctrl.closest("[class*='filter-control']");
        if (!block) {
          // Heurística: contenedor que incluye el heading "Departamentos"
          var p = ctrl.parentElement;
          for (var i = 0; i < 8 && p; i++) {
            var txt = (p.textContent || "").trim();
            if (
              /^Departamentos?/m.test(txt) &&
              p.querySelector("h4, .ant-collapse-header, [class*='title']")
            ) {
              block = p;
              break;
            }
            p = p.parentElement;
          }
        }
        add(block || ctrl);
      });

    // Fallback: heading "Departamentos" en el panel de filtros
    var panel =
      document.querySelector("[data-test='dashboard-filters-panel']") ||
      document.querySelector(".dashboard-filters-panel") ||
      document.body;
    panel.querySelectorAll("h4, .ant-collapse-header, [class*='FilterTitle']").forEach(
      function (h) {
        var t = (h.textContent || "").replace(/\s+/g, " ").trim();
        if (!/^Departamentos?$/i.test(t)) return;
        var block =
          h.closest(".filter-item") ||
          h.closest(".ant-collapse-item") ||
          h.closest("[data-test='filter-control-container']") ||
          h.parentElement;
        add(block);
      }
    );

    return found;
  }

  function _injectDeptLockCss() {
    if (document.getElementById(PS_DEPT_LOCK_STYLE_ID)) return;
    var s = document.createElement("style");
    s.id = PS_DEPT_LOCK_STYLE_ID;
    s.textContent =
      "/* Ocultar control nativo Departamentos cuando RLS fuerza ámbito */\n" +
      "[name='" +
      PS_DEPT_FILTER_ID +
      "'],\n" +
      "[aria-label='" +
      PS_DEPT_FILTER_ID +
      "'],\n" +
      "[data-test*='" +
      PS_DEPT_FILTER_ID +
      "'],\n" +
      "#" +
      PS_DEPT_FILTER_ID +
      ",\n" +
      ".filter-item:has([name='" +
      PS_DEPT_FILTER_ID +
      "']),\n" +
      ".filter-item:has([aria-label='" +
      PS_DEPT_FILTER_ID +
      "']),\n" +
      ".ant-collapse-item:has([name='" +
      PS_DEPT_FILTER_ID +
      "']),\n" +
      ".ant-collapse-item:has([aria-label='" +
      PS_DEPT_FILTER_ID +
      "']),\n" +
      "[data-test='filter-control-container']:has([name='" +
      PS_DEPT_FILTER_ID +
      "']),\n" +
      "[data-test='filter-control-container']:has([aria-label='" +
      PS_DEPT_FILTER_ID +
      "']) {\n" +
      "  display: none !important;\n" +
      "}\n" +
      "/* Marcados por JS */\n" +
      ".ps-dept-filter-hidden { display: none !important; }\n";
    document.head.appendChild(s);
  }

  function _hideDeptFilterItems() {
    if (!_deptLockActive) return;
    _injectDeptLockCss();
    // Evitar reentrada: setear class/style dispara MutationObserver si observa
    // attributes → bucle infinito → UI congelada en "Loading…".
    if (_deptHideRunning) return;
    _deptHideRunning = true;
    try {
      _findDeptFilterContainers().forEach(function (el) {
        if (el.getAttribute("data-ps-dept-hidden") === "1") return;
        el.classList.add("ps-dept-filter-hidden");
        el.style.setProperty("display", "none", "important");
        el.setAttribute("data-ps-dept-hidden", "1");
      });
    } finally {
      _deptHideRunning = false;
    }
  }

  function _startDeptLockObserver() {
    _deptLockActive = true;
    _injectDeptLockCss();
    _hideDeptFilterItems();
    if (_deptLockObserver) return;
    var panel =
      document.querySelector("[data-test='dashboard-filters-panel']") ||
      document.querySelector(".dashboard-filters-panel") ||
      document.body;
    _deptLockObserver = new MutationObserver(function () {
      if (!_deptLockActive || _deptHideRunning) return;
      // Solo childList: NO observar attributes (class/style) — provoca bucle.
      _hideDeptFilterItems();
    });
    _deptLockObserver.observe(panel, {
      childList: true,
      subtree: true,
    });
    // Reintentos: el panel de filtros a veces pinta tarde
    [300, 800, 1600, 3000].forEach(function (ms) {
      setTimeout(function () {
        if (_deptLockActive) _hideDeptFilterItems();
      }, ms);
    });
  }

  function _stopDeptLockObserver() {
    _deptLockActive = false;
    if (_deptLockObserver) {
      _deptLockObserver.disconnect();
      _deptLockObserver = null;
    }
    document.querySelectorAll("[data-ps-dept-hidden='1'], .ps-dept-filter-hidden").forEach(
      function (el) {
        el.classList.remove("ps-dept-filter-hidden");
        el.style.removeProperty("display");
        el.removeAttribute("data-ps-dept-hidden");
      }
    );
    var s = document.getElementById(PS_DEPT_LOCK_STYLE_ID);
    if (s) s.remove();
  }

  function markDeptFilterLocked(locked, label, mode) {
    // Sin banner UI: el RLS ya restringe; solo ocultamos el filtro Departamentos.
    var existing = document.getElementById("ps-dept-scope-banner");
    if (existing) existing.remove();

    if (!locked) {
      _stopDeptLockObserver();
      return;
    }
    _startDeptLockObserver();
  }

  async function fetchUserScope(email) {
    var q = email ? "?email=" + encodeURIComponent(email) : "";
    var res = await fetch(appRoot() + "/api/v1/ps/user-scope" + q, {
      credentials: "include",
    });
    if (!res.ok) return null;
    var payload = await res.json();
    return payload && payload.result ? payload.result : null;
  }

  async function applyDepartmentScope() {
    if (!isDashboardPage()) return;
    try {
      var me = await fetchMe();
      if (!me) return;
      var realEmail = (me.email || me.username || "").trim().toLowerCase();
      var sim = window.__PS_SIMULATED_USER__;
      var effective =
        sim && sim.email ? String(sim.email).trim().toLowerCase() : realEmail;
      if (!effective) return;

      // Sync cookie firmada ps_sim ANTES de charts (RLS Jinja la lee)
      if (effective !== realEmail) {
        await syncServerSimulation(effective);
      } else {
        var savedSim = readSimulatedEmail();
        if (!savedSim) {
          await syncServerSimulation("");
        }
      }

      var scope = await fetchUserScope(
        effective !== realEmail ? effective : ""
      );
      if (!scope) return;

      var mode = scope.mode || (scope.see_all ? "all" : "department");
      var token =
        effective +
        "|" +
        mode +
        "|" +
        (scope.department_code || scope.resource_code || "") +
        "|" +
        String(scope.team_job_count || 0);
      var prev = "";
      try {
        prev = sessionStorage.getItem(PS_DEPT_SCOPE_KEY) || "";
      } catch (err) {
        prev = "";
      }

      var locked = mode === "department" || mode === "project_team";
      var bannerLabel =
        mode === "project_team"
          ? (scope.team_job_count || 0) + " jobs · " + (scope.resource_code || "")
          : scope.department_code || "";

      // ⛔ NO reaplicar por URL: Superset sustituye native_filters → native_filters_key
      // y un guard que mira la URL provoca bucle infinito de location.replace.
      // Seguridad = RLS Jinja (cookie ps_sim). UI = ocultar widget + 1 reload máx.
      if (prev === token) {
        markDeptFilterLocked(locked, bannerLabel, mode);
        return;
      }

      var urlNow = new URL(window.location.href);
      urlNow.searchParams.delete("native_filters_key");
      urlNow.searchParams.delete("permalink_key");

      try {
        sessionStorage.setItem(PS_DEPT_SCOPE_KEY, token);
      } catch (err) {
        /* ignore */
      }

      if (mode === "all" || scope.see_all) {
        urlNow.searchParams.delete("native_filters");
        markDeptFilterLocked(false, "", mode);
        if (urlNow.href !== window.location.href) {
          console.log("[PS] Ámbito: ver todo (vacío/999)");
          window.location.replace(urlNow.pathname + urlNow.search + urlNow.hash);
        } else {
          console.log("[PS] Ámbito: ver todo (sin cambio URL)");
        }
        return;
      }

      if (mode === "project_team") {
        // No forzar filtro Departamentos: el RLS filtra por job_team.
        urlNow.searchParams.delete("native_filters");
        console.log(
          "[PS] Ámbito project_team →",
          scope.resource_code,
          "jobs=",
          scope.team_job_count
        );
        markDeptFilterLocked(true, bannerLabel, mode);
        if (urlNow.href !== window.location.href) {
          window.location.replace(urlNow.pathname + urlNow.search + urlNow.hash);
        }
        return;
      }

      var dept = scope.department_code;
      urlNow.searchParams.set("native_filters", buildDeptNativeFiltersRison(dept));
      console.log("[PS] Ámbito dept →", dept, "(RLS servidor; 1 reload)");
      markDeptFilterLocked(true, dept, mode);
      window.location.replace(urlNow.pathname + urlNow.search + urlNow.hash);
    } catch (err) {
      console.warn("[PS] No se pudo aplicar ámbito", err);
    }
  }

  async function runPatch() {
    applyDashboardChromeMode();
    // Restaurar simulación guardada antes de pintar el nombre
    var saved = readSimulatedEmail();
    if (saved) {
      window.__PS_SIMULATED_USER__ = window.__PS_SIMULATED_USER__ || {
        email: saved,
        name: saved,
      };
    }
    refreshDisplayedUserName();
    await applyDepartmentScope();
    initUserSimulator();
    // Reaplicar chrome/host tras pintados SPA
    setTimeout(applyDashboardChromeMode, 300);
    setTimeout(function () {
      var el = document.getElementById(PS_SIM_MOUNT_ID);
      if (el) placeSimulatorInDashboard(el);
    }, 600);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runPatch);
  } else {
    runPatch();
  }
})();
</script>
