<script>
(function () {
  function appRoot() {
    return window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
  }

  /**
   * Polls del dashboard — pausar si la pestaña del navegador está oculta.
   * Reduce CPU/GPU en Chrome Retina cuando el usuario cambia de pestaña/app.
   * Rollback: ?_pspoll=always  o  window.__PS_POLL_ALWAYS = true
   */
  function psPollEnabled() {
    try {
      if (window.__PS_POLL_ALWAYS === true) return true;
      var q = new URLSearchParams(window.location.search || "");
      if ((q.get("_pspoll") || "").toLowerCase() === "always") return true;
    } catch (ePoll) { /* ignore */ }
    if (typeof document.hidden === "boolean" && document.hidden) return false;
    return true;
  }

  /**
   * Intervalo del poll anti-N/A (Gastos/Facturación).
   * Default 600 ms (antes 120). Rollback: ?_psnapoll=120  o  __PS_NA_POLL_MS=120
   */
  function psNaPollMs() {
    try {
      var q = new URLSearchParams(window.location.search || "");
      var v = parseInt(q.get("_psnapoll") || "", 10);
      if (v >= 50 && v <= 5000) return v;
    } catch (eMs) { /* ignore */ }
    if (typeof window.__PS_NA_POLL_MS === "number" && window.__PS_NA_POLL_MS >= 50) {
      return window.__PS_NA_POLL_MS;
    }
    return 600;
  }

  // ---------------------------------------------------------------------------
  // Lazy / progressive charts (prueba 2026-07-29)
  // Hallazgo: Superset YA no pide Gastos/Facturación/Gráficos al abrir Resumen
  // (no aparecen en seenSids). El coste percibido son los charts de Resumen.
  // Estrategia:
  //  1) Fase A — solo KPIs (Obj/Plan) al abrir
  //  2) Fase B — Probabilidad + Resumen mensual + Proyectos tras KPIs o 400ms
  //  3) Otras pestañas — diferir si algún día piden datos antes de abrirse
  // ---------------------------------------------------------------------------
  (function psLazyTabCharts() {
    if (window.__psLazyTabCharts) return;
    window.__psLazyTabCharts = true;
    if (!window.fetch) return;

    var pending = []; // { tab, run }
    var warmed = {};
    var stats = { allowed: 0, deferred: 0, flushed: {}, phase: "A" };
    window.__psLazyTabStats = stats;

    // KPIs Resumen (fase A). El resto de Resumen = fase B.
    var kpiIds = {
      9: 1, 10: 1, 11: 1, 12: 1, 13: 1, 14: 1, 15: 1, 16: 1,
    };
    var resumenHeavyIds = { 17: 1, 20: 1, 21: 1 }; // mensual, probabilidad, proyectos
    // IDs típicos (setup actual): 22=Gastos Encabezado, 23=Facturación, 24=Unidad.
    // Si cambian tras regenerar, bucketFor cae a slice_name.
    var otherTabIds = {
      18: "Gráficos",
      19: "Gráficos",
      22: "Gastos",
      23: "Facturación",
      24: "Unidad",
    };
    var phaseBReady = false;
    var kpiAllowed = 0;

    function activeTabLabel() {
      var t = document.querySelector(".ant-tabs-tab-active");
      return (t && t.textContent && t.textContent.trim()) || "Resumen";
    }

    function parseSliceId(body, url) {
      var raw = "";
      if (typeof body === "string") raw = body;
      else if (body != null) {
        try {
          raw = JSON.stringify(body);
        } catch (e) {
          raw = "";
        }
      }
      if (url) raw += " " + String(url);
      var m = raw.match(/"slice_id"\s*:\s*(\d+)/);
      if (m) return Number(m[1]);
      m = String(url || "").match(/form_data=([^&]+)/);
      if (m) {
        try {
          var fd = JSON.parse(decodeURIComponent(m[1]));
          if (fd && fd.slice_id != null) return Number(fd.slice_id);
        } catch (e) {}
      }
      return null;
    }

    function parseChartName(body) {
      if (body == null) return "";
      var raw = typeof body === "string" ? body : "";
      if (!raw) {
        try {
          raw = JSON.stringify(body);
        } catch (e) {
          return "";
        }
      }
      var m = raw.match(/"slice_name"\s*:\s*"([^"]+)"/);
      return m ? m[1] : "";
    }

    function bucketFor(sid, name) {
      if (sid != null && otherTabIds[sid]) return otherTabIds[sid];
      if (name === "Unidad") return "Unidad";
      if (name === "Gastos") return "Gastos";
      if (name === "Mano de Obra") return "Mano de Obra";
      if (name === "Facturación") return "Facturación";
      if (name === "Evolución mensual" || name === "Margen acumulado")
        return "Gráficos";
      if (sid != null && kpiIds[sid]) return "ResumenKPI";
      if (sid != null && resumenHeavyIds[sid]) return "ResumenHeavy";
      if (/^Obj ·|^Plan ·/.test(name || "")) return "ResumenKPI";
      if (
        name === "Resumen mensual" ||
        name === "Proyectos" ||
        name === "Facturación por Probabilidad"
      )
        return "ResumenHeavy";
      // Peticiones sin slice_id (a menudo réplicas/filtros del dataset KPI):
      // dejarlas en fase A para no romper filtros.
      return "ResumenKPI";
    }

    function flushBucket(bucket) {
      warmed[bucket] = true;
      var keep = [];
      var run = [];
      for (var i = 0; i < pending.length; i++) {
        if (pending[i].tab === bucket) run.push(pending[i]);
        else keep.push(pending[i]);
      }
      pending = keep;
      stats.flushed[bucket] = (stats.flushed[bucket] || 0) + run.length;
      for (var j = 0; j < run.length; j++) {
        try {
          run[j].run();
        } catch (e) {}
      }
    }

    function enablePhaseB(reason) {
      if (phaseBReady) return;
      phaseBReady = true;
      stats.phase = "B:" + reason;
      flushBucket("ResumenHeavy");
    }

    function maybeEnablePhaseB() {
      // No habilitar en el mismo tick que el burst inicial: si no, los heavy
      // del mismo lote pasan tras el 6º KPI. Esperar un frame de red.
      if (kpiAllowed >= 6) {
        setTimeout(function () {
          enablePhaseB("kpi>=6");
        }, 150);
      }
    }

    function allowOrDefer(bucket, sendFn) {
      // Marcar primer chart/data para timeout relativo al burst real
      if (!stats.firstChartAt) {
        stats.firstChartAt = Date.now();
        setTimeout(function () {
          enablePhaseB("300ms-after-first-chart");
        }, 300);
        setTimeout(function () {
          enablePhaseB("2000ms-after-first-chart");
        }, 2000);
      }
      var active = activeTabLabel();
      // Pestañas laterales
      if (bucket === "Unidad" || bucket === "Gastos" || bucket === "Mano de Obra" || bucket === "Facturación" || bucket === "Gráficos") {
        if (active === bucket || warmed[bucket]) {
          stats.allowed += 1;
          return sendFn();
        }
        stats.deferred += 1;
        pending.push({ tab: bucket, run: sendFn });
        return;
      }
      // Resumen KPI — siempre en apertura
      if (bucket === "ResumenKPI") {
        stats.allowed += 1;
        kpiAllowed += 1;
        maybeEnablePhaseB();
        return sendFn();
      }
      // Resumen heavy — tras fase B
      if (bucket === "ResumenHeavy") {
        if (phaseBReady || warmed.ResumenHeavy) {
          stats.allowed += 1;
          return sendFn();
        }
        stats.deferred += 1;
        pending.push({ tab: "ResumenHeavy", run: sendFn });
        return;
      }
      stats.allowed += 1;
      return sendFn();
    }

    // Sin timeout desde carga del script: React monta el dashboard a los 2–4s
    // y un timer temprano dejaba phaseB=true antes del burst real.

    var origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = "";
      try {
        url =
          typeof input === "string"
            ? input
            : input && input.url
              ? String(input.url)
              : String(input);
      } catch (e) {
        return origFetch(input, init);
      }
      if (url.indexOf("/chart/data") === -1) return origFetch(input, init);
      var body = init && init.body != null ? init.body : null;
      var sid = parseSliceId(body, url);
      var name = parseChartName(body);
      var bucket = bucketFor(sid, name);
      stats.last = { bucket: bucket, sid: sid, name: name };
      if (!stats.seenSids) stats.seenSids = [];
      if (sid != null && stats.seenSids.indexOf(sid) === -1) stats.seenSids.push(sid);

      return new Promise(function (resolve, reject) {
        allowOrDefer(bucket, function () {
          return origFetch(input, init).then(resolve, reject);
        });
      });
    };

    var OrigXHR = window.XMLHttpRequest;
    function PsLazyXHR() {
      var xhr = new OrigXHR();
      var _url = "";
      var origOpen = xhr.open;
      xhr.open = function (method, url) {
        _url = url == null ? "" : String(url);
        return origOpen.apply(xhr, arguments);
      };
      var origSend = xhr.send;
      xhr.send = function (body) {
        if (_url.indexOf("/chart/data") === -1) {
          return origSend.apply(xhr, arguments);
        }
        var sid = parseSliceId(body, _url);
        var name = parseChartName(body);
        var bucket = bucketFor(sid, name);
        stats.last = { bucket: bucket, sid: sid, name: name };
        if (!stats.seenSids) stats.seenSids = [];
        if (sid != null && stats.seenSids.indexOf(sid) === -1)
          stats.seenSids.push(sid);
        allowOrDefer(bucket, function () {
          origSend.call(xhr, body);
        });
      };
      return xhr;
    }
    PsLazyXHR.prototype = OrigXHR.prototype;
    window.XMLHttpRequest = PsLazyXHR;

    document.addEventListener(
      "click",
      function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var tab = t.closest(".ant-tabs-tab");
        if (!tab) return;
        var label = (tab.textContent || "").trim();
        if (!label) return;
        setTimeout(function () {
          flushBucket(label);
          if (label === "Resumen") enablePhaseB("tab-resumen");
        }, 0);
      },
      true
    );
  })();

  // Bug APP_ROOT: ensureAppRoot() duplica /analytics en logout (y otros links).
  // Bootstrap ya trae /analytics/logout/ → el menú navega a /analytics/analytics/logout/.
  function collapseDoubleAppRoot(url) {
    if (!url) return url;
    return String(url).replace(/\/analytics\/analytics(\/|$)/g, "/analytics$1");
  }

  function fixDoubleAppRootAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll
      ? scope.querySelectorAll('a[href*="/analytics/analytics"]')
      : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href");
      var fixed = collapseDoubleAppRoot(href);
      if (fixed && fixed !== href) a.setAttribute("href", fixed);
    });
  }

  document.addEventListener(
    "click",
    function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var a = t.closest("a[href]");
      if (!a) return;
      var href = a.getAttribute("href") || "";
      // FAB Users sin APP_ROOT → Timesheet; forzar /analytics/users/...
      if (/^\/users(\/|$)/.test(href) || href.indexOf("://apps.powersolution.es/users/") !== -1) {
        ev.preventDefault();
        ev.stopPropagation();
        var path = href.replace(/^https?:\/\/[^/]+/, "");
        if (path.indexOf("/analytics/") !== 0) path = "/analytics" + path;
        path = collapseDoubleAppRoot(path);
        window.location.assign(path);
        return;
      }
      if (href.indexOf("/analytics/analytics") === -1) return;
      var fixed = collapseDoubleAppRoot(href);
      if (fixed === href) return;
      ev.preventDefault();
      ev.stopPropagation();
      window.location.assign(fixed);
    },
    true
  );

  function fixUsersAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll ? scope.querySelectorAll('a[href]') : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href") || "";
      if (!/^\/users(\/|$)/.test(href)) return;
      a.setAttribute("href", "/analytics" + href);
    });
  }

  /**
   * Solo publica offsets CSS para calc(100dvh - …). No escribe height en charts.
   */
  function publishDashboardViewportVars() {
    var content = document.querySelector(".dashboard-content");
    if (content) {
      var top = content.getBoundingClientRect().top;
      if (top > 40 && top < window.innerHeight * 0.5) {
        document.documentElement.style.setProperty(
          "--ps-dash-top",
          Math.round(top) + "px"
        );
      }
    }
    var resumen = document.querySelector(
      '[data-test-chart-name*="Resumen mensual"]'
    );
    if (resumen && resumen.offsetParent !== null) {
      var rt = resumen.getBoundingClientRect().top;
      if (rt > 80 && rt < window.innerHeight - 120) {
        document.documentElement.style.setProperty(
          "--ps-tables-top",
          Math.round(rt) + "px"
        );
      }
    }
    var unidad = document.querySelector('[data-test-chart-name="Unidad"]');
    var gastos = document.querySelector('[data-test-chart-name="Gastos"]');
    var manoObra = document.querySelector('[data-test-chart-name="Mano de Obra"]');
    var facturacion = document.querySelector('[data-test-chart-name="Facturación"]');
    var matrix = null;
    if (unidad && unidad.offsetParent !== null) matrix = unidad;
    else if (gastos && gastos.offsetParent !== null) matrix = gastos;
    else if (manoObra && manoObra.offsetParent !== null) matrix = manoObra;
    else if (facturacion && facturacion.offsetParent !== null) matrix = facturacion;
    if (matrix) {
      /* Igual que Resumen: top del chart-slice (no del holder) → ~8–9px de aire abajo */
      var gt = matrix.getBoundingClientRect().top;
      if (gt > 60 && gt < window.innerHeight - 120) {
        document.documentElement.style.setProperty(
          "--ps-unidad-top",
          Math.round(gt) + "px"
        );
      }
    }
  }
  window.addEventListener("resize", publishDashboardViewportVars);
  setInterval(function () {
    if (!psPollEnabled()) return;
    publishDashboardViewportVars();
  }, 1200);
  setTimeout(publishDashboardViewportVars, 0);
  setTimeout(publishDashboardViewportVars, 400);

  var AG_GRID_CHART_SELECTORS = [
    "[data-test-chart-name*='Resumen mensual']",
  ];

  function isGastosChartVisible(chart) {
    if (!chart || !chart.getBoundingClientRect) return false;
    if (chart.offsetParent === null) return false;
    var rect = chart.getBoundingClientRect();
    return rect.width > 40 && rect.bottom > 0 && rect.top < window.innerHeight + 40;
  }

  /**
   * Sustituye «Resumen»/«Summary» del pie por «Total» (visible y en negrita).
   * Sin tocar alturas: AG Grid gestiona el layout nativo.
   */
  function labelAgGridTotalsRow(chart) {
    if (!chart) return;
    var bottom = chart.querySelector(".ag-floating-bottom");
    if (!bottom) return;
    var dimIds = [
      "concepto_analitico",
      "proyecto",
      "ano_mes",
      "year",
      "month",
    ];
    var cells = bottom.querySelectorAll(".ag-cell");
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var id = cell.getAttribute("col-id") || "";
      var isDim = false;
      for (var d = 0; d < dimIds.length; d++) {
        if (id === dimIds[d] || id.indexOf(dimIds[d]) === 0) {
          isDim = true;
          break;
        }
      }
      if (!isDim && i > 0) continue;
      if (!isDim && i === 0) isDim = true;
      if (!isDim) continue;
      cell.style.setProperty("visibility", "visible", "important");
      var valEl =
        cell.querySelector(".ag-cell-value") ||
        cell.querySelector("[class*='cell']") ||
        cell;
      var cur = (valEl.textContent || "").replace(/\s+/g, " ").trim();
      if (
        !cur ||
        cur === "Resumen" ||
        cur === "Summary" ||
        cur === "N/A" ||
        /^total$/i.test(cur)
      ) {
        valEl.textContent = "Total";
      }
      cell.style.setProperty("font-weight", "700", "important");
    }
  }

  function labelAllAgGridTotals() {
    var sels = [
      '[data-test-chart-name="Unidad"]',
      '[data-test-chart-name="Gastos"]',
      '[data-test-chart-name="Mano de Obra"]',
      '[data-test-chart-name="Facturación"]',
      '[data-test-chart-name*="Proyectos"]',
      '[data-test-chart-name*="Resumen mensual"]',
    ];
    sels.forEach(function (sel) {
      var charts = document.querySelectorAll(sel);
      Array.prototype.forEach.call(charts, function (chart) {
        labelAgGridTotalsRow(chart);
      });
    });
  }

  /**
   * Localiza GridApi de AG Grid (fiber React + hooks del root DOM).
   */
  function findApiInFiberTree(fiber, maxNodes) {
    var queue = [fiber];
    var seen = 0;
    while (queue.length && seen < maxNodes) {
      var f = queue.shift();
      seen += 1;
      if (!f) continue;
      var props = f.memoizedProps || f.pendingProps;
      if (props) {
        if (props.api && typeof props.api.autoSizeAllColumns === "function") {
          return props.api;
        }
        if (props.gridApi && typeof props.gridApi.autoSizeAllColumns === "function") {
          return props.gridApi;
        }
        if (
          props.gridRef &&
          props.gridRef.current &&
          props.gridRef.current.api &&
          typeof props.gridRef.current.api.autoSizeAllColumns === "function"
        ) {
          return props.gridRef.current.api;
        }
      }
      if (f.stateNode) {
        var sn = f.stateNode;
        if (sn.api && typeof sn.api.autoSizeAllColumns === "function") return sn.api;
        if (sn.gridApi && typeof sn.gridApi.autoSizeAllColumns === "function") {
          return sn.gridApi;
        }
        if (
          sn.beans &&
          sn.beans.gridApi &&
          typeof sn.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return sn.beans.gridApi;
        }
      }
      var state = f.memoizedState;
      var sd = 0;
      while (state && sd < 40) {
        var ms = state.memoizedState;
        if (ms) {
          if (typeof ms.autoSizeAllColumns === "function") return ms;
          if (ms.current && typeof ms.current.autoSizeAllColumns === "function") {
            return ms.current;
          }
          if (ms.api && typeof ms.api.autoSizeAllColumns === "function") return ms.api;
        }
        state = state.next;
        sd += 1;
      }
      if (f.child) queue.push(f.child);
      if (f.sibling) queue.push(f.sibling);
    }
    return null;
  }

  /**
   * Tuning de rendimiento AG Grid (scroll en Proyectos/Gastos/Facturación/Resumen mensual).
   * rowBuffer más bajo → menos filas fuera de viewport pre-renderizadas (menos DOM).
   * debounceVerticalScrollbar → agrupa updates durante scroll rápido (menos repintados).
   * animateRows:false → sin transición CSS al reposicionar filas virtualizadas.
   * Reversible sin redeploy: ?_psgridtune=off  o  window.__PS_GRID_TUNE_DISABLED=true
   */
  function psGridTuneEnabled() {
    try {
      if (window.__PS_GRID_TUNE_DISABLED === true) return false;
      var q = new URLSearchParams(window.location.search || "");
      if ((q.get("_psgridtune") || "").toLowerCase() === "off") return false;
    } catch (eTune) { /* ignore */ }
    return true;
  }

  function tuneAgGridScrollPerf(api) {
    if (!api || api.__psScrollPerfTuned) return;
    if (!psGridTuneEnabled()) return;
    api.__psScrollPerfTuned = true;
    var opts = { rowBuffer: 6, debounceVerticalScrollbar: true, animateRows: false };
    Object.keys(opts).forEach(function (key) {
      try {
        if (typeof api.setGridOption === "function") {
          api.setGridOption(key, opts[key]);
        } else if (
          api.gridOptionsService &&
          typeof api.gridOptionsService.set === "function"
        ) {
          api.gridOptionsService.set(key, opts[key]);
        }
      } catch (eOpt) { /* versión de AG Grid no soporta esta opción */ }
    });
  }

  function findAgGridApi(rootEl) {
    if (!rootEl) return null;
    var agRoot = rootEl.querySelector(".ag-root") || rootEl;
    var directKeys = Object.keys(agRoot);
    for (var di = 0; di < directKeys.length; di++) {
      var val = agRoot[directKeys[di]];
      if (val && typeof val === "object") {
        if (typeof val.autoSizeAllColumns === "function") return val;
        if (val.api && typeof val.api.autoSizeAllColumns === "function") return val.api;
        if (
          val.beans &&
          val.beans.gridApi &&
          typeof val.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return val.beans.gridApi;
        }
      }
    }
    var candidates = [rootEl, agRoot];
    for (var ci = 0; ci < candidates.length; ci++) {
      var el = candidates[ci];
      var keys = Object.keys(el);
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        if (
          key.indexOf("__reactFiber") === 0 ||
          key.indexOf("__reactInternalInstance") === 0
        ) {
          var api = findApiInFiberTree(el[key], 300);
          if (api) return api;
        }
      }
    }
    var nodes = rootEl.querySelectorAll(
      ".ag-root-wrapper, .ag-root, [class*='ag-theme']"
    );
    for (var ni = 0; ni < nodes.length; ni++) {
      var n = nodes[ni];
      var nkeys = Object.keys(n);
      for (var nj = 0; nj < nkeys.length; nj++) {
        var nk = nkeys[nj];
        if (
          nk.indexOf("__reactFiber") === 0 ||
          nk.indexOf("__reactInternalInstance") === 0
        ) {
          var a2 = findApiInFiberTree(n[nk], 200);
          if (a2) return a2;
        }
      }
    }
    return null;
  }

  /**
   * Superset llama sizeColumnsToFit() y ensancha al card. Lo redirigimos a
   * ajuste por contenido para evitar holgura y scroll horizontal.
   */
  function patchSizeColumnsToFit(api) {
    if (!api || api.__psAutosizePatched) return;
    if (typeof api.sizeColumnsToFit !== "function") return;
    api.__psAutosizePatched = true;
    api.sizeColumnsToFit = function () {
      try {
        /* no-op: el ajuste real lo hace fitColumnsByDomMeasure */
      } catch (err) {
        /* ignore */
      }
    };
  }

  /**
   * Mide cabecera + celdas y aplica anchos.
   * opts.pad / opts.lock / opts.fitViewport / opts.flexTextColumn
   * flexTextColumn: la columna de texto (proyecto / ano_mes) usa el resto del viewport;
   * las métricas (Fact., Coste, Margen %) quedan justas al contenido.
   */
  function isMetricColId(colId) {
    var id = String(colId || "");
    return /Fact|Coste|Margen|facturacion|coste|margen/i.test(id);
  }

  function isHiddenSortColId(colId) {
    var id = String(colId || "");
    return id === "year" || id === "month";
  }

  /** Orden cronológico de ano_mes (MM/YYYY) en cliente — sin columnas year/month. */
  function anoMesSortKey(value) {
    var m = String(value || "").match(/(\d{1,2})\s*\/\s*(\d{4})/);
    if (!m) return 0;
    return parseInt(m[2], 10) * 100 + parseInt(m[1], 10);
  }

  function sortResumenByAnoMes(api) {
    if (!api || typeof api.getColumnState !== "function") return;
    if (typeof api.applyColumnState !== "function") return;
    var state = api.getColumnState() || [];
    if (!state.length) return;

    var hasYear = false;
    var hasMonth = false;
    var yearSort = null;
    var monthSort = null;
    var sortedOther = false;

    for (var i = 0; i < state.length; i++) {
      var col = state[i];
      var id = String(col.colId || "");
      if (id === "year") {
        hasYear = true;
        yearSort = col.sort || null;
        continue;
      }
      if (id === "month") {
        hasMonth = true;
        monthSort = col.sort || null;
        continue;
      }
      if (col.sort) sortedOther = true;
    }

    // Priorizar columnas hidden year/month: garantizan cronología real.
    if (!hasYear || !hasMonth) return;
    if (yearSort === "asc" && monthSort === "asc" && !sortedOther) return;

    api.applyColumnState({
      defaultState: { sort: null, sortIndex: null },
      state: [
        { colId: "year", sort: "asc", sortIndex: 0 },
        { colId: "month", sort: "asc", sortIndex: 1 },
      ],
    });
  }

  /** year/month: ordenan pero no deben ocupar píxeles (hueco a la izquierda). */
  function collapseHiddenSortColumns(api) {
    if (!api) return;
    ["year", "month"].forEach(function (id) {
      try {
        if (typeof api.setColumnVisible === "function") {
          api.setColumnVisible(id, false);
        }
      } catch (e) {
        /* col aún no montada */
      }
    });
    if (typeof api.applyColumnState !== "function") return;
    api.applyColumnState({
      state: [
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
      ],
    });
  }

  function getViewportWidth(chart) {
    // Preferir cabecera: refleja el ancho útil real (sin gutter del scroll vertical).
    var vp =
      chart.querySelector(".ag-header-viewport") ||
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport");
    var avail = vp ? Math.floor(vp.clientWidth) : 0;
    if (avail < 80) {
      var root = chart.querySelector(".ag-root-wrapper") || chart;
      avail = Math.floor(root.getBoundingClientRect().width) - 8;
    }
    // Margen anti-scroll fantasma (bordes, subpixel, scrollbar vertical).
    return Math.max(0, avail - 20);
  }

  function getHorizontalOverflow(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport");
    if (!vp) return 0;
    return Math.max(0, vp.scrollWidth - vp.clientWidth);
  }

  /** Reduce la columna de texto hasta eliminar el scroll horizontal. */
  function shrinkTextColumnToClearScroll(chart, api) {
    if (!api || typeof api.getColumnState !== "function") return false;
    var overflow = getHorizontalOverflow(chart);
    if (overflow <= 1) return false;
    var cols = api.getColumnState() || [];
    var textCol = null;
    for (var i = 0; i < cols.length; i++) {
      var id = cols[i].colId;
      if (!id || id.charAt(0) === "_") continue;
      if (isHiddenSortColId(id) || isMetricColId(id)) continue;
      textCol = cols[i];
      break;
    }
    if (!textCol) return false;
    var cur = textCol.width || 200;
    var nw = Math.max(100, Math.floor(cur - overflow - 8));
    if (nw >= cur) return false;
    api.applyColumnState({
      state: [
        {
          colId: textCol.colId,
          width: nw,
          minWidth: Math.min(100, nw),
          maxWidth: nw,
          flex: null,
        },
      ],
      defaultState: { flex: null },
    });
    return true;
  }

  function fitColumnsByDomMeasure(chart, api, opts) {
    opts = opts || {};
    if (!api || typeof api.applyColumnState !== "function") return false;
    var headerCells = chart.querySelectorAll(".ag-header-viewport .ag-header-cell");
    if (!headerCells.length) return false;
    var sampleCell =
      chart.querySelector(".ag-center-cols-container .ag-cell") ||
      chart.querySelector(".custom-header") ||
      chart.querySelector(".ag-header-cell-text") ||
      chart.querySelector(".ag-header-cell");
    var font = sampleCell
      ? window.getComputedStyle(sampleCell).font
      : "14px 'Segoe UI', sans-serif";
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    if (!ctx) return false;
    ctx.font = font;
    var pad = typeof opts.pad === "number" ? opts.pad : 24;
    var state = [];
    Array.prototype.forEach.call(headerCells, function (hc) {
      var colId = hc.getAttribute("col-id");
      if (!colId || colId.charAt(0) === "_") return;
      if (isHiddenSortColId(colId)) return;
      var headerEl =
        hc.querySelector(".custom-header") ||
        hc.querySelector(".ag-header-cell-text") ||
        hc.querySelector(".ag-header-cell-label");
      var headerText = headerEl ? (headerEl.textContent || "").trim() : "";
      // Cabeceras de métricas: no usar texto truncado con ellipsis del DOM
      if (isMetricColId(colId)) {
        if (/margen/i.test(colId)) headerText = "Margen %";
        else if (/coste/i.test(colId)) headerText = "Coste";
        else if (/fact/i.test(colId)) {
          headerText =
            headerText.indexOf("Fact.") === 0 && headerText.length <= 6
              ? "Fact."
              : "Facturación";
        }
      }
      var maxPx = headerText
        ? Math.ceil(ctx.measureText(headerText).width) + pad
        : pad + 40;
      var bodyCells = chart.querySelectorAll(
        '.ag-center-cols-container .ag-cell[col-id="' + colId + '"]'
      );
      var limit = Math.min(bodyCells.length, 80);
      for (var i = 0; i < limit; i++) {
        // Normaliza saltos/espacios: evita medir texto ya envuelto por AG Grid.
        var t = (bodyCells[i].textContent || "").replace(/\s+/g, " ").trim();
        if (!t) continue;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      }
      var pinCells = chart.querySelectorAll(
        '.ag-floating-bottom .ag-cell[col-id="' + colId + '"]'
      );
      Array.prototype.forEach.call(pinCells, function (pc) {
        if (window.getComputedStyle(pc).visibility === "hidden") return;
        var t = (pc.textContent || "").replace(/\s+/g, " ").trim();
        if (!t) return;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      });
      if (maxPx < 44) maxPx = 44;
      // Tope a métricas: no hace falta más de ~140px salvo totales largos
      if (isMetricColId(colId) && maxPx > 160) maxPx = 160;
      var colState = { colId: colId, width: maxPx, flex: null };
      if (opts.lock || (opts.lockMetrics && isMetricColId(colId))) {
        colState.minWidth = maxPx;
        colState.maxWidth = maxPx;
      }
      state.push(colState);
    });
    if (!state.length) return false;

    // Incluir year/month a 0 en el mismo apply (evita hueco izquierdo)
    if (opts.collapseSortCols) {
      state.push(
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        }
      );
    }

    var avail = getViewportWidth(chart);

    if (opts.flexTextColumn && avail > 80) {
      var metricsTotal = 0;
      var textIdx = -1;
      for (var fi = 0; fi < state.length; fi++) {
        if (isHiddenSortColId(state[fi].colId)) continue;
        if (isMetricColId(state[fi].colId)) {
          metricsTotal += state[fi].width;
        } else if (textIdx === -1) {
          textIdx = fi;
        } else {
          metricsTotal += state[fi].width;
        }
      }
      if (textIdx >= 0) {
        // Columna texto = mayor de (ancho medido de contenido, espacio restante).
        // Sin maxWidth: el usuario puede ensanchar manualmente sin que AG Grid lo rechace.
        var naturalW = state[textIdx].width; // medido del textContent real
        var textW = Math.max(naturalW, avail - metricsTotal, 120);
        state[textIdx].width = textW;
        state[textIdx].minWidth = 100;
        // maxWidth intencionalmente NO fijado: permite resize manual libre.
        state[textIdx].flex = null;
      }
    } else if (opts.fitViewport && avail > 80) {
      var total = 0;
      for (var ti = 0; ti < state.length; ti++) {
        if (isHiddenSortColId(state[ti].colId)) continue;
        total += state[ti].width;
      }
      // Encoger SIEMPRE si no cabe (pantallas estrechas / card chica)
      if (total > avail) {
        var scale = (avail - 2) / total;
        for (var si = 0; si < state.length; si++) {
          if (isHiddenSortColId(state[si].colId)) continue;
          var nw = Math.max(48, Math.floor(state[si].width * scale));
          state[si].width = nw;
          if (opts.lock || (opts.lockMetrics && isMetricColId(state[si].colId))) {
            state[si].minWidth = nw;
            state[si].maxWidth = nw;
          }
        }
      }
    }

    api.applyColumnState({ state: state, defaultState: { flex: null } });
    // Tras medir visibles, forzar year/month a 0 (si no, dejan hueco a la izquierda)
    collapseHiddenSortColumns(api);
    return true;
  }

  function isResumenMensualChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Resumen mensual") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t.indexOf("Resumen mensual") !== -1;
  }

  function hasHorizontalScroll(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport") ||
      chart.querySelector(".ag-body-viewport");
    if (!vp) return false;
    return vp.scrollWidth > vp.clientWidth + 2;
  }

  // ─── Persistencia de anchos de columna — chart Proyectos ────────────────────
  //
  // Cuando el usuario termina de redimensionar una columna:
  //  1. Guarda en localStorage (respuesta inmediata, solo este browser).
  //  2. Llama a la API de Superset para actualizar column_config en la BD
  //     → todos los usuarios/dispositivos reciben el nuevo ancho en la próxima carga.
  //
  // La API usa la cookie de sesión (HTTPS) + token CSRF: no requiere credenciales
  // adicionales; funciona para cualquier usuario con rol Alpha/Admin en Superset.

  var PS_COL_STORAGE_KEY = "ps-proyectos-col-widths-v2";
  var PS_CHART_ID = 21;

  function isProyectosChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Proyectos") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Proyectos" || t.indexOf("Proyectos") === 0;
  }

  /** Devuelve {colId: width, ...} del estado actual del grid. */
  function getColWidthMap(api) {
    var state = api.getColumnState ? api.getColumnState() : null;
    if (!state) return null;
    var map = {};
    state.forEach(function (col) {
      if (col.colId && col.width && col.width > 0) map[col.colId] = col.width;
    });
    return Object.keys(map).length ? map : null;
  }

  /** Aplica un mapa {colId: width} al grid sin tocar orden ni visibilidad. */
  function applyColWidthMap(api, map) {
    if (!map || !api.applyColumnState) return;
    var state = Object.keys(map).map(function (id) {
      return { colId: id, width: map[id] };
    });
    try { api.applyColumnState({ state: state, applyOrder: false }); } catch (e) { /* ignore */ }
  }

  /**
   * Distribución inicial estable: las métricas quedan compactas y Proyectos
   * recibe todo el ancho restante del viewport.
   */
  function getDefaultProyectosWidths(chart) {
    var viewport =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport");
    var available = viewport ? viewport.clientWidth : chart.clientWidth;
    var metricTotal = 110 + 110 + 100;
    return {
      proyecto: Math.max(280, available - metricTotal),
      "Fact.": 110,
      Coste: 110,
      "Margen %": 100,
    };
  }

  /** Guarda en localStorage (fallback inmediato). */
  function saveWidthsLocal(map) {
    try { localStorage.setItem(PS_COL_STORAGE_KEY, JSON.stringify(map)); } catch (e) { /* ignore */ }
  }

  /** Lee de localStorage. */
  function loadWidthsLocal() {
    try {
      var raw = localStorage.getItem(PS_COL_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /**
   * Lee los anchos compartidos de la configuración del gráfico.
   * Solo acepta el estado cuando contiene las cuatro columnas; así, el
   * columnWidth inicial de Proyectos no se confunde con un ajuste guardado.
   */
  function loadWidthsFromSuperset() {
    var base = window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
    return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
      credentials: "same-origin",
    })
      .then(function (r) {
        if (!r.ok) return null;
        return r.json();
      })
      .then(function (chartData) {
        if (!chartData) return null;
        var params = JSON.parse((chartData.result || {}).params || "{}");
        var config = params.column_config || {};
        var ids = ["proyecto", "Fact.", "Coste", "Margen %"];
        var map = {};
        for (var i = 0; i < ids.length; i += 1) {
          var width = Number((config[ids[i]] || {}).columnWidth);
          if (!width || width <= 0) return null;
          map[ids[i]] = width;
        }
        return map;
      })
      .catch(function () { return null; });
  }

  /**
   * Llama a PUT /api/v1/chart/:id para actualizar columnWidth en column_config.
   * Usa la sesión del usuario logueado (cookie HTTPS + CSRF).
   * Si el usuario no tiene permisos de escritura, falla silenciosamente.
   */
  function saveWidthsToSuperset(map) {
    var base = window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
    // Paso 1: obtener token CSRF (la sesión ya está en la cookie)
    fetch(base + "/api/v1/security/csrf_token/", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (csrfData) {
        var csrf = csrfData.result;
        if (!csrf) return;
        // Paso 2: leer params actuales del chart
        return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
          credentials: "same-origin",
          headers: { "X-CSRFToken": csrf },
        })
          .then(function (r) { return r.json(); })
          .then(function (chartData) {
            var params = JSON.parse((chartData.result || {}).params || "{}");
            var cc = params.column_config || {};
            // Actualizar columnWidth por columna
            Object.keys(map).forEach(function (colId) {
              cc[colId] = cc[colId] || {};
              cc[colId].columnWidth = map[colId];
            });
            params.column_config = cc;
            // Paso 3: guardar
            return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
              method: "PUT",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrf,
                "Referer": window.location.origin + base + "/",
              },
              body: JSON.stringify({ params: JSON.stringify(params) }),
            });
          })
          .then(function (r) {
            if (r && r.ok) {
              console.log("[PS] Anchos de Proyectos guardados en Superset (todos los usuarios).");
            }
          });
      })
      .catch(function () { /* fallo silencioso: localStorage es el fallback */ });
  }

  var _psColSaveTimer = null;

  /**
   * Registra el listener de resize y blinda los anchos guardados.
   * Se inicializa una vez por instancia de grid (no por elemento DOM).
   *
   * Problema raíz: Superset llama api.sizeColumnsToFit() cuando terminan
   * de cargar los datos → sobrescribe lo que aplicamos desde localStorage.
   * Solución: parchar sizeColumnsToFit para que, si hay anchos guardados,
   * los re-aplique en lugar de igualar columnas. Sin estado guardado, las
   * métricas quedan compactas y Proyectos usa todo el espacio restante.
   */
  function initProyectosColPersist(chart, api) {
    // Guardia por instancia de API (no por DOM: el DOM puede recrearse)
    if (api.__psColPersistInit) return;
    api.__psColPersistInit = true;
    chart.__psColPersistInit = true;

    // ── 1. Parchear sizeColumnsToFit ──────────────────────────────────────
    // Cuando Superset llama sizeColumnsToFit() tras cargar datos,
    // interceptamos y re-aplicamos los anchos guardados.
    api.sizeColumnsToFit = function () {
      var saved = loadWidthsLocal();
      applyColWidthMap(api, saved || getDefaultProyectosWidths(chart));
    };

    // ── 2. Restaurar anchos guardados ahora ───────────────────────────────
    var saved = loadWidthsLocal();
    applyColWidthMap(api, saved || getDefaultProyectosWidths(chart));
    if (!saved) {
      // Un navegador nuevo obtiene el último estado compartido del gráfico.
      loadWidthsFromSuperset().then(function (shared) {
        if (!shared) return;
        saveWidthsLocal(shared);
        applyColWidthMap(api, shared);
      });
    }
    // Re-aplicar tras 500ms por si Superset aún no terminó de renderizar.
    setTimeout(function () {
      var s = loadWidthsLocal();
      applyColWidthMap(api, s || getDefaultProyectosWidths(chart));
    }, 500);

    // ── 3. Escuchar resize manual ─────────────────────────────────────────
    try {
      api.addEventListener("columnResized", function (e) {
        // Solo persistir un arrastre real del usuario, nunca nuestros ajustes.
        if (!e || !e.finished || e.source !== "uiColumnResized") return;
        var map = getColWidthMap(api);
        if (!map) return;
        saveWidthsLocal(map);
        if (_psColSaveTimer) clearTimeout(_psColSaveTimer);
        _psColSaveTimer = setTimeout(function () {
          saveWidthsToSuperset(map);
        }, 1000);
      });
    } catch (err) { /* grid aún montando */ }
  }

  // ─── Fin persistencia Proyectos ─────────────────────────────────────────────

  // ─── Persistencia / layout — chart Unidad (concepto × mes) ─────────────────
  var PS_GASTOS_COL_STORAGE_KEY = "ps-gastos-col-widths-v1";

  /**
   * AG Grid Table (Superset) ignora order_by_cols de dimensión y manda

   * sin reordenado client-side (refresh feo).
   */
  (function patchGastosChartDataOrder() {
    if (window.__psGastosOrderPatch) return;

    function rewriteBody(bodyStr) {

      try {

        var queries = body.queries;
        if (!Array.isArray(queries)) return bodyStr;
        var changed = false;
        for (var i = 0; i < queries.length; i++) {
          var q = queries[i];
          if (!q) continue;
          var cols = q.columns || [];
          var hasConcepto = false;
          var hasProyecto = false;
          var hasMonthPivot = false;
          for (var j = 0; j < cols.length; j++) {
            var c = cols[j];
            var label = "";
            if (typeof c === "string") label = c;
            else if (c && typeof c === "object") {
              label = c.label || c.sqlExpression || c.column_name || "";
            }
            if (label === "concepto_analitico") hasConcepto = true;
            if (label === "proyecto") hasProyecto = true;
            if (/^m\d{2}$/.test(label) || label === "m01") hasMonthPivot = true;
          }
          var metrics = q.metrics || [];
          for (var m = 0; m < metrics.length; m++) {
            var met = metrics[m];
            var ml = "";
            if (typeof met === "string") ml = met;
            else if (met && typeof met === "object") {
              ml = met.label || (met.column && met.column.column_name) || "";
            }
            if (ml === "01" || ml === "m01" || /^m\d{2}$/.test(ml)) hasMonthPivot = true;
          }
          if (hasConcepto) {
            q.orderby = [["concepto_analitico", true]];
            changed = true;
          } else if (hasProyecto && hasMonthPivot) {
            q.orderby = [["proyecto", true]];
            changed = true;
          }

        return changed ? JSON.stringify(body) : bodyStr;
      } catch (e) {

      var origFetch = window.fetch;
      window.fetch = function (input, init) {

        if (url.indexOf("chart/data") !== -1 && init && init.body) {

    var XS = XMLHttpRequest.prototype.send;

    };
    XMLHttpRequest.prototype.send = function (body) {
      if (this.__psUrl && String(this.__psUrl).indexOf("chart/data") !== -1 && body) {
        body = rewriteBody(body);
      }
      return XS.call(this, body);
    };
  })();

  function isGastosChart(chart) {
    /* Chart pestaña Unidad (concepto analítico). Nombre histórico de helpers. */
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name === "Unidad") return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Unidad";
  }

  function isGastosMatrixChart(chart) {
    /* Chart pestaña Gastos (Encabezado × mes, coste). */
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name === "Gastos") return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Gastos";
  }

  function getDefaultGastosWidths(chart) {
    // Medir el card completo (no el center ya reducido por un pin previo).
    var holder =
      chart.closest('[data-test="dashboard-component-chart-holder"]') || chart;
    var available = Math.max(
      520,
      Math.floor(holder.getBoundingClientRect().width || chart.clientWidth || 1200) -
        24
    );
    // Total pinned a la derecha. Meses deben poder mostrar "713,072 €".
    var totalW = 118;
    var conceptoMin = 150;
    var monthMin = 70;
    var centerAvail = Math.max(400, available - totalW);
    var monthW = Math.floor((centerAvail - conceptoMin) / 12);
    if (monthW < monthMin) {
      monthW = monthMin;
      conceptoMin = Math.max(110, centerAvail - monthW * 12);
    }
    var concepto = centerAvail - monthW * 12;
    if (concepto < 110) {
      concepto = 110;
      monthW = Math.max(64, Math.floor((centerAvail - concepto) / 12));
      concepto = Math.max(110, centerAvail - monthW * 12);
    }
    while (concepto + monthW * 12 + totalW > available && monthW > 60) {
      monthW -= 1;
      concepto = Math.max(110, available - totalW - monthW * 12);
    }
    var map = {
      concepto_analitico: concepto,
      Total: totalW,
    };
    var months = [
      "01",
      "02",
      "03",
      "04",
      "05",
      "06",
      "07",
      "08",
      "09",
      "10",
      "11",
      "12",
    ];
    for (var i = 0; i < months.length; i++) map[months[i]] = monthW;
    return map;
  }

  function blankGastosNA(chart) {
    var cells = chart.querySelectorAll(".ag-cell, .ag-floating-bottom .ag-cell");
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var t = (cell.textContent || "").replace(/\u00a0/g, " ").trim();
      if (t === "N/A" || t === "n/a") {
        cell.textContent = "";
      }
    }
  }

  function scheduleBlankGastosNA(chart) {
    if (!chart || chart.__psNaBlankRaf) return;
    chart.__psNaBlankRaf = window.requestAnimationFrame(function () {
      chart.__psNaBlankRaf = 0;
      blankGastosNA(chart);
    });
  }

  function wrapNullAsBlankFormatter(orig) {
    if (orig && orig.__psNullBlankWrapper) return orig;
    var wrapped = function (params) {
      var raw = params && params.value;
      var empty =
        raw === null ||
        raw === undefined ||
        raw === "" ||
        (typeof raw === "number" && isNaN(raw));
      if (empty) return "";
      var out;
      try {
        if (typeof orig === "function") out = orig(params);
        else out = raw;
      } catch (err) {
        out = raw;
      }
      if (out === "N/A" || out === "n/a" || out == null) return "";
      return out;
    };
    wrapped.__psNullBlankWrapper = true;
    return wrapped;
  }

  function wrapColDefFormatter(d) {
    if (!d || (d.children && d.children.length)) return false;
    var vf = d.valueFormatter;
    if (vf && vf.__psNullBlankWrapper) return false;
    d.valueFormatter = wrapNullAsBlankFormatter(vf);
    return true;
  }

  /**
   * Re-aplica siempre: al hacer scroll AG Grid virtualiza filas y React/Superset
   * puede restaurar valueFormatter originales → vuelve el flash N/A.
   * Preferimos mutar colDef en vivo (sin setColumnDefs en cada scroll).
   */
  function patchAgGridNullAsBlank(api) {
    if (!api) return false;
    var changed = false;

    try {
      if (typeof api.getColumns === "function") {
        var cols = api.getColumns() || [];
        for (var c = 0; c < cols.length; c++) {
          var col = cols[c];
          if (!col || typeof col.getColDef !== "function") continue;
          if (wrapColDefFormatter(col.getColDef())) changed = true;
        }
      }
    } catch (eCols) { /* ignore */ }

    try {
      var defs =
        typeof api.getColumnDefs === "function" ? api.getColumnDefs() : null;
      if (defs && defs.length) {
        function walk(list) {
          for (var i = 0; i < list.length; i++) {
            var d = list[i];
            if (!d) continue;
            if (d.children && d.children.length) {
              walk(d.children);
              continue;
            }
            if (wrapColDefFormatter(d)) changed = true;
          }
        }
        walk(defs);
        // Solo setColumnDefs la 1ª vez o si React restauró defs sin wrapper
        if (changed && !api.__psNullBlankPatched && typeof api.setColumnDefs === "function") {
          api.setColumnDefs(defs);
        }
      }
    } catch (eDefs) { /* ignore */ }

    if (changed || !api.__psNullBlankPatched) {
      api.__psNullBlankPatched = true;
    }
    return !!api.__psNullBlankPatched;
  }

  /**
   * Modo anti-N/A (Facturación/Gastos) — reversible sin redeploy:
   *   light (default) → solo valueFormatter + re-parche al cargar datos
   *   heavy           → comportamiento anterior (scroll + MutationObserver + barrido DOM)
   *
   * Volver al modo pesado (si reaparece flash N/A al scroll):
   *   ?_psna=heavy   en la URL del dashboard
   *   o en consola:  window.__PS_MATRIX_NA_MODE = 'heavy'; location.reload()
   * Forzar light: ?_psna=light
   */
  function getMatrixNaMode() {
    try {
      var q = new URLSearchParams(window.location.search || "");
      var fromUrl = (q.get("_psna") || "").toLowerCase();
      if (fromUrl === "heavy" || fromUrl === "light") return fromUrl;
    } catch (eQ) { /* ignore */ }
    var w = window.__PS_MATRIX_NA_MODE;
    if (w === "heavy" || w === "light") return w;
    return "light";
  }

  function attachMatrixNaScrollGuards(api, chart) {
    if (!api || !chart || api.__psNaScrollGuards) return;
    api.__psNaScrollGuards = true;

    var mode = getMatrixNaMode();
    window.__psMatrixNaModeActive = mode;

    function onVirtLight() {
      // Solo reaplicar formatter si Superset reseteó colDefs (carga / refresh).
      patchAgGridNullAsBlank(api);
    }

    function onVirtHeavy() {
      patchAgGridNullAsBlank(api);
      scheduleBlankGastosNA(chart);
    }

    try {
      var lightEvents = ["firstDataRendered", "rowDataUpdated", "modelUpdated"];
      var heavyEvents = [
        "bodyScroll",
        "modelUpdated",
        "viewportChanged",
        "virtualColumnsChanged",
        "firstDataRendered",
        "rowDataUpdated",
      ];
      var events = mode === "heavy" ? heavyEvents : lightEvents;
      var handler = mode === "heavy" ? onVirtHeavy : onVirtLight;
      events.forEach(function (evName) {
        try {
          api.addEventListener(evName, handler);
        } catch (eEv) { /* ignore */ }
      });
    } catch (eAdd) { /* ignore */ }

    // MutationObserver + barrido DOM: solo modo heavy (caro en scroll Retina).
    if (mode !== "heavy") return;
    if (chart.__psNaDomObserver) return;
    var root =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport") ||
      chart.querySelector('[class*="ag-theme"]') ||
      chart;
    try {
      var obs = new MutationObserver(function () {
        scheduleBlankGastosNA(chart);
      });
      obs.observe(root, {
        childList: true,
        subtree: true,
        characterData: true,
      });
      chart.__psNaDomObserver = obs;
    } catch (eObs) { /* ignore */ }
  }

  function isMatrixNaChart(chart) {
    return isGastosChart(chart) || isGastosMatrixChart(chart) || isManoDeObraMatrixChart(chart) || isFacturacionMatrixChart(chart);
  }

  function markMatrixNaPending(chart) {
    if (!chart || !isMatrixNaChart(chart)) return;
    injectMatrixNaCss();

    chart.classList.add("ps-na-pending");

  function markMatrixNaReady(chart) {
    if (!chart) return;

    chart.classList.add("ps-na-ready");

  function matrixHasVisibleNA(chart) {

  function ensureMatrixNullBlank(chart) {
    if (!chart || !isMatrixNaChart(chart)) return;
    markMatrixNaPending(chart);
    var agTheme = chart.querySelector('[class*="ag-theme"]');
    if (!agTheme) return;
    var api = findAgGridApi(agTheme);
    if (!api) {
      if (!chart.__psNaFailSafe) {
        chart.__psNaFailSafe = setTimeout(function () {
          blankGastosNA(chart);
          markMatrixNaReady(chart);
        }, 2500);
      }
      return;
    }
    tuneAgGridScrollPerf(api);
    patchAgGridNullAsBlank(api);
    attachMatrixNaScrollGuards(api, chart);
    // Una pasada DOM al montar (light y heavy). El coste caro era repetirla en scroll.
    blankGastosNA(chart);
    if (api.__psNullBlankPatched) {
      if (chart.__psNaFailSafe) {
        clearTimeout(chart.__psNaFailSafe);
        chart.__psNaFailSafe = null;
      }
      markMatrixNaReady(chart);
    }
  }

  /**
   * Cabecera «Concepto Analitico».
   * NO aplicar sort en AG Grid: el orden viene de order_by_cols (SQL).
   * applyColumnState(sort) provoca un refresh feo (reordenado en cliente).

  function fixGastosConceptoColumn(api, chart) {

  function clearGastosClientSortOnce(api) {

  function initGastosColPersist(chart, api) {
    if (api.__psGastosColPersistInit) return;

  function isFacturacionMatrixChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name === "Facturación") return true;
    if (name.indexOf("Facturación por Probabilidad") !== -1) return false;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'

  function getDefaultFacturacionWidths(chart) {
    var holder =
      chart.closest('[data-test="dashboard-component-chart-holder"]') || chart;
    var available = Math.max(
      520,
      Math.floor(holder.getBoundingClientRect().width || chart.clientWidth || 1200) -
        24
    );
    var totalW = 118;
    var proyectoMin = 180;
    var monthMin = 70;
    var centerAvail = Math.max(400, available - totalW);
    var monthW = Math.floor((centerAvail - proyectoMin) / 12);
    if (monthW < monthMin) {
      monthW = monthMin;
      proyectoMin = Math.max(140, centerAvail - monthW * 12);
    }
    var proyecto = centerAvail - monthW * 12;
    if (proyecto < 140) {
      proyecto = 140;
      monthW = Math.max(64, Math.floor((centerAvail - proyecto) / 12));
      proyecto = Math.max(140, centerAvail - monthW * 12);
    }
    while (proyecto + monthW * 12 + totalW > available && monthW > 60) {
      monthW -= 1;
      proyecto = Math.max(140, available - totalW - monthW * 12);
    }
    var map = { proyecto: proyecto, Total: totalW };
    var months = [
      "01", "02", "03", "04", "05", "06",
      "07", "08", "09", "10", "11", "12",
    ];
    for (var i = 0; i < months.length; i++) map[months[i]] = monthW;
    return map;
  }

  // ─── Persistencia / layout — chart Mano de Obra (pestaña Mano de Obra) ─────
  var PS_MANO_OBRA_COL_STORAGE_KEY = "ps-mano-obra-col-widths-v1";
  var PS_MO_METRIC_COLS = [
    "01", "02", "03", "04", "05", "06",
    "07", "08", "09", "10", "11", "12", "Total",
  ];

  function isManoDeObraMatrixChart(chart) {

  function getDefaultManoDeObraWidths(chart) {

  function applyManoDeObraColumnLayout(api, chart) {
    if (!api || !chart) return;
    var map = getDefaultManoDeObraWidths(chart);
    var state = Object.keys(map).map(function (id) {
      var row = { colId: id, width: map[id] };
      if (id === "Total") row.pinned = "right";
      else row.pinned = null;
      return row;
    });
    // Recurso solo alimenta el árbol; no ocupa columna.
    state.push({ colId: "recurso", hide: true, width: 0 });
    try {
      api.applyColumnState({ state: state, applyOrder: false });
    } catch (e) { /* ignore */ }
  }

  function blankManoDeObraNA(chart) {

  function moEscapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function moParseNum(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var n = Number(String(v).replace(/\s/g, "").replace(",", "."));
    return isFinite(n) ? n : null;
  }

  function moSumField(rows, field) {
    var s = 0;
    var any = false;
    for (var i = 0; i < rows.length; i++) {
      var n = moParseNum(rows[i][field]);
      if (n == null) continue;
      s += n;
      any = true;
    }
    return any ? s : null;
  }

  function moLeafFingerprint(leaves) {
    var n = leaves.length;
    if (!n) return "0";
    var a = leaves[0];
    var b = leaves[n - 1];
    return [
      n,
      a && a.proyecto,
      a && a.recurso,
      b && b.proyecto,
      b && b.recurso,
      moSumField(leaves, "Total"),
    ].join("|");
  }

  function moCollectLeaves(api) {
    var leaves = [];
    if (!api || typeof api.forEachNode !== "function") return leaves;
    api.forEachNode(function (node) {
      if (!node || !node.data) return;
      var d = node.data;
      if (d.__psMoTree) return;
      if (d.proyecto == null || d.proyecto === "") return;
      // Sin columna recurso = datos viejos (solo proyecto); no armar árbol.
      if (!Object.prototype.hasOwnProperty.call(d, "recurso")) return;
      leaves.push(d);
    });
    return leaves;
  }

  function moDisplayProyecto(row, expandedMap) {
    if (!row) return "";
    if (row.__psMoNivel === -1) return "Total";
    if (row.__psMoNivel === 1) {
      var name = row.recurso != null && row.recurso !== "" ? row.recurso : "";
      return "\u00A0\u00A0\u00A0\u00A0" + name;
    }
    if (row.__psMoNivel === 0) {
      var proy = row.__psMoProyecto || row.proyecto || "";
      var exp = expandedMap[proy] !== false;
      return (exp ? "−  " : "+  ") + proy;
    }
    return row.proyecto == null ? "" : String(row.proyecto);
  }

  function moBuildTreeRows(leaves, expandedMap) {
    var byProy = {};
    var order = [];
    for (var i = 0; i < leaves.length; i++) {
      var d = leaves[i];
      var p = String(d.proyecto);
      if (!byProy[p]) {
        byProy[p] = [];
        order.push(p);
      }
      byProy[p].push(d);
    }
    order.sort(function (a, b) {
      return a.localeCompare(b, "es", { sensitivity: "base" });
    });

    var tree = [];
    for (var oi = 0; oi < order.length; oi++) {
      var proy = order[oi];
      var kids = byProy[proy].slice().sort(function (a, b) {
        return String(a.recurso || "").localeCompare(
          String(b.recurso || ""),
          "es",
          { sensitivity: "base" }
        );
      });
      var parent = {
        __psMoTree: true,
        __psMoNivel: 0,
        __psMoProyecto: proy,
        proyecto: proy,
        recurso: null,
      };
      for (var mi = 0; mi < PS_MO_METRIC_COLS.length; mi++) {
        var mk = PS_MO_METRIC_COLS[mi];
        parent[mk] = moSumField(kids, mk);
      }
      parent.proyecto = moDisplayProyecto(parent, expandedMap);
      tree.push(parent);

      var isExp = expandedMap[proy] !== false; // por defecto expandido (como PBI)
      if (!isExp) continue;
      for (var ki = 0; ki < kids.length; ki++) {
        var src = kids[ki];
        var child = {};
        for (var key in src) {
          if (Object.prototype.hasOwnProperty.call(src, key)) child[key] = src[key];
        }
        child.__psMoTree = true;
        child.__psMoNivel = 1;
        child.__psMoProyecto = proy;
        child.proyecto = moDisplayProyecto(child, expandedMap);
        tree.push(child);
      }
    }
    return tree;
  }

  function moGrandTotalRow(parents) {
    var row = {
      __psMoTree: true,
      __psMoNivel: -1,
      proyecto: "Total",
      recurso: null,
    };
    for (var i = 0; i < PS_MO_METRIC_COLS.length; i++) {
      var k = PS_MO_METRIC_COLS[i];
      row[k] = moSumField(parents, k);
    }
    return row;
  }

  function moApplyTreeColumnDefs(api) {
    if (!api || typeof api.getColumnDefs !== "function") return;
    var defs = api.getColumnDefs();
    if (!defs || !defs.length) return;
    var changed = false;
    var next = defs.map(function (d) {
      var id = String((d && (d.colId || d.field)) || "");
      if (id === "proyecto" || id.indexOf("proyecto") === 0) {
        changed = true;
        return Object.assign({}, d, {
          headerName: "Proyectos",
          // Sin cellRenderer React/DOM: el texto ya lleva −/+ e indentación.
        });
      }
      if (id === "recurso") {
        changed = true;
        return Object.assign({}, d, { hide: true, width: 0, suppressColumnsToolPanel: true });
      }
      return d;
    });
    if (!changed) return;
    try {
      if (typeof api.setGridOption === "function") {
        api.setGridOption("columnDefs", next);
      }
      if (typeof api.setGridOption === "function") {
        api.setGridOption("getRowClass", function (p) {
          var n = p && p.data && p.data.__psMoNivel;
          if (n === 0) return "ps-mo-row-parent";
          if (n === 1) return "ps-mo-row-child";
          if (n === -1) return "ps-mo-row-total";
          return "";
        });
      }
    } catch (e) { /* ignore */ }
  }

  function ensureManoObraTree(api, chart) {
    if (!api || !chart) return;
    var leaves = moCollectLeaves(api);
    if (!leaves.length) {
      // Ya treeificado: refrescar renderer/layout si hace falta
      if (api.__psMoTreeFp) {
        moApplyTreeColumnDefs(api);
        applyManoDeObraColumnLayout(api, chart);
      }
      return;
    }
    var fp = moLeafFingerprint(leaves);
    if (api.__psMoTreeFp === fp && api.__psMoTreeBuilt) return;

    if (!api.__psMoExpanded) api.__psMoExpanded = {};

    var tree = moBuildTreeRows(leaves, api.__psMoExpanded);
    var parents = tree.filter(function (r) {
      return r.__psMoNivel === 0;
    });
    var totalRow = moGrandTotalRow(parents);

    api.__psMoTreeBuilding = true;
    try {
      moApplyTreeColumnDefs(api);
      if (typeof api.setGridOption === "function") {
        api.setGridOption("rowData", tree);
        api.setGridOption("pinnedBottomRowData", [totalRow]);
        api.setGridOption("getRowId", function (p) {
          var d = p && p.data;
          if (!d) return undefined;
          if (d.__psMoNivel === -1) return "ps-mo-total";
          if (d.__psMoNivel === 0) return "p|" + d.__psMoProyecto;
          return (
            "c|" +
            d.__psMoProyecto +
            "|" +
            (d.recurso_code || d.recurso || "")
          );
        });
      }
      api.__psMoTreeFp = fp;
      api.__psMoTreeBuilt = true;
    } catch (err) {
      api.__psMoTreeBuilt = false;
    }
    api.__psMoTreeBuilding = false;

    applyManoDeObraColumnLayout(api, chart);
    blankManoDeObraNA(chart);
  }

  function initManoObraTreeToggle(api, chart) {
    if (!api || api.__psMoToggleInit) return;
    api.__psMoToggleInit = true;
    if (!api.__psMoExpanded) api.__psMoExpanded = {};

    try {
      api.addEventListener("cellClicked", function (e) {
        if (!e || !e.data || e.data.__psMoNivel !== 0) return;
        var colId = e.column && e.column.getColId ? e.column.getColId() : "";
        if (colId !== "proyecto") return;
        var proy = e.data.__psMoProyecto || e.data.proyecto;
        if (!proy) return;
        var leaves = api.__psMoLeavesCache;
        if (!leaves || !leaves.length) return;
        var cur = api.__psMoExpanded[proy] !== false;
        api.__psMoExpanded[proy] = !cur;

        var tree = moBuildTreeRows(leaves, api.__psMoExpanded);
        var parents = tree.filter(function (r) {
          return r.__psMoNivel === 0;
        });
        api.__psMoTreeBuilding = true;
        try {
          if (typeof api.setGridOption === "function") {
            api.setGridOption("rowData", tree);
            api.setGridOption("pinnedBottomRowData", [moGrandTotalRow(parents)]);
          }
          api.__psMoTreeBuilt = true;
        } catch (err) { /* ignore */ }
        api.__psMoTreeBuilding = false;
        applyManoDeObraColumnLayout(api, chart);
        blankManoDeObraNA(chart);
        if (typeof api.refreshCells === "function") {
          try {
            api.refreshCells({ columns: ["proyecto"], force: true });
          } catch (e2) { /* ignore */ }
        }
      });
    } catch (err) { /* ignore */ }
  }

  function fixManoDeObraProyectoColumn(api, chart) {
    if (!api) return;
    try {
      var defs = typeof api.getColumnDefs === "function" ? api.getColumnDefs() : null;
      if (defs && defs.length) {
        for (var i = 0; i < defs.length; i++) {
          var d = defs[i] || {};
          var id = String(d.colId || d.field || "");
          if (id === "proyecto" || id.indexOf("proyecto") === 0) {
            d.headerName = "Proyectos";
            if (d.cellRenderer) delete d.cellRenderer;
          }
          if (id === "recurso") {
            d.hide = true;
          }
        }
        if (typeof api.setGridOption === "function") {
          api.setGridOption("columnDefs", defs);
        }
      }
      if (typeof api.getColumn === "function") {
        var col = api.getColumn("proyecto");
        if (col && col.getColDef) {
          col.getColDef().headerName = "Proyectos";
          if (col.getColDef().cellRenderer) delete col.getColDef().cellRenderer;
          if (typeof api.refreshHeader === "function") api.refreshHeader();
        }
      }
    } catch (err) { /* grid aún montando */ }

    if (chart) {
      var headers = chart.querySelectorAll(".ag-header-cell");
      Array.prototype.forEach.call(headers, function (h) {
        var colId = h.getAttribute("col-id") || "";
        if (colId !== "proyecto") return;

  /**
   * Facturación por Probabilidad (ECharts):
   * - título = mismo tamaño que otros charts (CSS global 16px)
   * - ejes/valores = mismo px que celdas AG Grid (1.077em)
   * Nota: en Superset 6 no existe window.echarts → hay que hallar la instancia en el DOM.
   */
  function getTableFontPx() {
    var cell = document.querySelector(
      "[data-test-chart-name*='Resumen mensual'] .ag-cell"
    );
    if (cell) {
      var fs = parseFloat(window.getComputedStyle(cell).fontSize);
      if (fs && fs >= 10) return Math.round(fs);
    }
    // Probe 1.077em (misma regla CSS de tablas) dentro del tema AG Grid
    var host =
      document.querySelector(
        "[data-test-chart-name*='Resumen mensual'] [class*='ag-theme']"
      ) || document.body;
    var probe = document.createElement("span");
    probe.style.cssText =
      "font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;" +
      "font-size:1.077em;position:absolute;left:-9999px;visibility:hidden;";
    probe.textContent = "Ag";
    host.appendChild(probe);
    var px = Math.round(parseFloat(window.getComputedStyle(probe).fontSize) || 0);
    host.removeChild(probe);
    return px >= 10 ? px : 20;
  }

  function findEchartsInstance(root) {
    if (!root) return null;
    var nodes = [root].concat(
      Array.prototype.slice.call(root.querySelectorAll("div"))
    );
    var apis = [window.echarts, window.echartsLib].filter(Boolean);
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      for (var a = 0; a < apis.length; a++) {
        try {
          if (typeof apis[a].getInstanceByDom === "function") {
            var byDom = apis[a].getInstanceByDom(el);
            if (byDom) return byDom;
          }
        } catch (e1) {
          /* ignore */
        }
      }
      // Propiedades propias del nodo (algunas builds cuelgan la instancia aquí)
      try {
        var keys = Object.keys(el);
        for (var k = 0; k < keys.length; k++) {
          var val = el[keys[k]];
          if (
            val &&
            typeof val === "object" &&
            typeof val.setOption === "function" &&
            typeof val.getOption === "function"
          ) {
            return val;
          }
        }
        // React fiber → ref con setOption
        var fiberKey = keys.filter(function (x) {
          return (
            x.indexOf("__reactFiber") === 0 ||
            x.indexOf("__reactInternalInstance") === 0
          );
        })[0];
        if (fiberKey) {
          var fiber = el[fiberKey];
          var depth = 0;
          while (fiber && depth < 50) {
            var st = fiber.memoizedState;
            var sDepth = 0;
            while (st && sDepth < 30) {
              var memo = st.memoizedState;
              if (memo && typeof memo.setOption === "function") return memo;
              if (
                memo &&
                memo.current &&
                typeof memo.current.setOption === "function"
              ) {
                return memo.current;
              }
              st = st.next;
              sDepth++;
            }
            var props = fiber.memoizedProps || fiber.pendingProps || {};
            if (props.echartsInstance && props.echartsInstance.setOption) {
              return props.echartsInstance;
            }
            if (props.chartInstance && props.chartInstance.setOption) {
              return props.chartInstance;
            }
            fiber = fiber.return;
            depth++;
          }
        }
      } catch (e2) {
        /* ignore */
      }
    }
    return null;
  }

  /**
   * Importe en miles con sufijo K€ (p. ej. 90000 → «90 K€»).
   * Evita el número completo y el «90 €» cuando el valor era la categoría.
   */
  function formatEuroAmount(val) {
    if (val == null || val === "") return "";
    var raw = String(val).replace(/[^\d.-]/g, "");
    var n = typeof val === "number" ? val : Number(raw);
    if (!isFinite(n)) return String(val);
    var k = Math.round(n / 1000);
    return (
      k.toLocaleString("es-ES", {
        maximumFractionDigits: 0,
      }) + " K€"
    );
  }

  /**
   * En barra horizontal ECharts el value suele ser [importe, categoría] o
   * [categoría, importe]. Elegimos el de mayor magnitud (facturación ≫ 0–100).
   */
  function pickSeriesAmount(p) {
    var v =
      p && p.value != null
        ? p.value
        : p && p.data != null
          ? p.data
          : null;
    if (v && typeof v === "object" && !Array.isArray(v) && v.value != null) {
      v = v.value;
    }
    if (Array.isArray(v)) {
      var best = null;
      for (var i = 0; i < v.length; i++) {
        var n = typeof v[i] === "number" ? v[i] : Number(v[i]);
        if (!isFinite(n)) continue;
        if (best == null || Math.abs(n) > Math.abs(best)) best = n;
      }
      return best != null ? best : v[v.length - 1];
    }
    return v;
  }

  /** Categoría probabilidad: 100 → 100% (sin tocar si ya lleva %). */
  function formatProbPct(val) {
    if (val == null || val === "") return "";
    var s = String(val).trim();
    if (s.charAt(s.length - 1) === "%") return s;
    return s + "%";
  }

  /**
   * Horizontal bar: eje categoría = yAxis (izq.), valores = xAxis (abajo).
   * Añade % a la izquierda e importes en K€ (eje, labels, tooltip).
   */
  function applyProbabilidadFont(inst, fontPx) {
    if (!inst || typeof inst.setOption !== "function") return;
    var color = "#0f172a";
    var labelStyle = {
      fontSize: fontPx,
      color: color,
      fontFamily: "'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif",
      fontWeight: 400,
    };
    try {
      var opt = inst.getOption() || {};
      var seriesPatch = [];
      var series = opt.series || [];
      for (var s = 0; s < series.length; s++) {
        seriesPatch.push({
          label: Object.assign(
            {
              show: true,
              formatter: function (p) {
                return formatEuroAmount(pickSeriesAmount(p));
              },
            },
            labelStyle
          ),
        });
      }
      if (!seriesPatch.length) {
        seriesPatch = [
          {
            label: Object.assign(
              {
                show: true,
                formatter: function (p) {
                  return formatEuroAmount(pickSeriesAmount(p));
                },
              },
              labelStyle
            ),
          },
        ];
      }
      inst.setOption(
        {
          textStyle: labelStyle,
          /* Márgenes: left/right suficientes para «100%» y «NNNN K€» sin clip.
             containLabel suma el ancho real de ejes; left/right son mínimos. */
          grid: {
            left: 12,
            right: 40,
            top: 4,
            bottom: 12,
            containLabel: true,
          },
          // Valor (importes) en horizontal → xAxis
          xAxis: [
            {
              name: "",
              axisLabel: Object.assign(
                {
                  formatter: function (v) {
                    return formatEuroAmount(v);
                  },
                },
                labelStyle
              ),
              nameTextStyle: labelStyle,
            },
          ],
          // Categoría (probabilidad) en horizontal → yAxis
          yAxis: [
            {
              name: "",
              axisLabel: Object.assign(
                {
                  margin: 10,
                  hideOverlap: false,
                  formatter: function (v) {
                    return formatProbPct(v);
                  },
                },
                labelStyle
              ),
              nameTextStyle: labelStyle,
            },
          ],
          tooltip: {
            valueFormatter: function (v) {
              return formatEuroAmount(v);
            },
          },
          series: seriesPatch.map(function (sp) {
            return Object.assign({}, sp, {
              label: Object.assign({}, sp.label, {
                position: "right",
                distance: 6,
              }),
            });
          }),
        },
        false
      );
      try {
        if (typeof inst.resize === "function") inst.resize();
      } catch (eResize) {
        /* ignore */
      }
      inst.__psProbFmt = fontPx;
    } catch (err) {
      /* remount */
    }
  }

  function bumpProbabilidadChartFonts() {
    /* Probabilidad: −10% vs 0.715 → 0.6435 */
    var fontPx = Math.max(9, Math.round(getTableFontPx() * 0.6435));
    var roots = document.querySelectorAll(
      '[data-test-chart-name*="Facturación por Probabilidad"]'
    );
    Array.prototype.forEach.call(roots, function (root) {
      var inst = findEchartsInstance(root);
      if (!inst) return;
      // Reaplicar: Superset puede pisar formatters en refresh sin recrear la instancia
      applyProbabilidadFont(inst, fontPx);
    });
  }

  /**
   * Fallback fiable: al dibujar texto en el canvas de Probabilidad,
   * sustituir el px de la fuente por el de las tablas (Superset no expone echarts global)
   * y añadir % / € si el texto aún no los trae.
   */
  function patchProbabilidadCanvasFonts() {
    if (window.__psProbCanvasFontPatched) return;
    window.__psProbCanvasFontPatched = true;
    var proto = CanvasRenderingContext2D.prototype;
    var origFill = proto.fillText;
    var origStroke = proto.strokeText;
    var PROB_RE = /^(100|90|70|50|30|10|0)$/;
    var AMOUNT_RE = /^-?[\d.,]+$/;
    var EURO_RE = /^(-?[\d.,]+)\s*€$/;
    function rewriteText(raw) {
      var t = String(raw == null ? "" : raw).trim();
      if (!t) return raw;
      if (t.indexOf("K€") !== -1) return raw;
      if (PROB_RE.test(t)) return t + "%";
      var euroM = t.match(EURO_RE);
      if (euroM) {
        var nEuro = Number(String(euroM[1]).replace(/[^\d.-]/g, ""));
        // Solo reconvertir importes reales; «90 €» erróneo (=categoría) no → K€
        if (isFinite(nEuro) && Math.abs(nEuro) > 100) {
          return formatEuroAmount(nEuro);
        }
        return raw;
      }
      if (AMOUNT_RE.test(t) && t.indexOf("%") === -1) {
        // Eje/valores grandes (p. ej. 2000000 o 2,000,000); no tocar 0–100 del eje cat.
        var n = Number(t.replace(/[^\d.-]/g, ""));
        if (isFinite(n) && Math.abs(n) > 100) return formatEuroAmount(n);
      }
      return raw;
    }
    function boost(ctx) {
      try {
        var canvas = ctx.canvas;
        if (!canvas || !canvas.closest) return;
        if (
          !canvas.closest(
            '[data-test-chart-name*="Facturación por Probabilidad"]'
          )
        ) {
          return;
        }
        var fontPx = getTableFontPx();
        var f = String(ctx.font || "");
        var next = f.replace(/\d+(\.\d+)?px/i, fontPx + "px");
        if (next === f) {
          next =
            "normal " +
            fontPx +
            "px 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif";
        }
        ctx.font = next;
        // Números de tabla son casi negros; ECharts usa gris claro
        if (typeof ctx.fillStyle === "string") {
          var s = ctx.fillStyle.toLowerCase();
          if (
            s.indexOf("rgb") === 0 ||
            s.charAt(0) === "#" ||
            s === "gray" ||
            s === "grey"
          ) {
            ctx.fillStyle = "#0f172a";
          }
        }
      } catch (e) {
        /* ignore */
      }
    }
    proto.fillText = function (text) {
      boost(this);
      var args = Array.prototype.slice.call(arguments);
      args[0] = rewriteText(text);
      return origFill.apply(this, args);
    };
    proto.strokeText = function (text) {
      boost(this);
      var args = Array.prototype.slice.call(arguments);
      args[0] = rewriteText(text);
      return origStroke.apply(this, args);
    };
  }

  async function syncServerSimulation(email) {
    var emailN = (email || "").trim().toLowerCase();
    try {
      // GET evita CSRF (mismo patrón que /user-scope); cookie de sesión basta.
      var q = emailN ? "?email=" + encodeURIComponent(emailN) : "";
      var res = await fetch(appRoot() + "/api/v1/ps/simulate" + q, {
        credentials: "include",

        console.warn("[PS] sync simulación HTTP", res.status);

      console.log(
        emailN
          ? "[PS] Simulación servidor → " + emailN
          : "[PS] Simulación servidor limpiada"

      return true;
    } catch (err) {
      console.warn("[PS] sync simulación falló", err);
      return false;
    }
  }
