<script>
(function () {
  function appRoot() {
    return window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
  }

  // Bug APP_ROOT: ensureAppRoot() duplica /analytics en logout (y otros links).
  // Bootstrap ya trae /analytics/logout/ → el menú navega a /analytics/analytics/logout/.
  function collapseDoubleAppRoot(url) {
    if (!url) return url;
    return String(url).replace(/\/analytics\/analytics(\/|$)/g, "/analytics$1");
  }

  function fixDoubleAppRootAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll
      ? scope.querySelectorAll('a[href*="/analytics/analytics"]')
      : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href");
      var fixed = collapseDoubleAppRoot(href);
      if (fixed && fixed !== href) a.setAttribute("href", fixed);
    });
  }

  document.addEventListener(
    "click",
    function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var a = t.closest("a[href]");
      if (!a) return;
      var href = a.getAttribute("href") || "";
      // FAB Users sin APP_ROOT → Timesheet; forzar /analytics/users/...
      if (/^\/users(\/|$)/.test(href) || href.indexOf("://apps.powersolution.es/users/") !== -1) {
        ev.preventDefault();
        ev.stopPropagation();
        var path = href.replace(/^https?:\/\/[^/]+/, "");
        if (path.indexOf("/analytics/") !== 0) path = "/analytics" + path;
        path = collapseDoubleAppRoot(path);
        window.location.assign(path);
        return;
      }
      if (href.indexOf("/analytics/analytics") === -1) return;
      var fixed = collapseDoubleAppRoot(href);
      if (fixed === href) return;
      ev.preventDefault();
      ev.stopPropagation();
      window.location.assign(fixed);
    },
    true
  );

  function fixUsersAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll ? scope.querySelectorAll('a[href]') : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href") || "";
      if (!/^\/users(\/|$)/.test(href)) return;
      a.setAttribute("href", "/analytics" + href);
    });
  }

  var AG_GRID_CHART_SELECTORS = [
    "[data-test-chart-name*='Resumen mensual']",
    "[data-test-chart-name*='Proyectos']",
  ];

  /**
   * Fuerza que el AG Grid llene todo el espacio disponible dentro del card.
   * Calcula en píxeles: altura del holder − altura del header − 8px margen.
   * Aplica inline style a .slice_container y al div ag-theme-* para bypasear
   * cualquier inline style que React pueda estar poniendo.
   */
  function fixAgGridHeight() {
    AG_GRID_CHART_SELECTORS.forEach(function (sel) {
      var charts = document.querySelectorAll(sel);
      Array.prototype.forEach.call(charts, function (chart) {
        var header = chart.querySelector("[data-test='slice-header']");
        var sliceContainer = chart.querySelector(".slice_container");
        var agTheme = chart.querySelector('[class*="ag-theme"]');
        if (!sliceContainer || !agTheme) return;

        var holderH = chart.getBoundingClientRect().height;
        var headerH = header ? header.getBoundingClientRect().height : 0;
        var available = Math.floor(holderH - headerH - 8);
        if (available < 80) return; // aún no renderizado

        var current = parseInt(sliceContainer.style.height, 10);
        if (Math.abs(current - available) < 4) return; // ya correcto, no reasignar

        sliceContainer.style.setProperty("height", available + "px", "important");
        sliceContainer.style.setProperty("overflow", "hidden", "important");
        agTheme.style.setProperty("height", available + "px", "important");
      });
    });
  }

  /**
   * Localiza GridApi de AG Grid (fiber React + hooks del root DOM).
   */
  function findApiInFiberTree(fiber, maxNodes) {
    var queue = [fiber];
    var seen = 0;
    while (queue.length && seen < maxNodes) {
      var f = queue.shift();
      seen += 1;
      if (!f) continue;
      var props = f.memoizedProps || f.pendingProps;
      if (props) {
        if (props.api && typeof props.api.autoSizeAllColumns === "function") {
          return props.api;
        }
        if (props.gridApi && typeof props.gridApi.autoSizeAllColumns === "function") {
          return props.gridApi;
        }
        if (
          props.gridRef &&
          props.gridRef.current &&
          props.gridRef.current.api &&
          typeof props.gridRef.current.api.autoSizeAllColumns === "function"
        ) {
          return props.gridRef.current.api;
        }
      }
      if (f.stateNode) {
        var sn = f.stateNode;
        if (sn.api && typeof sn.api.autoSizeAllColumns === "function") return sn.api;
        if (sn.gridApi && typeof sn.gridApi.autoSizeAllColumns === "function") {
          return sn.gridApi;
        }
        if (
          sn.beans &&
          sn.beans.gridApi &&
          typeof sn.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return sn.beans.gridApi;
        }
      }
      var state = f.memoizedState;
      var sd = 0;
      while (state && sd < 40) {
        var ms = state.memoizedState;
        if (ms) {
          if (typeof ms.autoSizeAllColumns === "function") return ms;
          if (ms.current && typeof ms.current.autoSizeAllColumns === "function") {
            return ms.current;
          }
          if (ms.api && typeof ms.api.autoSizeAllColumns === "function") return ms.api;
        }
        state = state.next;
        sd += 1;
      }
      if (f.child) queue.push(f.child);
      if (f.sibling) queue.push(f.sibling);
    }
    return null;
  }

  function findAgGridApi(rootEl) {
    if (!rootEl) return null;
    var agRoot = rootEl.querySelector(".ag-root") || rootEl;
    var directKeys = Object.keys(agRoot);
    for (var di = 0; di < directKeys.length; di++) {
      var val = agRoot[directKeys[di]];
      if (val && typeof val === "object") {
        if (typeof val.autoSizeAllColumns === "function") return val;
        if (val.api && typeof val.api.autoSizeAllColumns === "function") return val.api;
        if (
          val.beans &&
          val.beans.gridApi &&
          typeof val.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return val.beans.gridApi;
        }
      }
    }
    var candidates = [rootEl, agRoot];
    for (var ci = 0; ci < candidates.length; ci++) {
      var el = candidates[ci];
      var keys = Object.keys(el);
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        if (
          key.indexOf("__reactFiber") === 0 ||
          key.indexOf("__reactInternalInstance") === 0
        ) {
          var api = findApiInFiberTree(el[key], 300);
          if (api) return api;
        }
      }
    }
    var nodes = rootEl.querySelectorAll(
      ".ag-root-wrapper, .ag-root, [class*='ag-theme']"
    );
    for (var ni = 0; ni < nodes.length; ni++) {
      var n = nodes[ni];
      var nkeys = Object.keys(n);
      for (var nj = 0; nj < nkeys.length; nj++) {
        var nk = nkeys[nj];
        if (
          nk.indexOf("__reactFiber") === 0 ||
          nk.indexOf("__reactInternalInstance") === 0
        ) {
          var a2 = findApiInFiberTree(n[nk], 200);
          if (a2) return a2;
        }
      }
    }
    return null;
  }

  /**
   * Superset llama sizeColumnsToFit() y ensancha al card. Lo redirigimos a
   * ajuste por contenido para evitar holgura y scroll horizontal.
   */
  function patchSizeColumnsToFit(api) {
    if (!api || api.__psAutosizePatched) return;
    if (typeof api.sizeColumnsToFit !== "function") return;
    api.__psAutosizePatched = true;
    api.sizeColumnsToFit = function () {
      try {
        /* no-op: el ajuste real lo hace fitColumnsByDomMeasure */
      } catch (err) {
        /* ignore */
      }
    };
  }

  /**
   * Mide cabecera + celdas y aplica anchos.
   * opts.pad / opts.lock / opts.fitViewport / opts.flexTextColumn
   * flexTextColumn: la columna de texto (proyecto / ano_mes) usa el resto del viewport;
   * las métricas (Fact., Coste, Margen %) quedan justas al contenido.
   */
  function isMetricColId(colId) {
    var id = String(colId || "");
    return /Fact|Coste|Margen|facturacion|coste|margen/i.test(id);
  }

  function isHiddenSortColId(colId) {
    var id = String(colId || "");
    return id === "year" || id === "month";
  }

  /** Orden cronológico de ano_mes (MM/YYYY) en cliente — sin columnas year/month. */
  function anoMesSortKey(value) {
    var m = String(value || "").match(/(\d{1,2})\s*\/\s*(\d{4})/);
    if (!m) return 0;
    return parseInt(m[2], 10) * 100 + parseInt(m[1], 10);
  }

  function sortResumenByAnoMes(api) {
    if (!api) return;
    try {
      // Resolver colId real de "Año/Mes" (según versión puede variar)
      var dateColId = "ano_mes";
      var colsForDate =
        typeof api.getColumns === "function"
          ? api.getColumns()
          : typeof api.getAllDisplayedColumns === "function"
            ? api.getAllDisplayedColumns()
            : [];
      for (var dc = 0; dc < colsForDate.length; dc++) {
        var c = colsForDate[dc];
        var cid =
          typeof c.getColId === "function" ? c.getColId() : c.colId || "";
        var cdef =
          typeof c.getColDef === "function" ? c.getColDef() : c.colDef || {};
        var h = String(cdef.headerName || cdef.field || cid || "");
        if (/año\s*\/?\s*mes|ano[_\s-]?mes/i.test(h)) {
          dateColId = cid || "ano_mes";
          break;
        }
      }

      // 1) Quitar sort de métricas (Superset deja Fact. DESC si no hay order_by)
      var state = [];
      var cols =
        typeof api.getColumns === "function"
          ? api.getColumns()
          : typeof api.getAllDisplayedColumns === "function"
            ? api.getAllDisplayedColumns()
            : [];
      for (var i = 0; i < cols.length; i++) {
        var col = cols[i];
        var id =
          typeof col.getColId === "function"
            ? col.getColId()
            : col.colId || col;
        if (!id || id.charAt(0) === "_") continue;
        if (isMetricColId(id)) {
          state.push({ colId: id, sort: null });
        }
      }
      // 2) Comparator cronológico MM/YYYY
      var colDef =
        typeof api.getColumnDef === "function" ? api.getColumnDef(dateColId) : null;
      if (colDef) {
        colDef.comparator = function (a, b) {
          return anoMesSortKey(a) - anoMesSortKey(b);
        };
      }
      var colObj =
        typeof api.getColumn === "function" ? api.getColumn(dateColId) : null;
      if (colObj && typeof colObj.getColDef === "function") {
        colObj.getColDef().comparator = function (a, b) {
          return anoMesSortKey(a) - anoMesSortKey(b);
        };
      }
      state.push({ colId: dateColId, sort: "asc", sortIndex: 0 });
      if (typeof api.applyColumnState === "function") {
        api.applyColumnState({
          state: state,
          defaultState: { sort: null },
        });
      }
      if (typeof api.setSortModel === "function") {
        api.setSortModel([{ colId: dateColId, sort: "asc" }]);
      }
      if (typeof api.refreshClientSideRowModel === "function") {
        api.refreshClientSideRowModel("sort");
      }

      // 3) Fallback duro: reordenar rowData si AG Grid ignora el sort model.
      var rows = [];
      if (typeof api.forEachNode === "function") {
        api.forEachNode(function (node) {
          if (!node || !node.data) return;
          rows.push(node.data);
        });
      }
      if (rows.length > 1) {
        var keyOf = function (r) {
          return (
            r[dateColId] ||
            r.ano_mes ||
            r["Año/Mes"] ||
            r["Ano/Mes"] ||
            r["AñoMes"] ||
            ""
          );
        };
        var sorted = rows.slice().sort(function (a, b) {
          return anoMesSortKey(keyOf(a)) - anoMesSortKey(keyOf(b));
        });
        var isDifferent = false;
        for (var ri = 0; ri < rows.length; ri++) {
          if (keyOf(rows[ri]) !== keyOf(sorted[ri])) {
            isDifferent = true;
            break;
          }
        }
        if (isDifferent) {
          if (typeof api.setGridOption === "function") {
            api.setGridOption("rowData", sorted);
          } else if (typeof api.setRowData === "function") {
            api.setRowData(sorted);
          }
        }
      }
    } catch (e) {
      /* grid montando */
    }
  }

  /** year/month: ordenan pero no deben ocupar píxeles (hueco a la izquierda). */
  function collapseHiddenSortColumns(api) {
    if (!api) return;
    ["year", "month"].forEach(function (id) {
      try {
        if (typeof api.setColumnVisible === "function") {
          api.setColumnVisible(id, false);
        }
      } catch (e) {
        /* col aún no montada */
      }
    });
    if (typeof api.applyColumnState !== "function") return;
    api.applyColumnState({
      state: [
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
          sort: "asc",
          sortIndex: 0,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
          sort: "asc",
          sortIndex: 1,
        },
      ],
    });
  }

  function getViewportWidth(chart) {
    // Preferir cabecera: refleja el ancho útil real (sin gutter del scroll vertical).
    var vp =
      chart.querySelector(".ag-header-viewport") ||
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport");
    var avail = vp ? Math.floor(vp.clientWidth) : 0;
    if (avail < 80) {
      var root = chart.querySelector(".ag-root-wrapper") || chart;
      avail = Math.floor(root.getBoundingClientRect().width) - 8;
    }
    // Margen anti-scroll fantasma (bordes, subpixel, scrollbar vertical).
    return Math.max(0, avail - 20);
  }

  function getHorizontalOverflow(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport");
    if (!vp) return 0;
    return Math.max(0, vp.scrollWidth - vp.clientWidth);
  }

  /** Reduce la columna de texto hasta eliminar el scroll horizontal. */
  function shrinkTextColumnToClearScroll(chart, api) {
    if (!api || typeof api.getColumnState !== "function") return false;
    var overflow = getHorizontalOverflow(chart);
    if (overflow <= 1) return false;
    var cols = api.getColumnState() || [];
    var textCol = null;
    for (var i = 0; i < cols.length; i++) {
      var id = cols[i].colId;
      if (!id || id.charAt(0) === "_") continue;
      if (isHiddenSortColId(id) || isMetricColId(id)) continue;
      textCol = cols[i];
      break;
    }
    if (!textCol) return false;
    var cur = textCol.width || 200;
    var nw = Math.max(100, Math.floor(cur - overflow - 8));
    if (nw >= cur) return false;
    api.applyColumnState({
      state: [
        {
          colId: textCol.colId,
          width: nw,
          minWidth: Math.min(100, nw),
          maxWidth: nw,
          flex: null,
        },
      ],
      defaultState: { flex: null },
    });
    return true;
  }

  function fitColumnsByDomMeasure(chart, api, opts) {
    opts = opts || {};
    if (!api || typeof api.applyColumnState !== "function") return false;
    var headerCells = chart.querySelectorAll(".ag-header-viewport .ag-header-cell");
    if (!headerCells.length) return false;
    var sampleCell =
      chart.querySelector(".ag-center-cols-container .ag-cell") ||
      chart.querySelector(".custom-header") ||
      chart.querySelector(".ag-header-cell-text") ||
      chart.querySelector(".ag-header-cell");
    var font = sampleCell
      ? window.getComputedStyle(sampleCell).font
      : "14px 'Segoe UI', sans-serif";
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    if (!ctx) return false;
    ctx.font = font;
    var pad = typeof opts.pad === "number" ? opts.pad : 24;
    var state = [];
    Array.prototype.forEach.call(headerCells, function (hc) {
      var colId = hc.getAttribute("col-id");
      if (!colId || colId.charAt(0) === "_") return;
      if (isHiddenSortColId(colId)) return;
      var headerEl =
        hc.querySelector(".custom-header") ||
        hc.querySelector(".ag-header-cell-text") ||
        hc.querySelector(".ag-header-cell-label");
      var headerText = headerEl ? (headerEl.textContent || "").trim() : "";
      // Cabeceras de métricas: no usar texto truncado con ellipsis del DOM
      if (isMetricColId(colId)) {
        if (/margen/i.test(colId)) headerText = "Margen %";
        else if (/coste/i.test(colId)) headerText = "Coste";
        else if (/fact/i.test(colId)) {
          headerText =
            headerText.indexOf("Fact.") === 0 && headerText.length <= 6
              ? "Fact."
              : "Facturación";
        }
      }
      var maxPx = headerText
        ? Math.ceil(ctx.measureText(headerText).width) + pad
        : pad + 40;
      var bodyCells = chart.querySelectorAll(
        '.ag-center-cols-container .ag-cell[col-id="' + colId + '"]'
      );
      var limit = Math.min(bodyCells.length, 80);
      for (var i = 0; i < limit; i++) {
        var t = (bodyCells[i].textContent || "").trim();
        if (!t) continue;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      }
      var pinCells = chart.querySelectorAll(
        '.ag-floating-bottom .ag-cell[col-id="' + colId + '"]'
      );
      Array.prototype.forEach.call(pinCells, function (pc) {
        if (window.getComputedStyle(pc).visibility === "hidden") return;
        var t = (pc.textContent || "").trim();
        if (!t) return;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      });
      if (maxPx < 44) maxPx = 44;
      // Tope a métricas: no hace falta más de ~140px salvo totales largos
      if (isMetricColId(colId) && maxPx > 160) maxPx = 160;
      var colState = { colId: colId, width: maxPx, flex: null };
      if (opts.lock || (opts.lockMetrics && isMetricColId(colId))) {
        colState.minWidth = maxPx;
        colState.maxWidth = maxPx;
      }
      state.push(colState);
    });
    if (!state.length) return false;

    // Incluir year/month a 0 en el mismo apply (evita hueco izquierdo)
    if (opts.collapseSortCols) {
      state.push(
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
          sort: "asc",
          sortIndex: 0,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
          sort: "asc",
          sortIndex: 1,
        }
      );
    }

    var avail = getViewportWidth(chart);

    if (opts.flexTextColumn && avail > 80) {
      var metricsTotal = 0;
      var textIdx = -1;
      for (var fi = 0; fi < state.length; fi++) {
        if (isHiddenSortColId(state[fi].colId)) continue;
        if (isMetricColId(state[fi].colId)) {
          metricsTotal += state[fi].width;
        } else if (textIdx === -1) {
          textIdx = fi;
        } else {
          metricsTotal += state[fi].width;
        }
      }
      if (textIdx >= 0) {
        // avail ya trae margen; no sumar más holgura aquí
        var textW = Math.max(120, avail - metricsTotal);
        state[textIdx].width = textW;
        state[textIdx].minWidth = 100;
        state[textIdx].maxWidth = textW;
        state[textIdx].flex = null;
      }
    } else if (opts.fitViewport && avail > 80) {
      var total = 0;
      for (var ti = 0; ti < state.length; ti++) {
        if (isHiddenSortColId(state[ti].colId)) continue;
        total += state[ti].width;
      }
      // Encoger SIEMPRE si no cabe (pantallas estrechas / card chica)
      if (total > avail) {
        var scale = (avail - 2) / total;
        for (var si = 0; si < state.length; si++) {
          if (isHiddenSortColId(state[si].colId)) continue;
          var nw = Math.max(48, Math.floor(state[si].width * scale));
          state[si].width = nw;
          if (opts.lock || (opts.lockMetrics && isMetricColId(state[si].colId))) {
            state[si].minWidth = nw;
            state[si].maxWidth = nw;
          }
        }
      }
    }

    api.applyColumnState({ state: state, defaultState: { flex: null } });
    // Tras medir visibles, forzar year/month a 0 (si no, dejan hueco a la izquierda)
    collapseHiddenSortColumns(api);
    return true;
  }

  function isResumenMensualChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Resumen mensual") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t.indexOf("Resumen mensual") !== -1;
  }

  function isProyectosChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Proyectos") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Proyectos" || t.indexOf("Proyectos") === 0;
  }

  function hasHorizontalScroll(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport") ||
      chart.querySelector(".ag-body-viewport");
    if (!vp) return false;
    return vp.scrollWidth > vp.clientWidth + 2;
  }

  /**
   * Resumen: columnas al contenido, alineadas a la IZQUIERDA (sin flex).
   * Proyectos: métricas justas; columna texto = resto (sin scroll).
   */
  function autoSizeAgGridColumns() {
    AG_GRID_CHART_SELECTORS.forEach(function (sel) {
      var charts = document.querySelectorAll(sel);
      Array.prototype.forEach.call(charts, function (chart) {
        var agTheme = chart.querySelector('[class*="ag-theme"]');
        if (!agTheme) return;
        var rows = chart.querySelectorAll(".ag-center-cols-container .ag-row");
        if (!rows.length) return;

        var api = findAgGridApi(agTheme);
        if (!api) return;

        patchSizeColumnsToFit(api);
        try {
          var resumen = isResumenMensualChart(chart);
          var proyectos = isProyectosChart(chart);
          if (resumen) {
            collapseHiddenSortColumns(api);
            sortResumenByAnoMes(api);
          }
          var ok = fitColumnsByDomMeasure(chart, api, {
            pad: resumen || proyectos ? 14 : 24,
            lock: !!resumen,
            lockMetrics: !!proyectos,
            // Resumen: encoger para que quepan las 4 cols a la izquierda
            fitViewport: !!resumen,
            flexTextColumn: !!proyectos,
            collapseSortCols: !!resumen,
          });
          if (!ok && typeof api.autoSizeAllColumns === "function") {
            try {
              api.autoSizeAllColumns(false);
            } catch (e1) {
              try {
                api.autoSizeAllColumns({ skipHeader: false });
              } catch (e2) {
                /* ignore */
              }
            }
          }
          if (resumen) {
            collapseHiddenSortColumns(api);
            sortResumenByAnoMes(api);
            if (hasHorizontalScroll(chart)) {
              fitColumnsByDomMeasure(chart, api, {
                pad: 10,
                lock: true,
                fitViewport: true,
                flexTextColumn: false,
                collapseSortCols: true,
              });
              collapseHiddenSortColumns(api);
            }
          }
          if (proyectos && hasHorizontalScroll(chart)) {
            fitColumnsByDomMeasure(chart, api, {
              pad: 12,
              lockMetrics: true,
              flexTextColumn: true,
            });
            shrinkTextColumnToClearScroll(chart, api);
            if (hasHorizontalScroll(chart)) {
              shrinkTextColumnToClearScroll(chart, api);
            }
          }
        } catch (err) {
          /* grid aún montando */
        }
      });
    });
  }

  setInterval(function () {
    fixDoubleAppRootAnchors(document);
    fixUsersAnchors(document);
    moveProyectosSearchBesideTitle();
    fixAgGridHeight();
    autoSizeAgGridColumns();
    hideResumenHeaderChrome();
    bumpProbabilidadChartFonts();
  }, 800);

  /**
   * Facturación por Probabilidad (ECharts):
   * - título = mismo tamaño que otros charts (CSS global 16px)
   * - ejes/valores = mismo px que celdas AG Grid (1.26em)
   * Nota: en Superset 6 no existe window.echarts → hay que hallar la instancia en el DOM.
   */
  function getTableFontPx() {
    var cell = document.querySelector(
      "[data-test-chart-name*='Proyectos'] .ag-cell, " +
        "[data-test-chart-name*='Resumen mensual'] .ag-cell"
    );
    if (cell) {
      var fs = parseFloat(window.getComputedStyle(cell).fontSize);
      if (fs && fs >= 10) return Math.round(fs);
    }
    // Probe 1.26em (misma regla CSS de tablas) dentro del tema AG Grid
    var host =
      document.querySelector(
        "[data-test-chart-name*='Proyectos'] [class*='ag-theme']"
      ) || document.body;
    var probe = document.createElement("span");
    probe.style.cssText =
      "font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;" +
      "font-size:1.26em;position:absolute;left:-9999px;visibility:hidden;";
    probe.textContent = "Ag";
    host.appendChild(probe);
    var px = Math.round(parseFloat(window.getComputedStyle(probe).fontSize) || 0);
    host.removeChild(probe);
    return px >= 10 ? px : 20;
  }

  function findEchartsInstance(root) {
    if (!root) return null;
    var nodes = [root].concat(
      Array.prototype.slice.call(root.querySelectorAll("div"))
    );
    var apis = [window.echarts, window.echartsLib].filter(Boolean);
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      for (var a = 0; a < apis.length; a++) {
        try {
          if (typeof apis[a].getInstanceByDom === "function") {
            var byDom = apis[a].getInstanceByDom(el);
            if (byDom) return byDom;
          }
        } catch (e1) {
          /* ignore */
        }
      }
      // Propiedades propias del nodo (algunas builds cuelgan la instancia aquí)
      try {
        var keys = Object.keys(el);
        for (var k = 0; k < keys.length; k++) {
          var val = el[keys[k]];
          if (
            val &&
            typeof val === "object" &&
            typeof val.setOption === "function" &&
            typeof val.getOption === "function"
          ) {
            return val;
          }
        }
        // React fiber → ref con setOption
        var fiberKey = keys.filter(function (x) {
          return (
            x.indexOf("__reactFiber") === 0 ||
            x.indexOf("__reactInternalInstance") === 0
          );
        })[0];
        if (fiberKey) {
          var fiber = el[fiberKey];
          var depth = 0;
          while (fiber && depth < 50) {
            var st = fiber.memoizedState;
            var sDepth = 0;
            while (st && sDepth < 30) {
              var memo = st.memoizedState;
              if (memo && typeof memo.setOption === "function") return memo;
              if (
                memo &&
                memo.current &&
                typeof memo.current.setOption === "function"
              ) {
                return memo.current;
              }
              st = st.next;
              sDepth++;
            }
            var props = fiber.memoizedProps || fiber.pendingProps || {};
            if (props.echartsInstance && props.echartsInstance.setOption) {
              return props.echartsInstance;
            }
            if (props.chartInstance && props.chartInstance.setOption) {
              return props.chartInstance;
            }
            fiber = fiber.return;
            depth++;
          }
        }
      } catch (e2) {
        /* ignore */
      }
    }
    return null;
  }

  function applyProbabilidadFont(inst, fontPx) {
    if (!inst || typeof inst.setOption !== "function") return;
    var color = "#0f172a";
    var labelStyle = {
      fontSize: fontPx,
      color: color,
      fontFamily: "'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif",
      fontWeight: 400,
    };
    try {
      var opt = inst.getOption() || {};
      var seriesPatch = [];
      var series = opt.series || [];
      for (var s = 0; s < series.length; s++) {
        seriesPatch.push({
          label: Object.assign({ show: true }, labelStyle),
        });
      }
      if (!seriesPatch.length) {
        seriesPatch = [{ label: Object.assign({ show: true }, labelStyle) }];
      }
      inst.setOption(
        {
          textStyle: labelStyle,
          xAxis: [
            {
              axisLabel: labelStyle,
              nameTextStyle: labelStyle,
            },
          ],
          yAxis: [
            {
              axisLabel: labelStyle,
              nameTextStyle: labelStyle,
            },
          ],
          series: seriesPatch,
        },
        false
      );
    } catch (err) {
      /* remount */
    }
  }

  function bumpProbabilidadChartFonts() {
    var fontPx = getTableFontPx();
    var roots = document.querySelectorAll(
      '[data-test-chart-name*="Facturación por Probabilidad"]'
    );
    Array.prototype.forEach.call(roots, function (root) {
      var inst = findEchartsInstance(root);
      if (!inst) return;
      var opt = {};
      try {
        opt = inst.getOption() || {};
      } catch (e) {
        return;
      }
      var y0 = (opt.yAxis && opt.yAxis[0]) || {};
      var cur = (y0.axisLabel && y0.axisLabel.fontSize) || 0;
      var s0 = (opt.series && opt.series[0] && opt.series[0].label) || {};
      var curLabel = s0.fontSize || 0;
      if (cur === fontPx && curLabel === fontPx) return;
      applyProbabilidadFont(inst, fontPx);
    });
  }

  /**
   * Fallback fiable: al dibujar texto en el canvas de Probabilidad,
   * sustituir el px de la fuente por el de las tablas (Superset no expone echarts global).
   */
  function patchProbabilidadCanvasFonts() {
    if (window.__psProbCanvasFontPatched) return;
    window.__psProbCanvasFontPatched = true;
    var proto = CanvasRenderingContext2D.prototype;
    var origFill = proto.fillText;
    var origStroke = proto.strokeText;
    function boost(ctx) {
      try {
        var canvas = ctx.canvas;
        if (!canvas || !canvas.closest) return;
        if (
          !canvas.closest(
            '[data-test-chart-name*="Facturación por Probabilidad"]'
          )
        ) {
          return;
        }
        var fontPx = getTableFontPx();
        var f = String(ctx.font || "");
        var next = f.replace(/\d+(\.\d+)?px/i, fontPx + "px");
        if (next === f) {
          next =
            "normal " +
            fontPx +
            "px 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif";
        }
        ctx.font = next;
        // Números de tabla son casi negros; ECharts usa gris claro
        if (typeof ctx.fillStyle === "string") {
          var s = ctx.fillStyle.toLowerCase();
          if (
            s.indexOf("rgb") === 0 ||
            s.charAt(0) === "#" ||
            s === "gray" ||
            s === "grey"
          ) {
            ctx.fillStyle = "#0f172a";
          }
        }
      } catch (e) {
        /* ignore */
      }
    }
    proto.fillText = function () {
      boost(this);
      return origFill.apply(this, arguments);
    };
    proto.strokeText = function () {
      boost(this);
      return origStroke.apply(this, arguments);
    };
  }

  patchProbabilidadCanvasFonts();

  /**
   * Localiza el chart «Resumen mensual» por atributo o por título del slice.
   */
  function findResumenMensualCharts() {
    var found = [];
    var byAttr = document.querySelectorAll(
      '.chart-slice[data-test-chart-name*="Resumen mensual"], [data-test-chart-name*="Resumen mensual"]'
    );
    Array.prototype.forEach.call(byAttr, function (el) {
      found.push(el);
    });
    var headers = document.querySelectorAll('[data-test="slice-header"]');
    Array.prototype.forEach.call(headers, function (h) {
      var titleEl =
        h.querySelector(".header-title") ||
        h.querySelector(".editable-title") ||
        h;
      var t = (titleEl.textContent || "").replace(/\s+/g, " ").trim();
      if (t.indexOf("Resumen mensual") === -1) return;
      var chart =
        h.closest(".chart-slice") ||
        h.closest('[data-test="chart-grid-component"]') ||
        h.closest(".dashboard-component-chart-holder");
      if (chart && found.indexOf(chart) === -1) found.push(chart);
    });
    return found;
  }

  /**
   * CSS forzado: oculta filtro/menú/resize en Resumen mensual.
   * Usa hermanos de .custom-header (estructura CustomHeader de Superset).
   */
  function ensurePsTableStyle() {
    var style = document.getElementById("ps-ag-grid-overrides");
    var css = [
      /* Hermanos del título = filtro + menú ⋮ */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .custom-header ~ *,',
      '[data-test-chart-name*="Resumen mensual"] .custom-header ~ *,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .header-filter,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .three-dots-menu,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell-resize,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell-menu-button,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-icon-filter,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-icon,',
      '[data-test-chart-name*="Resumen mensual"] .header-filter,',
      '[data-test-chart-name*="Resumen mensual"] .three-dots-menu,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell-resize,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell-menu-button,',
      '[data-test-chart-name*="Resumen mensual"] .ag-icon-filter,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-icon {',
      "  display: none !important;",
      "  visibility: hidden !important;",
      "  opacity: 0 !important;",
      "  width: 0 !important;",
      "  max-width: 0 !important;",
      "  height: 0 !important;",
      "  overflow: hidden !important;",
      "  pointer-events: none !important;",
      "  position: absolute !important;",
      "  left: -9999px !important;",
      "}",
      /* SVG del funnel de filtro (viewBox 24x24 con 3 barras) */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell svg[viewBox="0 0 24 24"],',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell svg[viewBox="0 0 24 24"] {',
      "  display: none !important;",
      "}",
      /* year/month ocultos (orden cronológico) */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell[col-id="year"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-cell[col-id="year"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell[col-id="month"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-cell[col-id="month"] {',
      "  display: none !important;",
      "  width: 0 !important;",
      "  max-width: 0 !important;",
      "  padding: 0 !important;",
      "  border: none !important;",
      "}",
    ].join("\n");
    if (!style) {
      style = document.createElement("style");
      style.id = "ps-ag-grid-overrides";
      document.documentElement.appendChild(style);
    }
    if (style.textContent !== css) style.textContent = css;
  }

  function hideResumenHeaderChrome() {
    ensurePsTableStyle();
    var charts = findResumenMensualCharts();
    Array.prototype.forEach.call(charts, function (chart) {
      var nodes = chart.querySelectorAll(
        [
          ".header-filter",
          ".three-dots-menu",
          ".ag-header-cell-resize",
          ".ag-header-cell-menu-button",
          ".ag-icon-filter",
          ".ag-header-icon",
          ".custom-header ~ *",
          '.ag-header-cell svg[viewBox="0 0 24 24"]',
        ].join(",")
      );
      Array.prototype.forEach.call(nodes, function (el) {
        el.style.setProperty("display", "none", "important");
        el.style.setProperty("visibility", "hidden", "important");
        el.style.setProperty("opacity", "0", "important");
        el.style.setProperty("pointer-events", "none", "important");
        el.setAttribute("aria-hidden", "true");
      });
    });
  }

  // Observa el DOM: React re-monta cabeceras y vuelve a pintar el filtro
  if (!window.__psResumenFilterObserver) {
    try {
      var hideTimer = null;
      window.__psResumenFilterObserver = new MutationObserver(function () {
        if (hideTimer) return;
        hideTimer = setTimeout(function () {
          hideTimer = null;
          hideResumenHeaderChrome();
        }, 200);
      });
      window.__psResumenFilterObserver.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    } catch (err) {
      /* ignore */
    }
  }

  /**
   * Crea un input proxy junto al título «Proyectos» que reenvía al input
   * real de AG Grid (filter-text-box). No mueve nodos React (se resetearían).
   * Oculta el contenedor original con el search.
   */
  function moveProyectosSearchBesideTitle() {
    var charts = document.querySelectorAll(
      "[data-test-chart-name*='Proyectos']"
    );
    Array.prototype.forEach.call(charts, function (chart) {
      var header = chart.querySelector("[data-test='slice-header']");
      if (!header) return;

      var realInput = chart.querySelector("#filter-text-box");
      if (!realInput) return;

      // Si el proxy ya existe y está vivo, nada que hacer
      var existing = header.querySelector(".ps-search-proxy");
      if (existing) {
        // sincronizar placeholder por si cambió el idioma
        existing.placeholder = realInput.placeholder;
        return;
      }

      // Crear input proxy (no es un nodo React; React no lo toca)
      var proxy = document.createElement("input");
      proxy.type = "text";
      proxy.placeholder = realInput.placeholder || "Buscar";
      proxy.className = "ps-search-proxy";
      proxy.setAttribute("aria-label", "Buscar proyectos");
      proxy.style.cssText = [
        "border:1px solid #d9d9d9",
        "border-radius:6px",
        "padding:3px 10px 3px 8px",
        "font-size:14px",
        "height:28px",
        "margin-left:10px",
        "outline:none",
        "background:#fff",
        "color:#333",
        "flex:0 0 auto",
        "min-width:160px",
        "vertical-align:middle",
        "cursor:text",
      ].join(";");

      // Reenviar escritura al AG Grid input real y disparar su evento
      proxy.addEventListener("input", function () {
        var nativeInputDescriptor = Object.getOwnPropertyDescriptor(
          window.HTMLInputElement.prototype,
          "value"
        );
        nativeInputDescriptor.set.call(realInput, proxy.value);
        realInput.dispatchEvent(new Event("input", { bubbles: true }));
      });
      proxy.addEventListener("focus", function () {
        proxy.style.borderColor = "#007c89";
      });
      proxy.addEventListener("blur", function () {
        proxy.style.borderColor = "#d9d9d9";
      });

      // Insertar justo después del div.header-title
      var title =
        header.querySelector(".header-title") ||
        header.querySelector(".editable-title");
      if (title && title.nextSibling) {
        header.insertBefore(proxy, title.nextSibling);
      } else if (title) {
        header.appendChild(proxy);
      } else {
        header.insertBefore(proxy, header.firstChild);
      }

      // Ocultar el contenedor original del search (debajo del header)
      var origContainer = chart.querySelector(".dropdown-controls-container");
      if (origContainer) {
        origContainer.style.setProperty("display", "none", "important");
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      fixDoubleAppRootAnchors(document);
      fixUsersAnchors(document);
      moveProyectosSearchBesideTitle();
      ensurePsTableStyle();
      hideResumenHeaderChrome();
    });
  } else {
    fixDoubleAppRootAnchors(document);
    fixUsersAnchors(document);
    moveProyectosSearchBesideTitle();
    ensurePsTableStyle();
    hideResumenHeaderChrome();
  }

  function isDashboardPage() {
    return (
      window.location.pathname.indexOf("/superset/dashboard/") !== -1 ||
      window.location.pathname.indexOf("/dashboard/") !== -1
    );
  }

  async function fetchLoggedUserName() {
    try {
      var res = await fetch(appRoot() + "/api/v1/me/", { credentials: "include" });
      if (!res.ok) return null;
      var payload = await res.json();
      var me = payload && payload.result ? payload.result : payload;
      if (!me) return null;
      var full = [me.first_name || "", me.last_name || ""].join(" ").trim();
      return full || me.username || me.email || null;
    } catch (err) {
      return null;
    }
  }

  function replaceOwnerWithLoggedUser(displayName) {
    if (!displayName || !isDashboardPage()) return false;
    var nodes = Array.prototype.slice.call(document.querySelectorAll("span,div,a"));
    var agoNode = nodes.find(function (el) {
      var t = (el.textContent || "").trim().toLowerCase();
      if (!t || t.length > 40) return false;
      return /(\bago\b|\bhace\b)/.test(t);
    });
    if (!agoNode || !agoNode.parentElement) return false;

    var container = agoNode.parentElement;
    var candidates = Array.prototype.slice
      .call(container.querySelectorAll("span,div,a"))
      .filter(function (el) {
        if (el === agoNode) return false;
        var t = (el.textContent || "").trim();
        if (!t || t.length > 80) return false;
        if (/(\bago\b|\bhace\b)/i.test(t)) return false;
        return true;
      });
    if (!candidates.length) return false;

    var ownerEl = candidates[candidates.length - 1];
    if ((ownerEl.textContent || "").trim() === displayName) return true;
    ownerEl.textContent = displayName;
    return true;
  }

  async function runPatch() {
    var name = await fetchLoggedUserName();
    if (!name) return;
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (replaceOwnerWithLoggedUser(name) || tries > 25) {
        clearInterval(timer);
      }
    }, 400);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runPatch);
  } else {
    runPatch();
  }
})();
</script>
