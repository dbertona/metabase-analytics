<script>
(function () {
  function appRoot() {
    return window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
  }

  // Bug APP_ROOT: ensureAppRoot() duplica /analytics en logout (y otros links).
  // Bootstrap ya trae /analytics/logout/ → el menú navega a /analytics/analytics/logout/.
  function collapseDoubleAppRoot(url) {
    if (!url) return url;
    return String(url).replace(/\/analytics\/analytics(\/|$)/g, "/analytics$1");
  }

  function fixDoubleAppRootAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll
      ? scope.querySelectorAll('a[href*="/analytics/analytics"]')
      : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href");
      var fixed = collapseDoubleAppRoot(href);
      if (fixed && fixed !== href) a.setAttribute("href", fixed);
    });
  }

  document.addEventListener(
    "click",
    function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var a = t.closest("a[href]");
      if (!a) return;
      var href = a.getAttribute("href") || "";
      // FAB Users sin APP_ROOT → Timesheet; forzar /analytics/users/...
      if (/^\/users(\/|$)/.test(href) || href.indexOf("://apps.powersolution.es/users/") !== -1) {
        ev.preventDefault();
        ev.stopPropagation();
        var path = href.replace(/^https?:\/\/[^/]+/, "");
        if (path.indexOf("/analytics/") !== 0) path = "/analytics" + path;
        path = collapseDoubleAppRoot(path);
        window.location.assign(path);
        return;
      }
      if (href.indexOf("/analytics/analytics") === -1) return;
      var fixed = collapseDoubleAppRoot(href);
      if (fixed === href) return;
      ev.preventDefault();
      ev.stopPropagation();
      window.location.assign(fixed);
    },
    true
  );

  function fixUsersAnchors(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll ? scope.querySelectorAll('a[href]') : [];
    Array.prototype.forEach.call(nodes, function (a) {
      var href = a.getAttribute("href") || "";
      if (!/^\/users(\/|$)/.test(href)) return;
      a.setAttribute("href", "/analytics" + href);
    });
  }

  var AG_GRID_CHART_SELECTORS = [
    "[data-test-chart-name*='Resumen mensual']",
  ];
  var AG_GRID_HEIGHT_SELECTORS = [
    "[data-test-chart-name*='Resumen mensual']",
    "[data-test-chart-name*='Proyectos']",
    "[data-test-chart-name*='Gastos']",
  ];

  /**
   * Altura estable de Gastos (pestaña Unidad).
   * Ancla en la base de la barra de pestañas (no en rect.top del chart, que
   * cambia mientras redimensionamos y provoca corto→alto→corto).
   */
  function measureGastosChromeBottom() {
    var nav = document.querySelector(
      ".dashboard-component-tabs .ant-tabs-nav, .ant-tabs-nav"
    );
    if (nav) {
      var nr = nav.getBoundingClientRect();
      if (nr.bottom > 40) return nr.bottom;
    }
    var filterBar = document.querySelector(
      ".filter-bar, .dashboard-header, [class*='FilterBar'], .native-filters-container"
    );
    if (filterBar) {
      var fr = filterBar.getBoundingClientRect();
      if (fr.bottom > 40) return fr.bottom + 40; // + tabs approx
    }
    return 160;
  }

  function isGastosChartVisible(chart) {
    if (!chart || !chart.getBoundingClientRect) return false;
    if (chart.offsetParent === null) return false;
    var rect = chart.getBoundingClientRect();
    // Tab activa: ancho real y dentro/near viewport
    return rect.width > 40 && rect.bottom > 0 && rect.top < window.innerHeight + 40;
  }

  function applyGastosHeightToChart(chart, target) {
    chart.style.setProperty("height", target + "px", "important");
    chart.style.setProperty("max-height", target + "px", "important");
    chart.style.removeProperty("min-height");

    var node = chart.parentElement;
    for (var i = 0; i < 10 && node && node !== document.body; i++) {
      var cls = node.className || "";
      if (
        cls.indexOf("dragdroppable") !== -1 ||
        cls.indexOf("dashboard-component") !== -1 ||
        cls.indexOf("grid-row") !== -1 ||
        cls.indexOf("resizable-container") !== -1 ||
        (node.getAttribute &&
          node.getAttribute("data-test") === "dashboard-component-chart-holder")
      ) {
        node.style.setProperty("height", target + "px", "important");
        node.style.setProperty("max-height", target + "px", "important");
        node.style.setProperty("min-height", target + "px", "important");
        node.style.setProperty("overflow", "hidden", "important");
      }
      node = node.parentElement;
    }

    // Propagar al grid interno YA (también sin ag-theme: estado "Esperando…")
    var sliceContainer = chart.querySelector(".slice_container");
    var chartContainer = chart.querySelector(".chart-container");
    var agTheme = chart.querySelector('[class*="ag-theme"]');
    // Misma fórmula que el CSS (:has → calc(var(--ps-gastos-h) - 56px)).
    // Si JS usa otro margen, ag-theme queda más bajo que .ag-root y recorta
    // la fila de totales (ag-floating-bottom).
    var available = Math.max(80, Math.floor(target - 56));

    [sliceContainer, chartContainer].forEach(function (el) {
      if (!el) return;
      el.style.setProperty("height", available + "px", "important");
      el.style.setProperty("max-height", available + "px", "important");
      el.style.setProperty("min-height", available + "px", "important");
      // visible: el holder ya recorta; hidden aquí comía el pie de totales
      el.style.setProperty("overflow", "visible", "important");
    });
    if (agTheme) {
      agTheme.style.setProperty("height", available + "px", "important");
      agTheme.style.setProperty("max-height", available + "px", "important");
      agTheme.style.setProperty("min-height", available + "px", "important");
      agTheme.style.setProperty("overflow", "visible", "important");
      var walk = agTheme.parentElement;
      while (walk && walk !== chart) {
        walk.style.setProperty("height", available + "px", "important");
        walk.style.setProperty("max-height", available + "px", "important");
        walk.style.setProperty("min-height", "0", "important");
        walk.style.setProperty("overflow", "visible", "important");
        walk = walk.parentElement;
      }
      [
        ".ag-root-wrapper",
        ".ag-root-wrapper-body",
        ".ag-root",
      ].forEach(function (sel) {
        var el = agTheme.querySelector(sel);
        if (!el) return;
        el.style.setProperty("height", available + "px", "important");
        el.style.setProperty("max-height", available + "px", "important");
        el.style.setProperty("min-height", available + "px", "important");
      });
      if (typeof agTheme.__psApiResize === "function") {
        try {
          agTheme.__psApiResize();
        } catch (e) {
          /* ignore */
        }
      }
    }
    labelAgGridTotalsRow(chart);
    ensureFloatingBottomVisible(chart);
  }

  /**
   * Si algún ancestro con overflow:hidden recorta ag-floating-bottom,
   * amplia ese contenedor lo mínimo para que el pie quede dentro.
   */
  function ensureFloatingBottomVisible(chart) {
    if (!chart) return;
    var bottom = chart.querySelector(".ag-floating-bottom");
    if (!bottom) return;
    var br = bottom.getBoundingClientRect();
    if (!(br.height > 0)) return;
    var el = bottom.parentElement;
    var guard = 0;
    while (el && el !== document.body && guard < 14) {
      guard += 1;
      var cs = window.getComputedStyle(el);
      var clips =
        cs.overflow === "hidden" ||
        cs.overflowY === "hidden" ||
        cs.overflow === "clip" ||
        cs.overflowY === "clip";
      if (clips) {
        var er = el.getBoundingClientRect();
        if (br.bottom > er.bottom + 1) {
          var need = Math.ceil(br.bottom - er.bottom) + 6;
          var nextH = Math.ceil(er.height + need);
          // No empujar el card fuera del viewport (Unidad no tiene scroll).
          var maxH = Math.floor(
            window.innerHeight - er.top - 10
          );
          if (maxH > 120 && nextH > maxH) nextH = maxH;
          el.style.setProperty("height", nextH + "px", "important");
          el.style.setProperty("max-height", nextH + "px", "important");
          el.style.setProperty("min-height", nextH + "px", "important");
          br = bottom.getBoundingClientRect();
        }
      }
      if (el === chart) break;
      el = el.parentElement;
    }
  }

  function computeGastosTargetHeight() {
    var chromeBottom = measureGastosChromeBottom();
    // Hueco tabs→card + margen inferior: el pie de totales debe quedar
    // DENTRO del viewport (en Unidad overflow-y del body está hidden).
    var gapBelowTabs = 10;
    var bottomPad = 36;
    var topAnchor = chromeBottom + gapBelowTabs;
    var target = Math.floor(window.innerHeight - topAnchor - bottomPad);
    if (target < 280) target = 280;
    return target;
  }

  /**
   * Si el card Gastos se sale por abajo del viewport, reduce altura.
   * Sin esto el pie Total queda fuera y no hay scroll de página en Unidad.
   */
  function clampGastosToViewport(chart) {
    if (!chart) return;
    var holder =
      chart.closest('[data-test="dashboard-component-chart-holder"]') || chart;
    var bottom = chart.querySelector(".ag-floating-bottom");
    var edge = bottom || holder;
    var br = edge.getBoundingClientRect();
    var limit = window.innerHeight - 10;
    var overflow = br.bottom - limit;
    if (!(overflow > 2)) return;
    var curH = holder.getBoundingClientRect().height;
    var next = Math.max(280, Math.floor(curH - overflow));
    publishGastosCssHeight(next);
    applyGastosHeightToChart(chart, next);
  }

  /** Publica --ps-gastos-h ANTES del paint del tab (evita flash corto→alto). */
  function publishGastosCssHeight(target) {
    var px = (typeof target === "number" ? target : computeGastosTargetHeight()) + "px";
    document.documentElement.style.setProperty("--ps-gastos-h", px);
  }

  function fillGastosViewportHeight() {
    var charts = document.querySelectorAll('[data-test-chart-name*="Gastos"]');
    var anyVisible = false;
    var target = computeGastosTargetHeight();
    publishGastosCssHeight(target);

    Array.prototype.forEach.call(charts, function (chart) {
      if (!isGastosChartVisible(chart)) return;
      anyVisible = true;
      applyGastosHeightToChart(chart, target);
      clampGastosToViewport(chart);
      ensureGastosColumnsFit(chart);
    });
    document.body.classList.toggle("ps-unidad-gastos-active", anyVisible);
    return anyVisible;
  }

  /** Tras abrir Unidad: pases cortos; la altura ya viene del CSS :has + --ps-gastos-h. */
  var _psGastosHeightBurstTimer = null;
  function burstFillGastosHeight() {
    if (_psGastosHeightBurstTimer) {
      clearTimeout(_psGastosHeightBurstTimer);
      _psGastosHeightBurstTimer = null;
    }
    publishGastosCssHeight();
    fillGastosViewportHeight();
    var delays = [0, 16, 50, 100, 200, 400, 700, 1200];
    delays.forEach(function (ms) {
      setTimeout(function () {
        fillGastosViewportHeight();
        fixAgGridHeightInner();
      }, ms);
    });
  }

  /**
   * Cuando AG Grid monta (tras "Esperando…"), nace ~464px y luego crece.
   * Observer: aplicar altura en el mismo momento en que aparece .ag-theme.
   */
  function bindGastosGridMountObserver() {
    if (document.documentElement.__psGastosGridMountObs) return;
    document.documentElement.__psGastosGridMountObs = true;
    try {
      var obs = new MutationObserver(function (mutations) {
        var hit = false;
        for (var i = 0; i < mutations.length && !hit; i++) {
          var m = mutations[i];
          var nodes = [];
          if (m.addedNodes && m.addedNodes.length) {
            Array.prototype.push.apply(nodes, m.addedNodes);
          }
          if (m.target) nodes.push(m.target);
          for (var j = 0; j < nodes.length; j++) {
            var n = nodes[j];
            if (!n || n.nodeType !== 1) continue;
            var cls = n.className && n.className.toString
              ? n.className.toString()
              : "";
            if (
              cls.indexOf("ag-theme") !== -1 ||
              cls.indexOf("slice_container") !== -1 ||
              (n.querySelector &&
                (n.querySelector('[class*="ag-theme"]') ||
                  n.querySelector(".slice_container")))
            ) {
              if (
                document.querySelector('[data-test-chart-name*="Gastos"]')
              ) {
                hit = true;
                break;
              }
            }
          }
        }
        if (hit) {
          fillGastosViewportHeight();
        }
      });
      obs.observe(document.body, {
        childList: true,
        subtree: true,
      });
    } catch (e) { /* ignore */ }
  }
  bindGastosGridMountObserver();

  function fixAgGridHeightInner() {
    AG_GRID_HEIGHT_SELECTORS.forEach(function (sel) {
      var charts = document.querySelectorAll(sel);
      Array.prototype.forEach.call(charts, function (chart) {
        // Gastos ya se ajusta en applyGastosHeightToChart
        if ((chart.getAttribute("data-test-chart-name") || "").indexOf("Gastos") !== -1) {
          return;
        }
        var header = chart.querySelector("[data-test='slice-header']");
        var sliceContainer = chart.querySelector(".slice_container");
        var chartContainer = chart.querySelector(".chart-container");
        var agTheme = chart.querySelector('[class*="ag-theme"]');
        if (!sliceContainer || !agTheme) return;

        var holderH = chart.getBoundingClientRect().height;
        var headerH = header ? header.getBoundingClientRect().height : 0;
        var available = Math.floor(holderH - headerH - 8);
        if (available < 80) return;

        [sliceContainer, chartContainer, agTheme].forEach(function (el) {
          if (!el) return;
          el.style.setProperty("height", available + "px", "important");
          el.style.setProperty("max-height", available + "px", "important");
          el.style.setProperty("min-height", available + "px", "important");
          el.style.setProperty("overflow", "hidden", "important");
        });
        var root = agTheme.querySelector(".ag-root-wrapper");
        if (root) {
          root.style.setProperty("height", available + "px", "important");
        }
      });
    });
    syncResumenProyectosEqualHeight();
  }

  /**
   * Ajusta alto interno de un chart AG Grid para que la fila de totales
   * (ag-floating-bottom) quede dentro del card (overflow:hidden).
   */
  function applyAgGridInnerHeight(chart, target) {
    if (!chart || !(target > 0)) return;
    chart.style.setProperty("height", target + "px", "important");
    chart.style.setProperty("max-height", target + "px", "important");
    chart.style.setProperty("min-height", target + "px", "important");

    var header = chart.querySelector("[data-test='slice-header']");
    var headerH = header ? header.getBoundingClientRect().height : 28;
    // Reservar ~40px para fila de totales + padding del card
    var available = Math.max(80, Math.floor(target - headerH - 40));
    var sliceContainer = chart.querySelector(".slice_container");
    var chartContainer = chart.querySelector(".chart-container");
    var agTheme = chart.querySelector('[class*="ag-theme"]');

    [sliceContainer, chartContainer, agTheme].forEach(function (el) {
      if (!el) return;
      el.style.setProperty("height", available + "px", "important");
      el.style.setProperty("max-height", available + "px", "important");
      el.style.setProperty("min-height", available + "px", "important");
      el.style.setProperty("overflow", "visible", "important");
    });
    if (agTheme) {
      var walk = agTheme.parentElement;
      while (walk && walk !== chart) {
        walk.style.setProperty("height", available + "px", "important");
        walk.style.setProperty("max-height", available + "px", "important");
        walk.style.setProperty("min-height", "0", "important");
        walk.style.setProperty("overflow", "visible", "important");
        walk = walk.parentElement;
      }
      [" .ag-root-wrapper", " .ag-root-wrapper-body", " .ag-root"].forEach(
        function (sel) {
          var el = agTheme.querySelector(sel.trim());
          if (!el) return;
          el.style.setProperty("height", available + "px", "important");
          el.style.setProperty("max-height", available + "px", "important");
        }
      );
      if (typeof agTheme.__psApiResize === "function") {
        try {
          agTheme.__psApiResize();
        } catch (e) {
          /* ignore */
        }
      }
    }
    labelAgGridTotalsRow(chart);
    ensureFloatingBottomVisible(chart);
  }

  /**
   * Sustituye «Resumen»/«Summary» del pie por «Total» (visible y en negrita).
   */
  function labelAgGridTotalsRow(chart) {
    if (!chart) return;
    var bottom = chart.querySelector(".ag-floating-bottom");
    if (!bottom) return;
    var dimIds = [
      "concepto_analitico",
      "proyecto",
      "ano_mes",
      "year",
      "month",
    ];
    var cells = bottom.querySelectorAll(".ag-cell");
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var id = cell.getAttribute("col-id") || "";
      var isDim = false;
      for (var d = 0; d < dimIds.length; d++) {
        if (id === dimIds[d] || id.indexOf(dimIds[d]) === 0) {
          isDim = true;
          break;
        }
      }
      if (!isDim && i > 0) continue;
      if (!isDim && i === 0) isDim = true;
      if (!isDim) continue;
      cell.style.setProperty("visibility", "visible", "important");
      var valEl =
        cell.querySelector(".ag-cell-value") ||
        cell.querySelector("[class*='cell']") ||
        cell;
      var cur = (valEl.textContent || "").replace(/\s+/g, " ").trim();
      if (
        !cur ||
        cur === "Resumen" ||
        cur === "Summary" ||
        cur === "N/A" ||
        /^total$/i.test(cur)
      ) {
        valEl.textContent = "Total";
      }
      cell.style.setProperty("font-weight", "700", "important");
    }
  }

  function labelAllAgGridTotals() {
    var sels = [
      '[data-test-chart-name*="Gastos"]',
      '[data-test-chart-name*="Proyectos"]',
      '[data-test-chart-name*="Resumen mensual"]',
    ];
    sels.forEach(function (sel) {
      var charts = document.querySelectorAll(sel);
      Array.prototype.forEach.call(charts, function (chart) {
        labelAgGridTotalsRow(chart);
      });
    });
  }

  /**
   * Resumen mensual y Proyectos: mismo alto, llenando hasta el pie del viewport
   * (aprovecha el espacio gris inferior en pantallas altas).
   */
  function syncResumenProyectosEqualHeight() {
    var active = document.querySelector(
      ".dashboard-component-tabs .ant-tabs-tab-active, .ant-tabs-tab-active"
    );
    var label = active ? (active.textContent || "").replace(/\s+/g, " ").trim() : "";
    // No tocar en Unidad/Gráficos
    if (/unidad|gráficos|graficos/i.test(label)) return;

    var resumen = document.querySelector(
      '[data-test-chart-name*="Resumen mensual"]'
    );
    var proyectos = document.querySelector(
      '[data-test-chart-name*="Proyectos"]'
    );
    if (!resumen || !proyectos) return;
    if (resumen.offsetParent === null || proyectos.offsetParent === null) return;

    var top = Math.min(
      resumen.getBoundingClientRect().top,
      proyectos.getBoundingClientRect().top
    );
    var bottomPad = 16;
    var viewportTarget = Math.floor(window.innerHeight - top - bottomPad);
    var layoutH = Math.max(
      Math.floor(resumen.getBoundingClientRect().height),
      Math.floor(proyectos.getBoundingClientRect().height)
    );
    // Preferir llenar viewport; no encoger por debajo del layout base
    var target = Math.max(viewportTarget, layoutH, 280);
    // Tope suave: no pedir más del viewport
    if (viewportTarget >= 200) target = viewportTarget;

    [resumen, proyectos].forEach(function (chart) {
      var node = chart.parentElement;
      for (var i = 0; i < 6 && node && node !== document.body; i++) {
        var cls = node.className || "";
        if (
          cls.indexOf("resizable-container") !== -1 ||
          cls.indexOf("dashboard-component") !== -1 ||
          cls.indexOf("dragdroppable") !== -1 ||
          cls.indexOf("grid-row") !== -1
        ) {
          node.style.setProperty("height", target + "px", "important");
          node.style.setProperty("min-height", target + "px", "important");
          node.style.setProperty("max-height", target + "px", "important");
          node.style.setProperty("overflow", "hidden", "important");
        }
        node = node.parentElement;
      }
      applyAgGridInnerHeight(chart, target);
    });
  }

  function fixAgGridHeight() {
    fillGastosViewportHeight();
    fixAgGridHeightInner();
  }

  function bindGastosTabHeightListeners() {
    if (document.documentElement.__psGastosTabHeightBound) return;
    document.documentElement.__psGastosTabHeightBound = true;

    var lastUnidad = false;
    function onTabMaybeChanged() {
      var active = document.querySelector(
        ".dashboard-component-tabs .ant-tabs-tab-active, .ant-tabs-tab-active"
      );
      var label = active ? (active.textContent || "").replace(/\s+/g, " ").trim() : "";
      var isUnidad = /unidad/i.test(label);
      var isResumen = /^Resumen$/i.test(label) || /^Resumen\b/i.test(label);
      if (isUnidad && !lastUnidad) {
        burstFillGastosHeight();
      } else if (!isUnidad && lastUnidad) {
        document.body.classList.remove("ps-unidad-gastos-active");
        // Al volver a Resumen: llenar pie del viewport + reasegurar totales visibles
        setTimeout(syncResumenProyectosEqualHeight, 0);
        setTimeout(syncResumenProyectosEqualHeight, 100);
        setTimeout(syncResumenProyectosEqualHeight, 400);
        setTimeout(syncResumenProyectosEqualHeight, 800);
      } else if (isResumen) {
        setTimeout(syncResumenProyectosEqualHeight, 0);
        setTimeout(syncResumenProyectosEqualHeight, 200);
        setTimeout(syncResumenProyectosEqualHeight, 600);
      }
      lastUnidad = isUnidad;
    }

    // pointerdown: publicar altura CSS ANTES de que Ant active el tabpane
    document.addEventListener(
      "pointerdown",
      function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var tab = t.closest(".ant-tabs-tab, [role='tab']");
        if (!tab) return;
        var label = (tab.textContent || "").replace(/\s+/g, " ").trim();
        if (/unidad/i.test(label)) {
          publishGastosCssHeight();
          document.body.classList.add("ps-unidad-gastos-active");
        }
      },
      true
    );

    document.addEventListener(
      "click",
      function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var tab = t.closest(".ant-tabs-tab, [role='tab']");
        if (!tab) return;
        // Tras el click Ant Design cambia la tab en el siguiente frame
        setTimeout(onTabMaybeChanged, 0);
        setTimeout(onTabMaybeChanged, 50);
      },
      true
    );

    // Altura CSS lista desde el primer load (Resumen también)
    publishGastosCssHeight();

    window.addEventListener("resize", function () {
      if (document.body.classList.contains("ps-unidad-gastos-active")) {
        fillGastosViewportHeight();
        fixAgGridHeightInner();
      } else {
        syncResumenProyectosEqualHeight();
      }
    });

    // Observar solo la barra de pestañas (no todo el body: evita bucles)
    function watchTabsNav() {
      var nav = document.querySelector(
        ".dashboard-component-tabs .ant-tabs-nav, .dashboard-component-tabs"
      );
      if (!nav || nav.__psGastosTabObs) return;
      nav.__psGastosTabObs = true;
      try {
        var obs = new MutationObserver(function () {
          onTabMaybeChanged();
        });
        obs.observe(nav, {
          subtree: true,
          attributes: true,
          attributeFilter: ["class", "aria-selected"],
        });
      } catch (e) { /* ignore */ }
    }
    watchTabsNav();
    setInterval(watchTabsNav, 2000);
  }

  bindGastosTabHeightListeners();

  /**
   * Localiza GridApi de AG Grid (fiber React + hooks del root DOM).
   */
  function findApiInFiberTree(fiber, maxNodes) {
    var queue = [fiber];
    var seen = 0;
    while (queue.length && seen < maxNodes) {
      var f = queue.shift();
      seen += 1;
      if (!f) continue;
      var props = f.memoizedProps || f.pendingProps;
      if (props) {
        if (props.api && typeof props.api.autoSizeAllColumns === "function") {
          return props.api;
        }
        if (props.gridApi && typeof props.gridApi.autoSizeAllColumns === "function") {
          return props.gridApi;
        }
        if (
          props.gridRef &&
          props.gridRef.current &&
          props.gridRef.current.api &&
          typeof props.gridRef.current.api.autoSizeAllColumns === "function"
        ) {
          return props.gridRef.current.api;
        }
      }
      if (f.stateNode) {
        var sn = f.stateNode;
        if (sn.api && typeof sn.api.autoSizeAllColumns === "function") return sn.api;
        if (sn.gridApi && typeof sn.gridApi.autoSizeAllColumns === "function") {
          return sn.gridApi;
        }
        if (
          sn.beans &&
          sn.beans.gridApi &&
          typeof sn.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return sn.beans.gridApi;
        }
      }
      var state = f.memoizedState;
      var sd = 0;
      while (state && sd < 40) {
        var ms = state.memoizedState;
        if (ms) {
          if (typeof ms.autoSizeAllColumns === "function") return ms;
          if (ms.current && typeof ms.current.autoSizeAllColumns === "function") {
            return ms.current;
          }
          if (ms.api && typeof ms.api.autoSizeAllColumns === "function") return ms.api;
        }
        state = state.next;
        sd += 1;
      }
      if (f.child) queue.push(f.child);
      if (f.sibling) queue.push(f.sibling);
    }
    return null;
  }

  function findAgGridApi(rootEl) {
    if (!rootEl) return null;
    var agRoot = rootEl.querySelector(".ag-root") || rootEl;
    var directKeys = Object.keys(agRoot);
    for (var di = 0; di < directKeys.length; di++) {
      var val = agRoot[directKeys[di]];
      if (val && typeof val === "object") {
        if (typeof val.autoSizeAllColumns === "function") return val;
        if (val.api && typeof val.api.autoSizeAllColumns === "function") return val.api;
        if (
          val.beans &&
          val.beans.gridApi &&
          typeof val.beans.gridApi.autoSizeAllColumns === "function"
        ) {
          return val.beans.gridApi;
        }
      }
    }
    var candidates = [rootEl, agRoot];
    for (var ci = 0; ci < candidates.length; ci++) {
      var el = candidates[ci];
      var keys = Object.keys(el);
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        if (
          key.indexOf("__reactFiber") === 0 ||
          key.indexOf("__reactInternalInstance") === 0
        ) {
          var api = findApiInFiberTree(el[key], 300);
          if (api) return api;
        }
      }
    }
    var nodes = rootEl.querySelectorAll(
      ".ag-root-wrapper, .ag-root, [class*='ag-theme']"
    );
    for (var ni = 0; ni < nodes.length; ni++) {
      var n = nodes[ni];
      var nkeys = Object.keys(n);
      for (var nj = 0; nj < nkeys.length; nj++) {
        var nk = nkeys[nj];
        if (
          nk.indexOf("__reactFiber") === 0 ||
          nk.indexOf("__reactInternalInstance") === 0
        ) {
          var a2 = findApiInFiberTree(n[nk], 200);
          if (a2) return a2;
        }
      }
    }
    return null;
  }

  /**
   * Superset llama sizeColumnsToFit() y ensancha al card. Lo redirigimos a
   * ajuste por contenido para evitar holgura y scroll horizontal.
   */
  function patchSizeColumnsToFit(api) {
    if (!api || api.__psAutosizePatched) return;
    if (typeof api.sizeColumnsToFit !== "function") return;
    api.__psAutosizePatched = true;
    api.sizeColumnsToFit = function () {
      try {
        /* no-op: el ajuste real lo hace fitColumnsByDomMeasure */
      } catch (err) {
        /* ignore */
      }
    };
  }

  /**
   * Mide cabecera + celdas y aplica anchos.
   * opts.pad / opts.lock / opts.fitViewport / opts.flexTextColumn
   * flexTextColumn: la columna de texto (proyecto / ano_mes) usa el resto del viewport;
   * las métricas (Fact., Coste, Margen %) quedan justas al contenido.
   */
  function isMetricColId(colId) {
    var id = String(colId || "");
    return /Fact|Coste|Margen|facturacion|coste|margen/i.test(id);
  }

  function isHiddenSortColId(colId) {
    var id = String(colId || "");
    return id === "year" || id === "month";
  }

  /** Orden cronológico de ano_mes (MM/YYYY) en cliente — sin columnas year/month. */
  function anoMesSortKey(value) {
    var m = String(value || "").match(/(\d{1,2})\s*\/\s*(\d{4})/);
    if (!m) return 0;
    return parseInt(m[2], 10) * 100 + parseInt(m[1], 10);
  }

  function sortResumenByAnoMes(api) {
    if (!api || typeof api.getColumnState !== "function") return;
    if (typeof api.applyColumnState !== "function") return;
    var state = api.getColumnState() || [];
    if (!state.length) return;

    var hasYear = false;
    var hasMonth = false;
    var yearSort = null;
    var monthSort = null;
    var sortedOther = false;

    for (var i = 0; i < state.length; i++) {
      var col = state[i];
      var id = String(col.colId || "");
      if (id === "year") {
        hasYear = true;
        yearSort = col.sort || null;
        continue;
      }
      if (id === "month") {
        hasMonth = true;
        monthSort = col.sort || null;
        continue;
      }
      if (col.sort) sortedOther = true;
    }

    // Priorizar columnas hidden year/month: garantizan cronología real.
    if (!hasYear || !hasMonth) return;
    if (yearSort === "asc" && monthSort === "asc" && !sortedOther) return;

    api.applyColumnState({
      defaultState: { sort: null, sortIndex: null },
      state: [
        { colId: "year", sort: "asc", sortIndex: 0 },
        { colId: "month", sort: "asc", sortIndex: 1 },
      ],
    });
  }

  /** year/month: ordenan pero no deben ocupar píxeles (hueco a la izquierda). */
  function collapseHiddenSortColumns(api) {
    if (!api) return;
    ["year", "month"].forEach(function (id) {
      try {
        if (typeof api.setColumnVisible === "function") {
          api.setColumnVisible(id, false);
        }
      } catch (e) {
        /* col aún no montada */
      }
    });
    if (typeof api.applyColumnState !== "function") return;
    api.applyColumnState({
      state: [
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
      ],
    });
  }

  function getViewportWidth(chart) {
    // Preferir cabecera: refleja el ancho útil real (sin gutter del scroll vertical).
    var vp =
      chart.querySelector(".ag-header-viewport") ||
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport");
    var avail = vp ? Math.floor(vp.clientWidth) : 0;
    if (avail < 80) {
      var root = chart.querySelector(".ag-root-wrapper") || chart;
      avail = Math.floor(root.getBoundingClientRect().width) - 8;
    }
    // Margen anti-scroll fantasma (bordes, subpixel, scrollbar vertical).
    return Math.max(0, avail - 20);
  }

  function getHorizontalOverflow(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport");
    if (!vp) return 0;
    return Math.max(0, vp.scrollWidth - vp.clientWidth);
  }

  /** Reduce la columna de texto hasta eliminar el scroll horizontal. */
  function shrinkTextColumnToClearScroll(chart, api) {
    if (!api || typeof api.getColumnState !== "function") return false;
    var overflow = getHorizontalOverflow(chart);
    if (overflow <= 1) return false;
    var cols = api.getColumnState() || [];
    var textCol = null;
    for (var i = 0; i < cols.length; i++) {
      var id = cols[i].colId;
      if (!id || id.charAt(0) === "_") continue;
      if (isHiddenSortColId(id) || isMetricColId(id)) continue;
      textCol = cols[i];
      break;
    }
    if (!textCol) return false;
    var cur = textCol.width || 200;
    var nw = Math.max(100, Math.floor(cur - overflow - 8));
    if (nw >= cur) return false;
    api.applyColumnState({
      state: [
        {
          colId: textCol.colId,
          width: nw,
          minWidth: Math.min(100, nw),
          maxWidth: nw,
          flex: null,
        },
      ],
      defaultState: { flex: null },
    });
    return true;
  }

  function fitColumnsByDomMeasure(chart, api, opts) {
    opts = opts || {};
    if (!api || typeof api.applyColumnState !== "function") return false;
    var headerCells = chart.querySelectorAll(".ag-header-viewport .ag-header-cell");
    if (!headerCells.length) return false;
    var sampleCell =
      chart.querySelector(".ag-center-cols-container .ag-cell") ||
      chart.querySelector(".custom-header") ||
      chart.querySelector(".ag-header-cell-text") ||
      chart.querySelector(".ag-header-cell");
    var font = sampleCell
      ? window.getComputedStyle(sampleCell).font
      : "14px 'Segoe UI', sans-serif";
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    if (!ctx) return false;
    ctx.font = font;
    var pad = typeof opts.pad === "number" ? opts.pad : 24;
    var state = [];
    Array.prototype.forEach.call(headerCells, function (hc) {
      var colId = hc.getAttribute("col-id");
      if (!colId || colId.charAt(0) === "_") return;
      if (isHiddenSortColId(colId)) return;
      var headerEl =
        hc.querySelector(".custom-header") ||
        hc.querySelector(".ag-header-cell-text") ||
        hc.querySelector(".ag-header-cell-label");
      var headerText = headerEl ? (headerEl.textContent || "").trim() : "";
      // Cabeceras de métricas: no usar texto truncado con ellipsis del DOM
      if (isMetricColId(colId)) {
        if (/margen/i.test(colId)) headerText = "Margen %";
        else if (/coste/i.test(colId)) headerText = "Coste";
        else if (/fact/i.test(colId)) {
          headerText =
            headerText.indexOf("Fact.") === 0 && headerText.length <= 6
              ? "Fact."
              : "Facturación";
        }
      }
      var maxPx = headerText
        ? Math.ceil(ctx.measureText(headerText).width) + pad
        : pad + 40;
      var bodyCells = chart.querySelectorAll(
        '.ag-center-cols-container .ag-cell[col-id="' + colId + '"]'
      );
      var limit = Math.min(bodyCells.length, 80);
      for (var i = 0; i < limit; i++) {
        // Normaliza saltos/espacios: evita medir texto ya envuelto por AG Grid.
        var t = (bodyCells[i].textContent || "").replace(/\s+/g, " ").trim();
        if (!t) continue;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      }
      var pinCells = chart.querySelectorAll(
        '.ag-floating-bottom .ag-cell[col-id="' + colId + '"]'
      );
      Array.prototype.forEach.call(pinCells, function (pc) {
        if (window.getComputedStyle(pc).visibility === "hidden") return;
        var t = (pc.textContent || "").replace(/\s+/g, " ").trim();
        if (!t) return;
        var w = Math.ceil(ctx.measureText(t).width) + pad;
        if (w > maxPx) maxPx = w;
      });
      if (maxPx < 44) maxPx = 44;
      // Tope a métricas: no hace falta más de ~140px salvo totales largos
      if (isMetricColId(colId) && maxPx > 160) maxPx = 160;
      var colState = { colId: colId, width: maxPx, flex: null };
      if (opts.lock || (opts.lockMetrics && isMetricColId(colId))) {
        colState.minWidth = maxPx;
        colState.maxWidth = maxPx;
      }
      state.push(colState);
    });
    if (!state.length) return false;

    // Incluir year/month a 0 en el mismo apply (evita hueco izquierdo)
    if (opts.collapseSortCols) {
      state.push(
        {
          colId: "year",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        },
        {
          colId: "month",
          hide: true,
          width: 0,
          minWidth: 0,
          maxWidth: 0,
          flex: null,
        }
      );
    }

    var avail = getViewportWidth(chart);

    if (opts.flexTextColumn && avail > 80) {
      var metricsTotal = 0;
      var textIdx = -1;
      for (var fi = 0; fi < state.length; fi++) {
        if (isHiddenSortColId(state[fi].colId)) continue;
        if (isMetricColId(state[fi].colId)) {
          metricsTotal += state[fi].width;
        } else if (textIdx === -1) {
          textIdx = fi;
        } else {
          metricsTotal += state[fi].width;
        }
      }
      if (textIdx >= 0) {
        // Columna texto = mayor de (ancho medido de contenido, espacio restante).
        // Sin maxWidth: el usuario puede ensanchar manualmente sin que AG Grid lo rechace.
        var naturalW = state[textIdx].width; // medido del textContent real
        var textW = Math.max(naturalW, avail - metricsTotal, 120);
        state[textIdx].width = textW;
        state[textIdx].minWidth = 100;
        // maxWidth intencionalmente NO fijado: permite resize manual libre.
        state[textIdx].flex = null;
      }
    } else if (opts.fitViewport && avail > 80) {
      var total = 0;
      for (var ti = 0; ti < state.length; ti++) {
        if (isHiddenSortColId(state[ti].colId)) continue;
        total += state[ti].width;
      }
      // Encoger SIEMPRE si no cabe (pantallas estrechas / card chica)
      if (total > avail) {
        var scale = (avail - 2) / total;
        for (var si = 0; si < state.length; si++) {
          if (isHiddenSortColId(state[si].colId)) continue;
          var nw = Math.max(48, Math.floor(state[si].width * scale));
          state[si].width = nw;
          if (opts.lock || (opts.lockMetrics && isMetricColId(state[si].colId))) {
            state[si].minWidth = nw;
            state[si].maxWidth = nw;
          }
        }
      }
    }

    api.applyColumnState({ state: state, defaultState: { flex: null } });
    // Tras medir visibles, forzar year/month a 0 (si no, dejan hueco a la izquierda)
    collapseHiddenSortColumns(api);
    return true;
  }

  function isResumenMensualChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Resumen mensual") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t.indexOf("Resumen mensual") !== -1;
  }

  function hasHorizontalScroll(chart) {
    var vp =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-horizontal-scroll-viewport") ||
      chart.querySelector(".ag-body-viewport");
    if (!vp) return false;
    return vp.scrollWidth > vp.clientWidth + 2;
  }

  // ─── Persistencia de anchos de columna — chart Proyectos ────────────────────
  //
  // Cuando el usuario termina de redimensionar una columna:
  //  1. Guarda en localStorage (respuesta inmediata, solo este browser).
  //  2. Llama a la API de Superset para actualizar column_config en la BD
  //     → todos los usuarios/dispositivos reciben el nuevo ancho en la próxima carga.
  //
  // La API usa la cookie de sesión (HTTPS) + token CSRF: no requiere credenciales
  // adicionales; funciona para cualquier usuario con rol Alpha/Admin en Superset.

  var PS_COL_STORAGE_KEY = "ps-proyectos-col-widths-v2";
  var PS_CHART_ID = 21;

  function isProyectosChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Proyectos") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Proyectos" || t.indexOf("Proyectos") === 0;
  }

  /** Devuelve {colId: width, ...} del estado actual del grid. */
  function getColWidthMap(api) {
    var state = api.getColumnState ? api.getColumnState() : null;
    if (!state) return null;
    var map = {};
    state.forEach(function (col) {
      if (col.colId && col.width && col.width > 0) map[col.colId] = col.width;
    });
    return Object.keys(map).length ? map : null;
  }

  /** Aplica un mapa {colId: width} al grid sin tocar orden ni visibilidad. */
  function applyColWidthMap(api, map) {
    if (!map || !api.applyColumnState) return;
    var state = Object.keys(map).map(function (id) {
      return { colId: id, width: map[id] };
    });
    try { api.applyColumnState({ state: state, applyOrder: false }); } catch (e) { /* ignore */ }
  }

  /**
   * Distribución inicial estable: las métricas quedan compactas y Proyectos
   * recibe todo el ancho restante del viewport.
   */
  function getDefaultProyectosWidths(chart) {
    var viewport =
      chart.querySelector(".ag-center-cols-viewport") ||
      chart.querySelector(".ag-body-viewport");
    var available = viewport ? viewport.clientWidth : chart.clientWidth;
    var metricTotal = 110 + 110 + 100;
    return {
      proyecto: Math.max(280, available - metricTotal),
      "Fact.": 110,
      Coste: 110,
      "Margen %": 100,
    };
  }

  /** Guarda en localStorage (fallback inmediato). */
  function saveWidthsLocal(map) {
    try { localStorage.setItem(PS_COL_STORAGE_KEY, JSON.stringify(map)); } catch (e) { /* ignore */ }
  }

  /** Lee de localStorage. */
  function loadWidthsLocal() {
    try {
      var raw = localStorage.getItem(PS_COL_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /**
   * Lee los anchos compartidos de la configuración del gráfico.
   * Solo acepta el estado cuando contiene las cuatro columnas; así, el
   * columnWidth inicial de Proyectos no se confunde con un ajuste guardado.
   */
  function loadWidthsFromSuperset() {
    var base = window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
    return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
      credentials: "same-origin",
    })
      .then(function (r) {
        if (!r.ok) return null;
        return r.json();
      })
      .then(function (chartData) {
        if (!chartData) return null;
        var params = JSON.parse((chartData.result || {}).params || "{}");
        var config = params.column_config || {};
        var ids = ["proyecto", "Fact.", "Coste", "Margen %"];
        var map = {};
        for (var i = 0; i < ids.length; i += 1) {
          var width = Number((config[ids[i]] || {}).columnWidth);
          if (!width || width <= 0) return null;
          map[ids[i]] = width;
        }
        return map;
      })
      .catch(function () { return null; });
  }

  /**
   * Llama a PUT /api/v1/chart/:id para actualizar columnWidth en column_config.
   * Usa la sesión del usuario logueado (cookie HTTPS + CSRF).
   * Si el usuario no tiene permisos de escritura, falla silenciosamente.
   */
  function saveWidthsToSuperset(map) {
    var base = window.location.pathname.indexOf("/analytics/") === 0 ? "/analytics" : "";
    // Paso 1: obtener token CSRF (la sesión ya está en la cookie)
    fetch(base + "/api/v1/security/csrf_token/", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (csrfData) {
        var csrf = csrfData.result;
        if (!csrf) return;
        // Paso 2: leer params actuales del chart
        return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
          credentials: "same-origin",
          headers: { "X-CSRFToken": csrf },
        })
          .then(function (r) { return r.json(); })
          .then(function (chartData) {
            var params = JSON.parse((chartData.result || {}).params || "{}");
            var cc = params.column_config || {};
            // Actualizar columnWidth por columna
            Object.keys(map).forEach(function (colId) {
              cc[colId] = cc[colId] || {};
              cc[colId].columnWidth = map[colId];
            });
            params.column_config = cc;
            // Paso 3: guardar
            return fetch(base + "/api/v1/chart/" + PS_CHART_ID, {
              method: "PUT",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrf,
                "Referer": window.location.origin + base + "/",
              },
              body: JSON.stringify({ params: JSON.stringify(params) }),
            });
          })
          .then(function (r) {
            if (r && r.ok) {
              console.log("[PS] Anchos de Proyectos guardados en Superset (todos los usuarios).");
            }
          });
      })
      .catch(function () { /* fallo silencioso: localStorage es el fallback */ });
  }

  var _psColSaveTimer = null;

  /**
   * Registra el listener de resize y blinda los anchos guardados.
   * Se inicializa una vez por instancia de grid (no por elemento DOM).
   *
   * Problema raíz: Superset llama api.sizeColumnsToFit() cuando terminan
   * de cargar los datos → sobrescribe lo que aplicamos desde localStorage.
   * Solución: parchar sizeColumnsToFit para que, si hay anchos guardados,
   * los re-aplique en lugar de igualar columnas. Sin estado guardado, las
   * métricas quedan compactas y Proyectos usa todo el espacio restante.
   */
  function initProyectosColPersist(chart, api) {
    // Guardia por instancia de API (no por DOM: el DOM puede recrearse)
    if (api.__psColPersistInit) return;
    api.__psColPersistInit = true;
    chart.__psColPersistInit = true;

    // ── 1. Parchear sizeColumnsToFit ──────────────────────────────────────
    // Cuando Superset llama sizeColumnsToFit() tras cargar datos,
    // interceptamos y re-aplicamos los anchos guardados.
    api.sizeColumnsToFit = function () {
      var saved = loadWidthsLocal();
      applyColWidthMap(api, saved || getDefaultProyectosWidths(chart));
    };

    // ── 2. Restaurar anchos guardados ahora ───────────────────────────────
    var saved = loadWidthsLocal();
    applyColWidthMap(api, saved || getDefaultProyectosWidths(chart));
    if (!saved) {
      // Un navegador nuevo obtiene el último estado compartido del gráfico.
      loadWidthsFromSuperset().then(function (shared) {
        if (!shared) return;
        saveWidthsLocal(shared);
        applyColWidthMap(api, shared);
      });
    }
    // Re-aplicar tras 500ms por si Superset aún no terminó de renderizar.
    setTimeout(function () {
      var s = loadWidthsLocal();
      applyColWidthMap(api, s || getDefaultProyectosWidths(chart));
    }, 500);

    // ── 3. Escuchar resize manual ─────────────────────────────────────────
    try {
      api.addEventListener("columnResized", function (e) {
        // Solo persistir un arrastre real del usuario, nunca nuestros ajustes.
        if (!e || !e.finished || e.source !== "uiColumnResized") return;
        var map = getColWidthMap(api);
        if (!map) return;
        saveWidthsLocal(map);
        if (_psColSaveTimer) clearTimeout(_psColSaveTimer);
        _psColSaveTimer = setTimeout(function () {
          saveWidthsToSuperset(map);
        }, 1000);
      });

  // ─── Persistencia / layout — chart Gastos (pestaña Unidad) ──────────────────
  var PS_GASTOS_COL_STORAGE_KEY = "ps-gastos-col-widths-v1";

  /**
   * AG Grid Table (Superset) ignora order_by_cols de dimensión y manda
   * ORDER BY primer metric (m01/"01" DESC). Reescribimos el body de /chart/data
   * para forzar ORDER BY concepto_analitico ASC — datos llegan ya ordenados,
   * sin reordenado client-side (refresh feo).
   */
  (function patchGastosChartDataOrder() {
    if (window.__psGastosOrderPatch) return;
    window.__psGastosOrderPatch = true;

    function rewriteBody(bodyStr) {
      if (!bodyStr || typeof bodyStr !== "string") return bodyStr;
      try {
        var body = JSON.parse(bodyStr);
        var queries = body.queries;
        if (!Array.isArray(queries)) return bodyStr;
        var changed = false;
        for (var i = 0; i < queries.length; i++) {
          var q = queries[i];
          if (!q) continue;
          var cols = q.columns || [];
          var hasConcepto = false;
          for (var j = 0; j < cols.length; j++) {
            var c = cols[j];
            if (c === "concepto_analitico") hasConcepto = true;
            else if (c && typeof c === "object" && (c.label === "concepto_analitico" || c.sqlExpression === "concepto_analitico")) {
              hasConcepto = true;
            }
          }
          if (!hasConcepto) continue;
          q.orderby = [["concepto_analitico", true]];
          changed = true;
        }
        return changed ? JSON.stringify(body) : bodyStr;
      } catch (e) {
        return bodyStr;
      }
    }

    if (typeof window.fetch === "function") {
      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = String(input && input.url ? input.url : input);
        if (url.indexOf("chart/data") !== -1 && init && init.body) {
          var next = rewriteBody(init.body);
          if (next !== init.body) {
            init = Object.assign({}, init, { body: next });
          }
        }
        return origFetch.call(this, input, init);
      };
    }

    var XO = XMLHttpRequest.prototype.open;
    var XS = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (method, url) {
      this.__psUrl = url;
      return XO.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function (body) {
      if (this.__psUrl && String(this.__psUrl).indexOf("chart/data") !== -1 && body) {
        body = rewriteBody(body);
      }
      return XS.call(this, body);
    };
  })();

  function isGastosChart(chart) {
    var name = chart.getAttribute("data-test-chart-name") || "";
    if (name.indexOf("Gastos") !== -1) return true;
    var title = chart.querySelector(
      '[data-test="slice-header"] .header-title, [data-test="slice-header"] .editable-title'
    );
    var t = title ? (title.textContent || "").replace(/\s+/g, " ").trim() : "";
    return t === "Gastos" || t.indexOf("Gastos") === 0;
  }

  function getDefaultGastosWidths(chart) {
    // Medir el card completo (no el center ya reducido por un pin previo).
    var holder =
      chart.closest('[data-test="dashboard-component-chart-holder"]') || chart;
    var available = Math.max(
      520,
      Math.floor(holder.getBoundingClientRect().width || chart.clientWidth || 1200) -
        24
    );
    // Total pinned a la derecha. Meses deben poder mostrar "713,072 €".
    var totalW = 118;
    var conceptoMin = 150;
    var monthMin = 70;
    var centerAvail = Math.max(400, available - totalW);
    var monthW = Math.floor((centerAvail - conceptoMin) / 12);
    if (monthW < monthMin) {
      monthW = monthMin;
      conceptoMin = Math.max(110, centerAvail - monthW * 12);
    }
    var concepto = centerAvail - monthW * 12;
    if (concepto < 110) {
      concepto = 110;
      monthW = Math.max(64, Math.floor((centerAvail - concepto) / 12));
      concepto = Math.max(110, centerAvail - monthW * 12);
    }
    while (concepto + monthW * 12 + totalW > available && monthW > 60) {
      monthW -= 1;
      concepto = Math.max(110, available - totalW - monthW * 12);
    }
    var map = {
      concepto_analitico: concepto,
      Total: totalW,
    };
    var months = [
      "01",
      "02",
      "03",
      "04",
      "05",
      "06",
      "07",
      "08",
      "09",
      "10",
      "11",
      "12",
    ];
    for (var i = 0; i < months.length; i++) map[months[i]] = monthW;
    return map;
  }

  /** Aplica anchos y fija Total a la derecha (siempre visible). */
  function applyGastosColumnLayout(api, chart) {
    if (!api || !chart) return;
    var map = getDefaultGastosWidths(chart);
    var state = Object.keys(map).map(function (id) {
      var row = { colId: id, width: map[id] };
      if (id === "Total") row.pinned = "right";
      else row.pinned = null;
      return row;
    });
    try {
      api.applyColumnState({ state: state, applyOrder: false });
    } catch (e) {
      /* ignore */
    }
  }

  function isGastosTotalClipped(chart) {
    var totalHeader =
      chart.querySelector('.ag-header-cell[col-id="Total"]') ||
      chart.querySelector('.ag-pinned-right-header .ag-header-cell[col-id="Total"]');
    if (!totalHeader) return true;
    var hr = totalHeader.getBoundingClientRect();
    if (hr.width < 90) return true;
    var holder =
      chart.closest('[data-test="dashboard-component-chart-holder"]') || chart;
    var cr = holder.getBoundingClientRect();
    if (hr.right > cr.right + 4) return true;

    var m12 = chart.querySelector('.ag-header-cell[col-id="12"]');
    if (m12 && m12.getBoundingClientRect().width < 58) return true;

   * Cabecera «Concepto Analitico».
   * NO aplicar sort en AG Grid: el orden viene de order_by_cols (SQL).
   * applyColumnState(sort) provoca un refresh feo (reordenado en cliente).

  function fixGastosConceptoColumn(api, chart) {
    if (!api) return;
    try {
      var defs = typeof api.getColumnDefs === "function" ? api.getColumnDefs() : null;
      if (defs && defs.length) {

        for (var i = 0; i < defs.length; i++) {

          if (id === "concepto_analitico" || id.indexOf("concepto_analitico") === 0) {
            if (d.headerName !== "Concepto Analitico") {

        if (changed && typeof api.setColumnDefs === "function") {

        var col = api.getColumn("concepto_analitico");

                api.autoSizeAllColumns({ skipHeader: false });

          sortResumenByAnoMes(api);

  /**
   * Facturación por Probabilidad (ECharts):
   * - título = mismo tamaño que otros charts (CSS global 16px)
   * - ejes/valores = mismo px que celdas AG Grid (1.26em)
   * Nota: en Superset 6 no existe window.echarts → hay que hallar la instancia en el DOM.
   */
  function getTableFontPx() {
    var cell = document.querySelector(
      "[data-test-chart-name*='Resumen mensual'] .ag-cell"
    );
    if (cell) {
      var fs = parseFloat(window.getComputedStyle(cell).fontSize);
      if (fs && fs >= 10) return Math.round(fs);
    }
    // Probe 1.26em (misma regla CSS de tablas) dentro del tema AG Grid
    var host =
      document.querySelector(
        "[data-test-chart-name*='Resumen mensual'] [class*='ag-theme']"
      ) || document.body;
    var probe = document.createElement("span");
    probe.style.cssText =
      "font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;" +
      "font-size:1.26em;position:absolute;left:-9999px;visibility:hidden;";
    probe.textContent = "Ag";
    host.appendChild(probe);
    var px = Math.round(parseFloat(window.getComputedStyle(probe).fontSize) || 0);
    host.removeChild(probe);
    return px >= 10 ? px : 20;
  }

  function findEchartsInstance(root) {
    if (!root) return null;
    var nodes = [root].concat(
      Array.prototype.slice.call(root.querySelectorAll("div"))
    );
    var apis = [window.echarts, window.echartsLib].filter(Boolean);
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      for (var a = 0; a < apis.length; a++) {
        try {
          if (typeof apis[a].getInstanceByDom === "function") {
            var byDom = apis[a].getInstanceByDom(el);
            if (byDom) return byDom;
          }
        } catch (e1) {
          /* ignore */
        }
      }
      // Propiedades propias del nodo (algunas builds cuelgan la instancia aquí)
      try {
        var keys = Object.keys(el);
        for (var k = 0; k < keys.length; k++) {
          var val = el[keys[k]];
          if (
            val &&
            typeof val === "object" &&
            typeof val.setOption === "function" &&
            typeof val.getOption === "function"
          ) {
            return val;
          }
        }
        // React fiber → ref con setOption
        var fiberKey = keys.filter(function (x) {
          return (
            x.indexOf("__reactFiber") === 0 ||
            x.indexOf("__reactInternalInstance") === 0
          );
        })[0];
        if (fiberKey) {
          var fiber = el[fiberKey];
          var depth = 0;
          while (fiber && depth < 50) {
            var st = fiber.memoizedState;
            var sDepth = 0;
            while (st && sDepth < 30) {
              var memo = st.memoizedState;
              if (memo && typeof memo.setOption === "function") return memo;
              if (
                memo &&
                memo.current &&
                typeof memo.current.setOption === "function"
              ) {
                return memo.current;
              }
              st = st.next;
              sDepth++;
            }
            var props = fiber.memoizedProps || fiber.pendingProps || {};
            if (props.echartsInstance && props.echartsInstance.setOption) {
              return props.echartsInstance;
            }
            if (props.chartInstance && props.chartInstance.setOption) {
              return props.chartInstance;
            }
            fiber = fiber.return;
            depth++;
          }
        }
      } catch (e2) {
        /* ignore */
      }
    }
    return null;
  }

  /**
   * Importe en miles con sufijo K€ (p. ej. 90000 → «90 K€»).
   * Evita el número completo y el «90 €» cuando el valor era la categoría.
   */
  function formatEuroAmount(val) {
    if (val == null || val === "") return "";
    var raw = String(val).replace(/[^\d.-]/g, "");
    var n = typeof val === "number" ? val : Number(raw);
    if (!isFinite(n)) return String(val);
    var k = Math.round(n / 1000);
    return (
      k.toLocaleString("es-ES", {
        maximumFractionDigits: 0,
      }) + " K€"
    );
  }

  /**
   * En barra horizontal ECharts el value suele ser [importe, categoría] o
   * [categoría, importe]. Elegimos el de mayor magnitud (facturación ≫ 0–100).
   */
  function pickSeriesAmount(p) {
    var v =
      p && p.value != null
        ? p.value
        : p && p.data != null
          ? p.data
          : null;
    if (v && typeof v === "object" && !Array.isArray(v) && v.value != null) {
      v = v.value;
    }
    if (Array.isArray(v)) {
      var best = null;
      for (var i = 0; i < v.length; i++) {
        var n = typeof v[i] === "number" ? v[i] : Number(v[i]);
        if (!isFinite(n)) continue;
        if (best == null || Math.abs(n) > Math.abs(best)) best = n;
      }
      return best != null ? best : v[v.length - 1];
    }
    return v;
  }

  /** Categoría probabilidad: 100 → 100% (sin tocar si ya lleva %). */
  function formatProbPct(val) {
    if (val == null || val === "") return "";
    var s = String(val).trim();
    if (s.charAt(s.length - 1) === "%") return s;
    return s + "%";
  }

  /**
   * Horizontal bar: eje categoría = yAxis (izq.), valores = xAxis (abajo).
   * Añade % a la izquierda e importes en K€ (eje, labels, tooltip).
   */
  function applyProbabilidadFont(inst, fontPx) {
    if (!inst || typeof inst.setOption !== "function") return;
    var color = "#0f172a";
    var labelStyle = {
      fontSize: fontPx,
      color: color,
      fontFamily: "'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif",
      fontWeight: 400,
    };
    try {
      var opt = inst.getOption() || {};
      var seriesPatch = [];
      var series = opt.series || [];
      for (var s = 0; s < series.length; s++) {
        seriesPatch.push({
          label: Object.assign(
            {
              show: true,
              formatter: function (p) {
                return formatEuroAmount(pickSeriesAmount(p));
              },
            },
            labelStyle
          ),
        });
      }
      if (!seriesPatch.length) {
        seriesPatch = [
          {
            label: Object.assign(
              {
                show: true,
                formatter: function (p) {
                  return formatEuroAmount(pickSeriesAmount(p));
                },
              },
              labelStyle
            ),
          },
        ];
      }
      inst.setOption(
        {
          textStyle: labelStyle,
          // Valor (importes) en horizontal → xAxis
          xAxis: [
            {
              name: "",
              axisLabel: Object.assign(
                {
                  formatter: function (v) {
                    return formatEuroAmount(v);
                  },
                },
                labelStyle
              ),
              nameTextStyle: labelStyle,
            },
          ],
          // Categoría (probabilidad) en horizontal → yAxis
          yAxis: [
            {
              name: "",
              axisLabel: Object.assign(
                {
                  formatter: function (v) {
                    return formatProbPct(v);
                  },
                },
                labelStyle
              ),
              nameTextStyle: labelStyle,
            },
          ],
          tooltip: {
            valueFormatter: function (v) {
              return formatEuroAmount(v);
            },
          },
          series: seriesPatch,
        },
        false
      );
      inst.__psProbFmt = fontPx;
    } catch (err) {
      /* remount */
    }
  }

  function bumpProbabilidadChartFonts() {
    var fontPx = getTableFontPx();
    var roots = document.querySelectorAll(
      '[data-test-chart-name*="Facturación por Probabilidad"]'
    );
    Array.prototype.forEach.call(roots, function (root) {
      var inst = findEchartsInstance(root);
      if (!inst) return;
      // Reaplicar: Superset puede pisar formatters en refresh sin recrear la instancia
      applyProbabilidadFont(inst, fontPx);
    });
  }

  /**
   * Fallback fiable: al dibujar texto en el canvas de Probabilidad,
   * sustituir el px de la fuente por el de las tablas (Superset no expone echarts global)
   * y añadir % / € si el texto aún no los trae.
   */
  function patchProbabilidadCanvasFonts() {
    if (window.__psProbCanvasFontPatched) return;
    window.__psProbCanvasFontPatched = true;
    var proto = CanvasRenderingContext2D.prototype;
    var origFill = proto.fillText;
    var origStroke = proto.strokeText;
    var PROB_RE = /^(100|90|70|50|30|10|0)$/;
    var AMOUNT_RE = /^-?[\d.,]+$/;
    var EURO_RE = /^(-?[\d.,]+)\s*€$/;
    function rewriteText(raw) {
      var t = String(raw == null ? "" : raw).trim();
      if (!t) return raw;
      if (t.indexOf("K€") !== -1) return raw;
      if (PROB_RE.test(t)) return t + "%";
      var euroM = t.match(EURO_RE);
      if (euroM) {
        var nEuro = Number(String(euroM[1]).replace(/[^\d.-]/g, ""));
        // Solo reconvertir importes reales; «90 €» erróneo (=categoría) no → K€
        if (isFinite(nEuro) && Math.abs(nEuro) > 100) {
          return formatEuroAmount(nEuro);
        }
        return raw;
      }
      if (AMOUNT_RE.test(t) && t.indexOf("%") === -1) {
        // Eje/valores grandes (p. ej. 2000000 o 2,000,000); no tocar 0–100 del eje cat.
        var n = Number(t.replace(/[^\d.-]/g, ""));
        if (isFinite(n) && Math.abs(n) > 100) return formatEuroAmount(n);
      }
      return raw;
    }
    function boost(ctx) {
      try {
        var canvas = ctx.canvas;
        if (!canvas || !canvas.closest) return;
        if (
          !canvas.closest(
            '[data-test-chart-name*="Facturación por Probabilidad"]'
          )
        ) {
          return;
        }
        var fontPx = getTableFontPx();
        var f = String(ctx.font || "");
        var next = f.replace(/\d+(\.\d+)?px/i, fontPx + "px");
        if (next === f) {
          next =
            "normal " +
            fontPx +
            "px 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif";
        }
        ctx.font = next;
        // Números de tabla son casi negros; ECharts usa gris claro
        if (typeof ctx.fillStyle === "string") {
          var s = ctx.fillStyle.toLowerCase();
          if (
            s.indexOf("rgb") === 0 ||
            s.charAt(0) === "#" ||
            s === "gray" ||
            s === "grey"
          ) {
            ctx.fillStyle = "#0f172a";
          }
        }
      } catch (e) {
        /* ignore */
      }
    }
    proto.fillText = function (text) {
      boost(this);
      var args = Array.prototype.slice.call(arguments);
      args[0] = rewriteText(text);
      return origFill.apply(this, args);
    };
    proto.strokeText = function (text) {
      boost(this);
      var args = Array.prototype.slice.call(arguments);
      args[0] = rewriteText(text);
      return origStroke.apply(this, args);
    };
  }

  patchProbabilidadCanvasFonts();

  /**
   * Localiza el chart «Resumen mensual» por atributo o por título del slice.
   */
  function findResumenMensualCharts() {
    var found = [];
    var byAttr = document.querySelectorAll(
      '.chart-slice[data-test-chart-name*="Resumen mensual"], [data-test-chart-name*="Resumen mensual"]'
    );
    Array.prototype.forEach.call(byAttr, function (el) {
      found.push(el);
    });
    var headers = document.querySelectorAll('[data-test="slice-header"]');
    Array.prototype.forEach.call(headers, function (h) {
      var titleEl =
        h.querySelector(".header-title") ||
        h.querySelector(".editable-title") ||
        h;
      var t = (titleEl.textContent || "").replace(/\s+/g, " ").trim();
      if (t.indexOf("Resumen mensual") === -1) return;
      var chart =
        h.closest(".chart-slice") ||
        h.closest('[data-test="chart-grid-component"]') ||
        h.closest(".dashboard-component-chart-holder");
      if (chart && found.indexOf(chart) === -1) found.push(chart);
    });
    return found;
  }

  /**
   * CSS forzado: oculta filtro/menú/resize en Resumen mensual.
   * Usa hermanos de .custom-header (estructura CustomHeader de Superset).
   */
  function ensurePsTableStyle() {
    var style = document.getElementById("ps-ag-grid-overrides");
    var css = [
      /* Hermanos del título = filtro + menú ⋮ */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .custom-header ~ *,',
      '[data-test-chart-name*="Resumen mensual"] .custom-header ~ *,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .header-filter,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .three-dots-menu,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell-resize,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell-menu-button,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-icon-filter,',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-icon,',
      '[data-test-chart-name*="Resumen mensual"] .header-filter,',
      '[data-test-chart-name*="Resumen mensual"] .three-dots-menu,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell-resize,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell-menu-button,',
      '[data-test-chart-name*="Resumen mensual"] .ag-icon-filter,',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-icon {',
      "  display: none !important;",
      "  visibility: hidden !important;",
      "  opacity: 0 !important;",
      "  width: 0 !important;",
      "  max-width: 0 !important;",
      "  height: 0 !important;",
      "  overflow: hidden !important;",
      "  pointer-events: none !important;",
      "  position: absolute !important;",
      "  left: -9999px !important;",
      "}",
      /* SVG del funnel de filtro (viewBox 24x24 con 3 barras) */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell svg[viewBox="0 0 24 24"],',
      '[data-test-chart-name*="Resumen mensual"] .ag-header-cell svg[viewBox="0 0 24 24"] {',
      "  display: none !important;",
      "}",
      /* year/month ocultos (orden cronológico) */
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell[col-id="year"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-cell[col-id="year"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-header-cell[col-id="month"],',
      '.chart-slice[data-test-chart-name*="Resumen mensual"] .ag-cell[col-id="month"] {',
      "  display: none !important;",
      "  width: 0 !important;",
      "  max-width: 0 !important;",
      "  padding: 0 !important;",
      "  border: none !important;",
      "}",
    ].join("\n");
    if (!style) {
      style = document.createElement("style");
      style.id = "ps-ag-grid-overrides";
      document.documentElement.appendChild(style);
    }
    if (style.textContent !== css) style.textContent = css;
  }

  function hideResumenHeaderChrome() {
    ensurePsTableStyle();
    var charts = findResumenMensualCharts();
    Array.prototype.forEach.call(charts, function (chart) {
      var nodes = chart.querySelectorAll(
        [
          ".header-filter",
          ".three-dots-menu",
          ".ag-header-cell-resize",
          ".ag-header-cell-menu-button",
          ".ag-icon-filter",
          ".ag-header-icon",
          ".custom-header ~ *",
          '.ag-header-cell svg[viewBox="0 0 24 24"]',
        ].join(",")
      );
      Array.prototype.forEach.call(nodes, function (el) {
        el.style.setProperty("display", "none", "important");
        el.style.setProperty("visibility", "hidden", "important");
        el.style.setProperty("opacity", "0", "important");
        el.style.setProperty("pointer-events", "none", "important");
        el.setAttribute("aria-hidden", "true");
      });
    });
  }

  // Observa el DOM: React re-monta cabeceras y vuelve a pintar el filtro
  if (!window.__psResumenFilterObserver) {
    try {
      var hideTimer = null;
      window.__psResumenFilterObserver = new MutationObserver(function () {
        if (hideTimer) return;
        hideTimer = setTimeout(function () {
          hideTimer = null;
          hideResumenHeaderChrome();
        }, 200);
      });
      window.__psResumenFilterObserver.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    } catch (err) {
      /* ignore */
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      fixDoubleAppRootAnchors(document);
      fixUsersAnchors(document);
      ensurePsTableStyle();
      hideResumenHeaderChrome();
    });
  } else {
    fixDoubleAppRootAnchors(document);
    fixUsersAnchors(document);
    ensurePsTableStyle();
    hideResumenHeaderChrome();
  }

  function isDashboardPage() {
    return (
      window.location.pathname.indexOf("/superset/dashboard/") !== -1 ||
      window.location.pathname.indexOf("/dashboard/") !== -1
    );
  }

  async function fetchLoggedUserName() {
    try {
      var res = await fetch(appRoot() + "/api/v1/me/", { credentials: "include" });
      if (!res.ok) return null;
      var payload = await res.json();
      var me = payload && payload.result ? payload.result : payload;
      if (!me) return null;
      var full = [me.first_name || "", me.last_name || ""].join(" ").trim();
      return full || me.username || me.email || null;
    } catch (err) {
      return null;
    }
  }

  function replaceOwnerWithLoggedUser(displayName) {
    if (!displayName || !isDashboardPage()) return false;
    var nodes = Array.prototype.slice.call(document.querySelectorAll("span,div,a"));
    var agoNode = nodes.find(function (el) {
      var t = (el.textContent || "").trim().toLowerCase();
      if (!t || t.length > 40) return false;
      return /(\bago\b|\bhace\b)/.test(t);
    });
    if (!agoNode || !agoNode.parentElement) return false;

    var container = agoNode.parentElement;
    var candidates = Array.prototype.slice
      .call(container.querySelectorAll("span,div,a"))
      .filter(function (el) {
        if (el === agoNode) return false;
        var t = (el.textContent || "").trim();
        if (!t || t.length > 80) return false;
        if (/(\bago\b|\bhace\b)/i.test(t)) return false;
        return true;
      });
    if (!candidates.length) return false;

    var ownerEl = candidates[candidates.length - 1];
    if ((ownerEl.textContent || "").trim() === displayName) return true;
    ownerEl.textContent = displayName;
    return true;
  }

  async function runPatch() {
    var name = await fetchLoggedUserName();
    if (!name) return;
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (replaceOwnerWithLoggedUser(name) || tries > 25) {
        clearInterval(timer);
      }
    }, 400);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runPatch);
  } else {
    runPatch();
  }
})();
</script>
